<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibe Bubble - 启动页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background: #050510;
    color: #fff;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* Canvas 粒子背景 */
  #bg-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* ===== 左上角品牌 ===== */
  .top-brand {
    position: fixed;
    top: 24px;
    left: 28px;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 10px;
    opacity: 0;
    animation: fadeIn 0.6s ease-out 0.3s forwards;
  }
  .top-brand .logo-small {
    width: 36px; height: 36px;
    border-radius: 50%;
    position: relative;
    flex-shrink: 0;
    background: radial-gradient(circle at 35% 35%, rgba(200,180,255,0.9), rgba(150,100,255,0.5) 40%, rgba(80,40,180,0.3) 70%, transparent 100%);
    box-shadow: 0 0 15px rgba(150,100,255,0.4), inset 0 0 10px rgba(255,255,255,0.15);
  }
  .top-brand .logo-small::after {
    content: '';
    position: absolute;
    top: 6px; left: 6px;
    width: 10px; height: 7px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,255,255,0.7), transparent 70%);
    transform: rotate(-30deg);
  }
  .top-brand .brand-text {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .top-brand .brand-text .cn {
    font-size: 17px;
    font-weight: 700;
    color: rgba(255,255,255,0.9);
    letter-spacing: 3px;
  }
  .top-brand .brand-text .en {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 2px;
  }

  /* ===== 右上角项目介绍 ===== */
  .top-nav {
    position: fixed;
    top: 24px;
    right: 28px;
    z-index: 20;
    opacity: 0;
    animation: fadeIn 0.6s ease-out 0.5s forwards;
  }
  .top-nav a {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: rgba(255,255,255,0.35);
    text-decoration: none;
    transition: color 0.3s;
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.06);
    background: rgba(255,255,255,0.02);
  }
  .top-nav a:hover {
    color: rgba(255,255,255,0.7);
    border-color: rgba(139,92,246,0.3);
    background: rgba(139,92,246,0.08);
  }
  .top-nav svg {
    width: 14px; height: 14px;
    opacity: 0.6;
  }

  /* 中心内容 */
  .content {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 100px);
    text-align: center;
    padding: 0 24px;
    max-width: 720px;
    margin: 0 auto;
    opacity: 0;
    transform: translateY(30px);
    animation: fadeInUp 0.8s ease-out 0.2s forwards;
  }

  @keyframes fadeInUp {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    to { opacity: 1; }
  }

  /* 标题区域容器 */
  .title-wrap {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 16px;
    width: 100%;
  }

  /* WebGL 气泡覆盖层（容器圆角裁切，Canvas 不裁切） */
  .hero-bubble-wrap {
    position: absolute;
    width: 504px;
    height: 504px;
    z-index: 2;
    pointer-events: none;
    opacity: 0;
    border-radius: 50%;
    overflow: hidden;
    animation: heroFadeIn 1.2s ease-out 0.3s forwards, bubbleBreathe 8s ease-in-out infinite 1.5s;
  }
  @keyframes heroFadeIn {
    from { opacity: 0; transform: scale(0.7); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes bubbleBreathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }
  #heroBubbleCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* 主标题 - 光线透过气泡照射效果 */
  .main-title {
    position: relative;
    z-index: 1;
    font-size: clamp(96px, 24vw, 240px);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
    opacity: 0;
    animation: fadeInUp 0.6s ease-out 0.5s forwards;
  }
  .main-title span {
    position: relative;
    display: inline-block;
    background: linear-gradient(135deg, #c4b5fd 0%, #a78bfa 30%, #60a5fa 60%, #38bdf8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    opacity: 0.95;
  }

  /* 副标题 */
  .subtitle {
    font-size: clamp(16px, 3vw, 20px);
    color: rgba(255,255,255,0.7);
    font-weight: 300;
    letter-spacing: 1px;
    margin-bottom: 40px;
    opacity: 0;
    animation: fadeIn 0.6s ease-out 0.7s forwards;
  }

  /* 主按钮 */
  .cta-btn {
    position: relative;
    margin-top: 300px;
    padding: 16px 40px;
    border-radius: 9999px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid rgba(139,92,246,0.4);
    background: linear-gradient(135deg, rgba(139,92,246,0.2), rgba(56,189,248,0.2));
    box-shadow: 0 0 20px rgba(139,92,246,0.15);
    transition: all 0.3s ease;
    opacity: 0;
    animation: btnPop 0.5s ease-out 0.9s forwards;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: fit-content;
    margin: 0 auto;
    line-height: 1;
  }
  @keyframes btnPop {
    0% { opacity: 0; transform: scale(0.9); }
    60% { transform: scale(1.05); }
    100% { opacity: 1; transform: scale(1); }
  }
  .cta-btn .btn-text {
    background: linear-gradient(90deg, #c4b5fd, #38bdf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    white-space: nowrap;
    line-height: 1;
    vertical-align: middle;
  }
  .cta-btn .btn-text svg {
    transition: transform 0.3s ease;
    -webkit-text-fill-color: #c4b5fd;
    flex-shrink: 0;
    display: block;
  }
  .cta-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 40px rgba(139,92,246,0.3);
    border-color: rgba(139,92,246,0.7);
  }
  .cta-btn:hover .btn-text svg {
    transform: translateX(4px);
  }
  .cta-btn:active {
    transform: scale(0.96);
  }
  .cta-btn:disabled {
    opacity: 0.7;
    cursor: default;
    transform: none;
  }

  /* 底部简介 */
  .bottom-area {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding-bottom: 24px;
    padding-top: 8px;
    pointer-events: none;
  }
  .intro {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    line-height: 1.6;
    white-space: nowrap;
    opacity: 0;
    animation: fadeIn 0.6s ease-out 1.1s forwards;
  }

  /* ===== 过渡气泡层 ===== */
  .burst-layer {
    position: fixed;
    inset: 0;
    z-index: 50;
    pointer-events: none;
  }
  .burst-bubble {
    position: absolute;
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0);
    animation: burstAnim 1.2s ease-out forwards;
  }
  @keyframes burstAnim {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
    30% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.9; }
    100% { transform: translate(var(--tx), var(--ty)) scale(1); opacity: 0; }
  }

  /* 页面淡出 */
  .page-fadeout {
    animation: pageOut 0.5s ease-in forwards;
  }
  @keyframes pageOut {
    to { opacity: 0; }
  }

  /* 移动端适配 */
  @media (max-width: 480px) {
    .top-brand { top: 16px; left: 16px; }
    .top-brand .logo-small { width: 30px; height: 30px; }
    .top-brand .brand-text .cn { font-size: 14px; }
    .top-brand .brand-text .en { font-size: 9px; }
    .top-nav { top: 16px; right: 16px; }
    .top-nav a { font-size: 12px; padding: 5px 10px; }
    .hero-bubble-wrap { width: 392px; height: 392px; }
    .intro { white-space: normal; font-size: 12px; padding: 0 20px; text-align: center; }
    .cta-btn { padding: 14px 28px; font-size: 14px; }
  }
</style>
</head>
<body>

<!-- Canvas 气泡粒子背景 -->
<canvas id="bg-canvas"></canvas>

<!-- 左上角品牌 -->
<div class="top-brand">
  <div class="logo-small"></div>
  <div class="brand-text">
    <div class="cn">灵感气泡</div>
    <div class="en">vibe bubble</div>
  </div>
</div>

<!-- 右上角项目介绍 -->
<div class="top-nav">
  <a href="about.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
    <span>项目介绍</span>
  </a>
</div>

<!-- 中心内容 -->
<div class="content" id="content">
  <!-- 标题区域：WebGL 气泡覆盖文字 -->
  <div class="title-wrap">
    <div class="hero-bubble-wrap" aria-hidden="true">
      <canvas id="heroBubbleCanvas"></canvas>
    </div>
    <h1 class="main-title"><span>Vibe Bubble</span></h1>

  <p class="subtitle">Discover what people are building with AI.</p>

  <button class="cta-btn" id="ctaBtn" onclick="handleEnter(event)">
    <span class="btn-text">
      发现灵感
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </span>
  </button>

</div>

<!-- 底部简介 -->
<div class="bottom-area">
  <p class="intro">
    一个收集真实 Vibe Coding 案例的灵感库，帮你发现灵感，动手实现你自己的小项目。
  </p>
</div>

<!-- 气泡冒出层 -->
<div class="burst-layer" id="burstLayer"></div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

// ==================== WebGL Shader 气泡（复用 gallery.html）====================
const bubbleVertexShader = `
varying vec3 vNormal;
varying vec3 vPosition;
varying vec2 vUv;

void main() {
  vNormal = normalize(normalMatrix * normal);
  vPosition = (modelViewMatrix * vec4(position, 1.0)).xyz;
  vUv = uv;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}
`;

const bubbleFragmentShader = `
uniform float uTime;
uniform vec3 uColor1;
uniform vec3 uColor2;
uniform vec3 uColor3;
uniform float uOpacity;

varying vec3 vNormal;
varying vec3 vPosition;
varying vec2 vUv;

vec3 thinFilmIridescence(float cosTheta, float filmThickness) {
  float phase = filmThickness * sqrt(1.0 - cosTheta * cosTheta) * 3.14159;
  float r = 0.5 + 0.5 * cos(phase);
  float g = 0.5 + 0.5 * cos(phase - 2.094);
  float b = 0.5 + 0.5 * cos(phase - 4.189);
  return vec3(r, g, b);
}

void main() {
  vec3 viewDir = normalize(-vPosition);
  vec3 normal = normalize(vNormal);
  float ndotv = abs(dot(viewDir, normal));

  float fresnel = pow(1.0 - ndotv, 1.5);
  float fresnelSoft = pow(1.0 - ndotv, 0.8);

  float filmThickness = 6.0 + sin(uTime * 0.8) * 3.0 + sin(uTime * 1.3 + vUv.x * 6.28) * 1.5;
  vec3 irid = thinFilmIridescence(ndotv, filmThickness);

  vec3 filmColor = mix(uColor1, uColor2, irid.r);
  filmColor = mix(filmColor, uColor3, irid.g * 0.7);
  filmColor = mix(filmColor, vec3(0.9, 0.6, 0.3), irid.b * 0.4);

  vec3 lightDir = normalize(vec3(1.0, 1.0, 2.0));
  vec3 halfDir = normalize(lightDir + viewDir);
  float spec = pow(max(dot(normal, halfDir), 0.0), 64.0);

  vec3 reflectDir = reflect(-viewDir, normal);
  float envSpec = pow(max(dot(reflectDir, vec3(0.0, 1.0, 0.0)), 0.0), 2.0);

  vec3 innerReflect = vec3(0.3, 0.2, 0.5) * (1.0 - fresnelSoft) * 0.15;

  vec3 color = vec3(0.0);
  color += filmColor * fresnel * 1.5;
  color += vec3(1.0, 0.95, 0.9) * spec * 2.0;
  color += vec3(0.7, 0.8, 1.0) * envSpec * 0.3;
  color += vec3(0.6, 0.3, 0.9) * fresnel * 0.25;
  color += innerReflect;

  float centerAlpha = fresnel * uOpacity * 1.0 + spec * 0.5 + 0.08;
  centerAlpha = clamp(centerAlpha, 0.0, 0.92);

  float rim = pow(1.0 - ndotv, 4.0);
  color += vec3(0.9, 0.85, 1.0) * rim * 0.4;

  gl_FragColor = vec4(color, centerAlpha);
}
`;

// 紫粉梦幻色板
const HERO_PALETTE = [[0.6, 0.2, 0.9], [0.95, 0.4, 0.7], [0.4, 0.6, 1.0]];

/**
 * 初始化标题上方 WebGL 气泡
 */
function initHeroBubble() {
  const canvas = document.getElementById('heroBubbleCanvas');
  const container = document.querySelector('.hero-bubble-wrap');
  if (!canvas || !container) return;

  const w = container.offsetWidth;
  const h = container.offsetHeight;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 100);
  camera.position.z = 105;

  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const geometry = new THREE.SphereGeometry(45, 64, 64);
  const palette = HERO_PALETTE;
  const material = new THREE.ShaderMaterial({
    vertexShader: bubbleVertexShader,
    fragmentShader: bubbleFragmentShader,
    uniforms: {
      uTime: { value: 0 },
      uColor1: { value: new THREE.Vector3(...palette[0]) },
      uColor2: { value: new THREE.Vector3(...palette[1]) },
      uColor3: { value: new THREE.Vector3(...palette[2]) },
      uOpacity: { value: 0.9 }
    },
    transparent: true,
    side: THREE.FrontSide,
    depthWrite: false
  });

  const mesh = new THREE.Mesh(geometry, material);
  scene.add(mesh);

  window.addEventListener('resize', () => {
    const nw = container.offsetWidth;
    const nh = container.offsetHeight;
    camera.aspect = nw / nh;
    camera.updateProjectionMatrix();
    renderer.setSize(nw, nh);
  });

  let startTime = performance.now();
  function animate() {
    const t = (performance.now() - startTime) * 0.001;
    material.uniforms.uTime.value = t;
    mesh.position.x = Math.sin(t * 0.5) * 0.8;
    mesh.position.y = Math.cos(t * 0.4) * 0.6;
    mesh.rotation.y = t * 0.15;
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }
  animate();
}

/**
 * 生成过渡 WebGL 气泡（从按钮位置冒出）
 */
function createTransitionBubble(x, y, size, delay, tx, ty) {
  const container = document.createElement('div');
  container.style.cssText = `position:fixed;left:${x}px;top:${y}px;width:${size}px;height:${size}px;z-index:100;pointer-events:none;border-radius:50%;overflow:hidden;transform:translate(-50%,-50%) scale(0);opacity:1;`;

  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  container.appendChild(canvas);
  document.getElementById('burstLayer').appendChild(container);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  camera.position.z = 70;

  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setSize(size, size);

  const geometry = new THREE.SphereGeometry(28, 32, 32);
  const palette = [
    [0.6 + Math.random()*0.3, 0.2 + Math.random()*0.4, 0.8 + Math.random()*0.2],
    [0.8 + Math.random()*0.2, 0.3 + Math.random()*0.4, 0.6 + Math.random()*0.3],
    [0.3 + Math.random()*0.3, 0.5 + Math.random()*0.4, 0.9 + Math.random()*0.1]
  ];
  const material = new THREE.ShaderMaterial({
    vertexShader: bubbleVertexShader,
    fragmentShader: bubbleFragmentShader,
    uniforms: {
      uTime: { value: Math.random() * 10 },
      uColor1: { value: new THREE.Vector3(...palette[0]) },
      uColor2: { value: new THREE.Vector3(...palette[1]) },
      uColor3: { value: new THREE.Vector3(...palette[2]) },
      uOpacity: { value: 0.85 }
    },
    transparent: true,
    side: THREE.FrontSide,
    depthWrite: false
  });

  const mesh = new THREE.Mesh(geometry, material);
  scene.add(mesh);

  // CSS 动画：从按钮位置飞出
  container.style.transition = `transform 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) ${delay}s, opacity 1.0s ease-out ${delay + 0.3}s`;

  requestAnimationFrame(() => {
    container.style.transform = `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(1)`;
    container.style.opacity = '0';
  });

  // WebGL 渲染循环（短生命周期）
  let frameCount = 0;
  function renderFrame() {
    if (frameCount++ < 90) {
      material.uniforms.uTime.value += 0.016;
      mesh.rotation.y += 0.02;
      renderer.render(scene, camera);
      requestAnimationFrame(renderFrame);
    } else {
      container.remove();
    }
  }
  requestAnimationFrame(renderFrame);
}

// 启动标题气泡
initHeroBubble();

// 暴露给全局用于按钮点击
window.createTransitionBubble = createTransitionBubble;
</script>

<script>
// ==================== Canvas 气泡粒子背景 ====================
(function() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let bubbles = [];
  let animationId;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    initBubbles();
  }

  function initBubbles() {
    const count = Math.min(Math.floor((canvas.width * canvas.height) / 22000), 70);
    bubbles = Array.from({ length: count }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 35 + 8,
      speedX: (Math.random() - 0.5) * 0.25,
      speedY: -Math.random() * 0.35 - 0.08,
      opacity: Math.random() * 0.22 + 0.04,
      hue: Math.random() * 140 + 220,
      phase: Math.random() * Math.PI * 2,
    }));
  }

  function drawBubble(b, time) {
    const wobble = Math.sin(time * 0.001 + b.phase) * 2;
    const r = b.radius + wobble;

    const grad = ctx.createRadialGradient(b.x - r * 0.3, b.y - r * 0.3, 0, b.x, b.y, r);
    grad.addColorStop(0, 'hsla(' + b.hue + ',80%,75%,' + (b.opacity * 0.6) + ')');
    grad.addColorStop(0.4, 'hsla(' + (b.hue + 20) + ',70%,60%,' + (b.opacity * 0.3) + ')');
    grad.addColorStop(0.8, 'hsla(' + (b.hue + 40) + ',60%,50%,' + (b.opacity * 0.15) + ')');
    grad.addColorStop(1, 'hsla(' + (b.hue + 60) + ',50%,40%,0)');

    ctx.beginPath();
    ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(b.x - r * 0.32, b.y - r * 0.32, r * 0.22, 0, Math.PI * 2);
    ctx.fillStyle = 'hsla(' + b.hue + ',30%,95%,' + (b.opacity * 0.5) + ')';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
    ctx.strokeStyle = 'hsla(' + b.hue + ',60%,70%,' + (b.opacity * 0.3) + ')';
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }

  function animate(time) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    bubbles.forEach(function(b) {
      b.x += b.speedX + Math.sin(time * 0.0005 + b.phase) * 0.2;
      b.y += b.speedY;
      if (b.y < -b.radius * 2) { b.y = canvas.height + b.radius * 2; b.x = Math.random() * canvas.width; }
      if (b.x < -b.radius) b.x = canvas.width + b.radius;
      if (b.x > canvas.width + b.radius) b.x = -b.radius;
      drawBubble(b, time);
    });
    animationId = requestAnimationFrame(animate);
  }

  resize();
  window.addEventListener('resize', resize);
  animationId = requestAnimationFrame(animate);
})();

// ==================== 按钮气泡冒出动效 ====================
function handleEnter(e) {
  const btn = document.getElementById('ctaBtn');
  const layer = document.getElementById('burstLayer');
  const content = document.getElementById('content');
  btn.disabled = true;

  const rect = btn.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  // 优先使用 WebGL 气泡过渡（如果模块已加载）
  if (window.createTransitionBubble) {
    for (let i = 0; i < 16; i++) {
      const angle = (Math.PI * 2 * i) / 16 + (Math.random() - 0.5) * 0.6;
      const dist = 60 + Math.random() * 350;
      const size = 30 + Math.random() * 70;
      const tx = Math.cos(angle) * dist;
      const ty = Math.sin(angle) * dist;
      const delay = Math.random() * 0.25;
      window.createTransitionBubble(cx, cy, size, delay, tx, ty);
    }
  } else {
    // 降级：CSS 气泡
    for (let i = 0; i < 24; i++) {
      const angle = (Math.PI * 2 * i) / 24 + (Math.random() - 0.5) * 0.5;
      const dist = 80 + Math.random() * 300;
      const size = 20 + Math.random() * 80;
      const hue = 220 + Math.random() * 140;
      const tx = Math.cos(angle) * dist;
      const ty = Math.sin(angle) * dist;

      const el = document.createElement('div');
      el.className = 'burst-bubble';
      el.style.left = cx + 'px';
      el.style.top = cy + 'px';
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.setProperty('--tx', 'calc(-50% + ' + tx + 'px)');
      el.style.setProperty('--ty', 'calc(-50% + ' + ty + 'px)');
      el.style.background = 'radial-gradient(circle at 35% 35%, hsla(' + hue + ',80%,85%,0.8), hsla(' + (hue + 20) + ',70%,60%,0.4) 45%, hsla(' + (hue + 40) + ',60%,40%,0.1) 70%, transparent)';
      el.style.boxShadow = '0 0 ' + (size * 0.6) + 'px hsla(' + hue + ',60%,60%,0.3), inset 0 0 ' + (size * 0.3) + 'px rgba(255,255,255,0.2)';
      el.style.animationDelay = (Math.random() * 0.3) + 's';
      layer.appendChild(el);
    }
  }

  setTimeout(function() {
    content.classList.add('page-fadeout');
  }, 800);
  setTimeout(function() {
    window.location.href = './gallery.html';
  }, 1300);
}
</script>
