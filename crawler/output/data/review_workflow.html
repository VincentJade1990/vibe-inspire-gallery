<div class="header">
  <h1>🫧 Vibe Coding 灵感库 - 数据审核工作台</h1>
  <div class="stats">
    <div>帖子: <span id="postCount">0</span></div>
    <div>评论: <span id="commentCount">0</span></div>
    <div>已审核: <span id="reviewedCount">0</span></div>
    <div>有价值: <span id="approvedCount" style="color:#00ff88">0</span></div>
    <div>图片: <span id="imageCount">0</span></div>
  </div>
</div>

<div class="controls">
  <button onclick="filterAll()" class="active" id="btnAll">全部</button>
  <button onclick="filterPending()" id="btnPending">待审核</button>
  <button onclick="filterApproved()" id="btnApproved">有价值</button>
  <button onclick="filterRejected()" id="btnRejected">无价值</button>
  <button onclick="filterWithImages()" id="btnImages">有图片</button>
  <button onclick="filterCustom()" id="btnCustom">自定义</button>
  <select onchange="filterByPost(this.value)">
    <option value="">所有帖子</option>
  </select>
  <div class="search">
    <input type="text" id="searchInput" placeholder="搜索关键词..." oninput="doSearch(this.value)">
  </div>
  <button onclick="expandAll()">展开全部</button>
  <button onclick="collapseAll()">收起全部</button>
  <button onclick="openCreateModal()" class="btn-create">+ 新建案例</button>
  <button onclick="document.getElementById('importFile').click()" class="btn-import">导入JSON</button>
  <input type="file" id="importFile" accept=".json" style="display:none" onchange="importCases(this)">
</div>

<div class="content" id="content"></div>

<div class="export-bar">
  <div>已标记有价值: <span class="count" id="exportCount">0</span> 条</div>
  <button onclick="exportApproved()">导出审核结果 (JSON)</button>
</div>


<!-- 新建案例模态框 -->
<div class="modal-overlay" id="createModal">
  <div class="modal">
    <h3>+ 新建灵感案例</h3>
    <label>项目标题 *</label>
    <input type="text" id="newTitle" placeholder="例如：AI健身教练">
    <label>用户名 *</label>
    <input type="text" id="newUsername" placeholder="例如：铁男momo君">
    <label>评论内容 *</label>
    <textarea id="newContent" placeholder="详细描述这个项目..."></textarea>
    <label>点赞数</label>
    <input type="number" id="newLikes" value="0" min="0">
    <label>标签 (逗号分隔)</label>
    <input type="text" id="newTags" placeholder="小程序,AI应用,教育...">
    <label>难度</label>
    <select id="newDifficulty">
      <option value="零基础">零基础</option>
      <option value="入门" selected>入门</option>
      <option value="进阶">进阶</option>
    </select>
    <label>图片URL (每行一个，可选)</label>
    <textarea id="newImages" placeholder="http://example.com/image1.jpg
http://example.com/image2.jpg"></textarea>
    <label>来源平台</label>
    <input type="text" id="newPlatform" value="xiaohongshu">
    <label>来源链接 (可选)</label>
    <input type="text" id="newSourceUrl" placeholder="https://www.xiaohongshu.com/...">
    <div class="modal-actions">
      <button class="btn-primary" onclick="saveNewCase()">创建案例</button>
      <button class="btn-secondary" onclick="closeCreateModal()">取消</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="close">&times;</span>
  <img id="lightboxImg" src="">
</div>

let reviewStatus = {};
let editData = {};
let customCases = []; // 手动创建和导入的案例

// localStorage持久化
function saveToStorage() {
  localStorage.setItem('vibe_review_status', JSON.stringify(reviewStatus));
  localStorage.setItem('vibe_edit_data', JSON.stringify(editData));
  localStorage.setItem('vibe_custom_cases', JSON.stringify(customCases));
}
function loadFromStorage() {
  try {
    const rs = localStorage.getItem('vibe_review_status');
    const ed = localStorage.getItem('vibe_edit_data');
    const cc = localStorage.getItem('vibe_custom_cases');
    if (rs) reviewStatus = JSON.parse(rs);
    if (ed) editData = JSON.parse(ed);
    if (cc) customCases = JSON.parse(cc);
  } catch(e) {}
}

// 生成唯一ID
function generateId() {
  return 'custom_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 5);
}

function render() {
  const container = document.getElementById('content');
  container.innerHTML = '';
  let totalComments = 0;
  let totalImages = 0;
  let reviewed = 0;
  let approved = 0;

  // 合并原始帖子和自定义案例
  const allPosts = [...postsData];
  if (customCases.length > 0) {
    allPosts.push({
      post_url: '',
      post_title: '自定义案例',
      author: '手动创建/导入',
      screenshot: '',
      comments: customCases
    });
  }

  allPosts.forEach((post, postIdx) => {
    const postEl = document.createElement('div');
    postEl.className = 'post-section';
    postEl.dataset.postId = postIdx;

    const visibleComments = getFilteredComments(post.comments);
    if (visibleComments.length === 0) return;

    const header = document.createElement('div');
    header.className = 'post-header';
    header.innerHTML = `
      <h3>📌 ${escapeHtml(post.post_title)}</h3>
      <div class="meta">作者: ${escapeHtml(post.author)} | 评论: ${visibleComments.length}条 | 
        <a href="${post.post_url}" target="_blank" style="color:#00d4ff">打开原帖 ↗</a>
        ${post.screenshot ? `| <a href="${post.screenshot}" target="_blank" style="color:#00d4ff">查看截图 ↗</a>` : ''}
      </div>
    `;
    postEl.appendChild(header);

    const grid = document.createElement('div');
    grid.className = 'comments-grid';

    visibleComments.forEach(c => {
      totalComments++;
      totalImages += (c.images?.length || 0);
      const status = reviewStatus[c._id];
      if (status) reviewed++;
      if (status === 'approved') approved++;

      const card = document.createElement('div');
      card.className = `comment-card ${status || ''}`;
      card.dataset.id = c._id;

      let imagesHtml = '';
      if (c.images && c.images.length > 0) {
        imagesHtml = '<div class="images">' + 
          c.images.map((img, i) => `<img src="${img}" onclick="openLightbox('${img}', event)" title="图片${i+1}">`).join('') + 
          '</div>';
      }

      const editInfo = editData[c._id] || {};

      card.innerHTML = `
        ${status ? `<span class="badge badge-${status}">${status === 'approved' ? '✓ 有价值' : '✗ 无价值'}</span>` : ''}
        ${c.isReply ? '<div class="reply-indicator">↳ 回复</div>' : ''}
        <div class="user-bar">
          <span class="username">${escapeHtml(c.username)}</span>
          <span class="likes">❤ ${c.likes}</span>
        </div>
        <div class="content">${escapeHtml(editInfo.content || c.content)}</div>
        ${imagesHtml}
        <div class="actions">
          <button class="btn-approve ${status==='approved'?'active':''}" onclick="approve('${c._id}')">✓ 有价值</button>
          <button class="btn-reject ${status==='rejected'?'active':''}" onclick="reject('${c._id}')">✗ 无价值</button>
          <button class="btn-edit" onclick="toggleEdit('${c._id}')">✎ 编辑</button>
        </div>
        <div class="edit-panel" id="edit-${c._id}">
          <label>项目标题</label>
          <input type="text" id="title-${c._id}" value="${escapeHtml(editInfo.title || '')}" placeholder="输入项目标题...">
          <label>评论内容（可直接改写）</label>
          <textarea id="content-${c._id}" placeholder="评论原文...">${escapeHtml(editInfo.content || c.content)}</textarea>
          <label>标签 (逗号分隔)</label>
          <input type="text" id="tags-${c._id}" value="${escapeHtml((editInfo.tags || []).join(','))}" placeholder="小程序,AI应用,教育...">
          <label>难度</label>
          <select id="diff-${c._id}">
            <option value="零基础" ${editInfo.difficulty==='零基础'?'selected':''}>零基础</option>
            <option value="入门" ${editInfo.difficulty==='入门'?'selected':''}>入门</option>
            <option value="进阶" ${editInfo.difficulty==='进阶'?'selected':''}>进阶</option>
          </select>
          <label>补充描述</label>
          <textarea id="desc-${c._id}" placeholder="补充项目描述、技术栈、链接等...">${escapeHtml(editInfo.description || '')}</textarea>
          <button class="btn-approve" onclick="saveEdit('${c._id}')" style="margin-top:5px">保存</button>
        </div>
      `;
      grid.appendChild(card);
    });

    postEl.appendChild(grid);
    container.appendChild(postEl);
  });

  document.getElementById('postCount').textContent = postsData.length;
  document.getElementById('commentCount').textContent = totalComments;
  document.getElementById('reviewedCount').textContent = reviewed;
  document.getElementById('approvedCount').textContent = approved;
  document.getElementById('imageCount').textContent = totalImages;
  document.getElementById('exportCount').textContent = approved;
}

function getFilteredComments(comments) {
  const activeFilter = document.querySelector('.controls button.active')?.id || 'btnAll';
  const postFilter = document.querySelector('.controls select').value;
  const searchVal = document.getElementById('searchInput').value.toLowerCase();

  return comments.filter(c => {
    if (postFilter && c._postId !== postFilter) return false;
    const status = reviewStatus[c._id];
    if (activeFilter === 'btnPending' && status) return false;
    if (activeFilter === 'btnApproved' && status !== 'approved') return false;
    if (activeFilter === 'btnRejected' && status !== 'rejected') return false;
    if (activeFilter === 'btnImages' && (!c.images || c.images.length === 0)) return false;
    if (activeFilter === 'btnCustom' && !c._id.startsWith('custom_')) return false;
    const searchContent = (editData[c._id]?.content || c.content).toLowerCase();
    if (searchVal && !searchContent.includes(searchVal) && !c.username.toLowerCase().includes(searchVal)) return false;
    return true;
  });
}

function approve(id) {
  reviewStatus[id] = 'approved';
  saveToStorage();
  render();
}

function reject(id) {
  reviewStatus[id] = 'rejected';
  saveToStorage();
  render();
}

function toggleEdit(id) {
  const panel = document.getElementById('edit-' + id);
  panel.classList.toggle('show');
}

function saveEdit(id) {
  editData[id] = {
    title: document.getElementById('title-' + id).value,
    content: document.getElementById('content-' + id).value,
    tags: document.getElementById('tags-' + id).value.split(',').map(t => t.trim()).filter(Boolean),
    difficulty: document.getElementById('diff-' + id).value,
    description: document.getElementById('desc-' + id).value
  };
  saveToStorage();
  alert('已保存编辑');
  render();
}

  // not applicable with current layout

function openLightbox(src, e) {
  e.stopPropagation();
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('show');
}

  document.getElementById('lightbox').classList.remove('show');
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function exportApproved() {
  const approved = [];
  // 导出原始帖子中的已审核案例
  postsData.forEach(post => {
    post.comments.forEach(c => {
      if (reviewStatus[c._id] === 'approved') {
        const edit = editData[c._id] || {};
        approved.push({
          id: c._id,
          title: edit.title || c.content.substring(0, 30) + '...',
          content: edit.content || c.content,
          username: c.username,
          likes: c.likes,
          images: c.images || [],
          tag_list: edit.tags || [],
          difficulty: edit.difficulty || '入门',
          description: edit.description || '',
          source_platform: 'xiaohongshu',
          source_url: post.post_url,
          post_title: post.post_title
        });
      }
    });
  });
  // 导出自定义案例
  customCases.forEach(c => {
    if (reviewStatus[c._id] === 'approved') {
      const edit = editData[c._id] || {};
      approved.push({
        id: c._id,
        title: edit.title || c.content.substring(0, 30) + '...',
        content: edit.content || c.content,
        username: c.username,
        likes: c.likes,
        images: c.images || [],
        tag_list: edit.tags || [],
        difficulty: edit.difficulty || '入门',
        description: edit.description || '',
        source_platform: edit.platform || 'custom',
        source_url: edit.sourceUrl || '',
        post_title: '自定义案例'
      });
    }
  });

  const blob = new Blob([JSON.stringify({
    source: 'xiaohongshu',
    export_time: new Date().toISOString(),
    total: approved.length,
    cases: approved
  }, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'approved_cases_' + new Date().toISOString().split('T')[0] + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function saveNewCase() {
  const title = document.getElementById('newTitle').value.trim();
  const username = document.getElementById('newUsername').value.trim();
  const content = document.getElementById('newContent').value.trim();
  if (!title || !username || !content) {
    alert('请填写必填项：项目标题、用户名、评论内容');
    return;
  }
  const images = document.getElementById('newImages').value.split('\n').map(s => s.trim()).filter(Boolean);
  const newCase = {
    _id: generateId(),
    _postId: 'custom',
    username: username,
    content: content,
    likes: parseInt(document.getElementById('newLikes').value) || 0,
    images: images,
    time: new Date().toLocaleDateString('zh-CN'),
    isReply: false
  };
  // 预填充编辑数据
  editData[newCase._id] = {
    title: title,
    content: content,
    tags: document.getElementById('newTags').value.split(',').map(t => t.trim()).filter(Boolean),
    difficulty: document.getElementById('newDifficulty').value,
    description: ''
  };
  customCases.push(newCase);
  saveToStorage();
  closeCreateModal();
  render();
  alert('案例创建成功！');
}

// 导入JSON
function importCases(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      let cases = [];
      if (data.cases && Array.isArray(data.cases)) {
        cases = data.cases;
      } else if (Array.isArray(data)) {
        cases = data;
      }
      let imported = 0;
      cases.forEach(c => {
        const id = c.id || generateId();
        // 检查是否已存在
        const exists = customCases.find(x => x._id === id) || postsData.some(p => p.comments.some(x => x._id === id));
        if (exists) return;
        const newCase = {
          _id: id,
          _postId: 'custom',
          username: c.username || '未知用户',
          content: c.content || c.title || '',
          likes: c.likes || 0,
          images: c.images || [],
          time: c.create_time || new Date().toLocaleDateString('zh-CN'),
          isReply: false
        };
        customCases.push(newCase);
        editData[id] = {
          title: c.title || (c.content ? c.content.substring(0, 30) + '...' : '未命名'),
          content: c.content || '',
          tags: c.tag_list || [],
          difficulty: c.difficulty || '入门',
          description: c.description || ''
        };
        if (c.reviewed) reviewStatus[id] = 'approved';
        imported++;
      });
      saveToStorage();
      render();
      alert(`成功导入 ${imported} 条案例！`);
    } catch(err) {
      alert('导入失败：' + err.message);
    }
    input.value = '';
  };
  reader.readAsText(file);
}

  loadFromStorage();

    select.appendChild(opt);
  });
  render();
}
