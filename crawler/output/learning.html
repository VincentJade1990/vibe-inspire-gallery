<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习与创造 · VibeBubble</title>
<meta name="description" content="理解AI，探索可能，把想法逐步变成现实。VibeBubble 整理 AI 通识与八步创造法，帮助你获得启发、推进想法。">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="./auth.js"></script>
<script src="./nav.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-deep: #050a14;
  --bg-mid: #0a0f1a;
  --purple: #a855f7;
  --pink: #ec4899;
  --blue: #3b82f6;
  --cyan: #06b6d4;
  --text: #f8fafc;
  --text-dim: #94a3b8;
  --text-muted: #64748b;
  --glass-border: rgba(255, 255, 255, 0.08);
  --radius-lg: 20px;
  --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

html { scroll-behavior: smooth; }
body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-deep);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.8;
  overflow-x: hidden;
  position: relative;
  padding-top: 68px;
}

body::before {
  content: '';
  position: fixed;
  inset: -120px;
  background: conic-gradient(
    from 0deg,
    rgba(236, 72, 153, 0.08),
    rgba(168, 85, 247, 0.10),
    rgba(59, 130, 246, 0.07),
    rgba(6, 182, 212, 0.05),
    rgba(236, 72, 153, 0.08)
  );
  animation: iridescentRotate 30s linear infinite;
  z-index: -2;
  filter: blur(120px);
  pointer-events: none;
}
@keyframes iridescentRotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 70% 70% at 15% 25%, rgba(168,85,247,0.10), transparent 50%),
    radial-gradient(ellipse 60% 60% at 85% 75%, rgba(6,182,212,0.08), transparent 50%);
  z-index: -1;
  pointer-events: none;
}

.page-wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding: 72px 32px 120px;
}

/* ===== Header ===== */
.page-head {
  text-align: center;
  margin-bottom: 64px;
}
.page-label {
  display: inline-block;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 4px;
  color: var(--purple);
  padding: 6px 18px;
  background: rgba(168, 85, 247, 0.10);
  border: 1px solid rgba(168, 85, 247, 0.20);
  border-radius: 999px;
  margin-bottom: 20px;
}
.page-title {
  font-size: 52px;
  font-weight: 800;
  line-height: 1.2;
  background: linear-gradient(135deg, #f8fafc 0%, #a855f7 55%, #06b6d4 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 20px;
}
.page-intro {
  font-size: 17px;
  color: var(--text-dim);
  max-width: 640px;
  margin: 0 auto;
  line-height: 1.9;
}

/* ===== Entry Cards ===== */
.entry-cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px;
}
.entry-card {
  display: block;
  position: relative;
  padding: 40px 36px;
  background: rgba(255, 255, 255, 0.025);
  border: 1px solid rgba(255, 255, 255, 0.07);
  border-radius: 24px;
  text-decoration: none;
  color: inherit;
  transition: var(--transition);
  overflow: hidden;
  cursor: pointer;
}
.entry-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--purple), var(--cyan));
  opacity: 0;
  transition: var(--transition);
}
.entry-card:hover,
.entry-card:focus-visible {
  border-color: rgba(168, 85, 247, 0.35);
  background: rgba(168, 85, 247, 0.04);
  transform: translateY(-4px);
  box-shadow: 0 24px 48px -20px rgba(168, 85, 247, 0.25);
  outline: none;
}
.entry-card:hover::before,
.entry-card:focus-visible::before { opacity: 1; }

.entry-card.accent-2::before {
  background: linear-gradient(90deg, var(--pink), var(--purple));
}

.entry-head {
  margin-bottom: 20px;
}
.entry-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--purple);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.entry-title {
  font-size: 32px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 4px;
  line-height: 1.2;
}
.entry-title-en {
  font-size: 14px;
  font-weight: 400;
  color: var(--text-muted);
  letter-spacing: 0.08em;
}

.entry-desc {
  font-size: 15px;
  color: var(--text-dim);
  line-height: 1.85;
  margin-bottom: 24px;
}

.entry-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 28px;
}
.entry-tag {
  font-size: 12px;
  color: var(--text-dim);
  padding: 5px 12px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 999px;
  letter-spacing: 0.02em;
}

.entry-status {
  font-size: 12px;
  color: var(--text-muted);
  padding: 10px 16px;
  background: rgba(100, 116, 139, 0.08);
  border: 1px dashed rgba(100, 116, 139, 0.25);
  border-radius: 12px;
  margin-bottom: 24px;
  line-height: 1.6;
}

.entry-cta {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 600;
  color: var(--purple);
  letter-spacing: 0.04em;
  transition: gap 0.25s ease;
}
.entry-card:hover .entry-cta { gap: 12px; }
.entry-cta-arrow {
  transition: transform 0.25s ease;
}
.entry-card:hover .entry-cta-arrow { transform: translateX(4px); }

/* ===== Responsive ===== */
@media (max-width: 860px) {
  .page-wrap { padding: 48px 24px 80px; }
  .page-title { font-size: 38px; }
  .page-intro { font-size: 15px; }
  .entry-cards { grid-template-columns: 1fr; gap: 20px; }
  .entry-card { padding: 32px 26px; }
  .entry-title { font-size: 26px; }
}
@media (max-width: 480px) {
  .page-title { font-size: 32px; }
  .entry-card { padding: 28px 22px; }
  .entry-title { font-size: 24px; }
}
</style>
</head>
<body>

<div id="vb-nav-mount"></div>

<div class="page-wrap">
  <header class="page-head">
    <div class="page-label">VIBE BUBBLE · LEARNING</div>
    <h1 class="page-title">学习与创造</h1>
    <p class="page-intro">
      理解AI，探索可能，把想法逐步变成现实。
    </p>
  </header>

  <div class="entry-cards">

    <!-- 卡片一：AI 通识 -->
    <a class="entry-card" href="./learning-ai.html" aria-label="进入 AI 通识">
      <div class="entry-head">
        <div class="entry-label">MODULE 01</div>
        <h2 class="entry-title">AI 通识</h2>
        <div class="entry-title-en">AI Fundamentals</div>
      </div>
      <p class="entry-desc">
        理解AI的基本原理、能力与边界，学习协作方法，选择适合自己的工具。
      </p>
      <div class="entry-tags">
        <span class="entry-tag">能力与边界</span>
        <span class="entry-tag">AI 协作</span>
        <span class="entry-tag">工具地图</span>
        <span class="entry-tag">基础概念</span>
        <span class="entry-tag">发展脉络</span>
      </div>
      <div class="entry-cta">
        了解 AI 通识
        <span class="entry-cta-arrow">→</span>
      </div>
    </a>

    <!-- 卡片二：八步创造法 -->
    <a class="entry-card accent-2" href="./learning-creation-loop.html" aria-label="进入八步创造法">
      <div class="entry-head">
        <div class="entry-label">MODULE 02</div>
        <h2 class="entry-title">八步创造法</h2>
        <div class="entry-title-en">8-step Creation Loop</div>
      </div>
      <p class="entry-desc">
        从认知、探索到设计、实现，通过运营与迭代，让想法逐步成为现实。
      </p>
      <div class="entry-tags">
        <span class="entry-tag">认知</span>
        <span class="entry-tag">探索</span>
        <span class="entry-tag">定位</span>
        <span class="entry-tag">分析</span>
        <span class="entry-tag">设计</span>
        <span class="entry-tag">实现</span>
        <span class="entry-tag">运营</span>
        <span class="entry-tag">迭代</span>
      </div>
      <div class="entry-status">
        阶段概览已开放，详细内容持续整理中。
      </div>
      <div class="entry-cta">
        了解八步创造法
        <span class="entry-cta-arrow">→</span>
      </div>
    </a>

  </div>
</div>

<script>
// 强制设置 Learning 导航高亮
(function forceNavActive() {
  function setActive() {
    document.querySelectorAll('.vb-nav-links a, .vb-mobile-panel a').forEach(function(a) {
      a.classList.remove('vb-active');
      if ((a.textContent || '').trim() === 'Learning') a.classList.add('vb-active');
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setActive);
  } else {
    setActive();
  }
  setTimeout(setActive, 300);
})();
</script>
</body>
</html>
