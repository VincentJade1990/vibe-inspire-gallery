<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning - Vibe Bubble</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="./auth.js"></script>
<script src="./nav.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-deep: #050a14;
  --bg-mid: #0a0f1a;
  --bg-card: rgba(255, 255, 255, 0.035);
  --purple: #a855f7;
  --purple-light: #c4b5fd;
  --pink: #ec4899;
  --blue: #3b82f6;
  --cyan: #06b6d4;
  --green: #10b981;
  --orange: #f59e0b;
  --text: #f8fafc;
  --text-dim: #94a3b8;
  --text-muted: #64748b;
  --glass-border: rgba(255, 255, 255, 0.08);
  --radius-lg: 20px;
  --radius-md: 14px;
  --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  --sidebar-width: 200px;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-deep);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.8;
  overflow-x: hidden;
  position: relative;
  padding-top: 68px;
}

body::before {
  content: '';
  position: fixed;
  inset: -120px;
  background: conic-gradient(
    from 0deg,
    rgba(236, 72, 153, 0.10),
    rgba(168, 85, 247, 0.10),
    rgba(59, 130, 246, 0.08),
    rgba(6, 182, 212, 0.06),
    rgba(245, 158, 11, 0.06),
    rgba(236, 72, 153, 0.10)
  );
  animation: iridescentRotate 25s linear infinite;
  z-index: -2;
  filter: blur(120px);
  pointer-events: none;
}

@keyframes iridescentRotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 70% 70% at 15% 25%, rgba(168, 85, 247, 0.08) 0%, transparent 55%),
    radial-gradient(ellipse 60% 60% at 85% 75%, rgba(236, 72, 153, 0.06) 0%, transparent 45%),
    linear-gradient(180deg, #040814 0%, #0a0f1a 40%, #080c18 70%, #0d0818 100%);
  z-index: -3;
  pointer-events: none;
}

/* ===== 路径按钮栏 ===== */
.path-bar {
  padding: 28px 32px 20px;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}

.path-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
  color: var(--text-muted);
  padding: 6px 14px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.06);
  background: rgba(255,255,255,0.02);
  cursor: pointer;
  transition: var(--transition);
  white-space: nowrap;
}

.path-btn:hover {
  color: var(--text-dim);
  border-color: rgba(168,85,247,0.2);
  background: rgba(168,85,247,0.06);
}

.path-btn.active {
  color: var(--purple-light);
  border-color: rgba(168,85,247,0.4);
  background: rgba(168,85,247,0.12);
  box-shadow: 0 0 16px rgba(168,85,247,0.15);
}

.path-btn.locked { cursor: not-allowed; opacity: 0.4; }
.path-btn.locked:hover { color: var(--text-muted); border-color: rgba(255,255,255,0.06); background: rgba(255,255,255,0.02); }
.path-arrow { color: var(--text-muted); font-size: 11px; opacity: 0.3; }

/* ===== 内容布局 ===== */
.learning-layout {
  display: flex;
  max-width: 1200px;
  margin: 0 auto;
  padding: 40px 32px 80px;
  gap: 40px;
  position: relative;
  z-index: 1;
  opacity: 0;
  animation: pageEnter 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
}

@keyframes pageEnter {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 左侧导航（无标题） */
.toc-sidebar {
  width: var(--sidebar-width);
  flex-shrink: 0;
  position: sticky;
  top: 100px;
  align-self: flex-start;
  max-height: calc(100vh - 140px);
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(168,85,247,0.2) transparent;
}
.toc-sidebar::-webkit-scrollbar { width: 3px; }
.toc-sidebar::-webkit-scrollbar-thumb { background: rgba(168,85,247,0.15); border-radius: 2px; }

.toc-list { list-style: none; }
.toc-item { margin-bottom: 2px; }
.toc-link {
  display: block;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 13px;
  color: var(--text-muted);
  cursor: pointer;
  transition: var(--transition);
  border-left: 2px solid transparent;
}
.toc-link:hover { color: var(--text-dim); background: rgba(255, 255, 255, 0.02); }
.toc-link.active { color: var(--purple-light); border-left-color: var(--purple); background: rgba(168, 85, 247, 0.06); }

/* 主内容区 */
.content-main { flex: 1; min-width: 0; }

.page-header { margin-bottom: 48px; }
.page-label {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 600; color: var(--purple);
  text-transform: uppercase; letter-spacing: 2px;
  margin-bottom: 14px; padding: 5px 12px; border-radius: 16px;
  background: rgba(168, 85, 247, 0.08); border: 1px solid rgba(168, 85, 247, 0.2);
}
.page-title {
  font-size: clamp(32px, 4vw, 42px); font-weight: 800;
  letter-spacing: -0.02em; line-height: 1.2; margin-bottom: 14px;
  background: linear-gradient(90deg, var(--text) 30%, var(--text-dim) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.page-subtitle { font-size: 15px; color: var(--text-dim); line-height: 1.8; max-width: 640px; }

.content-section { margin-bottom: 64px; scroll-margin-top: 100px; }
.section-title {
  font-size: 26px; font-weight: 700; margin-bottom: 24px;
  display: flex; align-items: center; gap: 12px;
}
.section-title::before {
  content: ''; width: 4px; height: 24px;
  background: linear-gradient(180deg, var(--purple), var(--pink));
  border-radius: 2px; flex-shrink: 0;
}

/* 导览卡片 */
.intro-card {
  background: var(--bg-card); backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border); border-radius: var(--radius-lg);
  padding: 32px 28px; position: relative; overflow: hidden;
}
.intro-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(168,85,247,0.3), transparent);
}
.intro-text { font-size: 15px; color: var(--text-dim); line-height: 2; }

/* ===== 横向时间轴 ===== */
.timeline-phases {
  display: flex; gap: 6px; margin-bottom: 28px;
  flex-wrap: nowrap; overflow-x: auto;
  scrollbar-width: thin; scrollbar-color: rgba(168,85,247,0.15) transparent;
  -webkit-overflow-scrolling: touch;
}
.timeline-phases::-webkit-scrollbar { height: 3px; }
.timeline-phases::-webkit-scrollbar-thumb { background: rgba(168,85,247,0.15); border-radius: 2px; }

.phase-tab {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 11px; font-weight: 500; color: var(--text-muted);
  padding: 6px 12px; border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.06);
  background: rgba(255,255,255,0.02);
  cursor: pointer; transition: var(--transition);
  white-space: nowrap; flex-shrink: 0;
}

.phase-tab .phase-num {
  width: 20px; height: 20px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; flex-shrink: 0;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
}

.phase-tab[data-phase="1"] .phase-num { background: rgba(168,85,247,0.15); border-color: rgba(168,85,247,0.3); color: var(--purple-light); }
.phase-tab[data-phase="2"] .phase-num { background: rgba(236,72,153,0.15); border-color: rgba(236,72,153,0.3); color: var(--pink); }
.phase-tab[data-phase="3"] .phase-num { background: rgba(59,130,246,0.15); border-color: rgba(59,130,246,0.3); color: var(--blue); }
.phase-tab[data-phase="4"] .phase-num { background: rgba(6,182,212,0.15); border-color: rgba(6,182,212,0.3); color: var(--cyan); }

.phase-tab:hover { color: var(--text-dim); border-color: rgba(255,255,255,0.12); }

.timeline-scroll {
  overflow-x: auto; overflow-y: visible;
  padding: 0 0 12px;
  scrollbar-width: thin;
  scrollbar-color: rgba(168,85,247,0.2) transparent;
  -webkit-overflow-scrolling: touch;
}
.timeline-scroll::-webkit-scrollbar { height: 4px; }
.timeline-scroll::-webkit-scrollbar-thumb { background: rgba(168,85,247,0.15); border-radius: 2px; }
.timeline-scroll::-webkit-scrollbar-track { background: transparent; }

.timeline-track {
  display: flex;
  min-width: max-content;
  position: relative;
  padding: 48px 0 0;
}

/* 横线贯穿 */
.timeline-track::before {
  content: '';
  position: absolute;
  top: 44px;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg,
    rgba(168,85,247,0.4),
    rgba(236,72,153,0.4),
    rgba(59,130,246,0.4),
    rgba(6,182,212,0.4)
  );
}

.tl-event {
  flex: 0 0 260px;
  position: relative;
  padding: 0 8px;
}

.tl-year {
  position: absolute;
  top: -38px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
  font-weight: 700;
  color: var(--purple-light);
  white-space: nowrap;
}

.tl-event[data-phase="2"] .tl-year { color: var(--pink); }
.tl-event[data-phase="3"] .tl-year { color: var(--blue); }
.tl-event[data-phase="4"] .tl-year { color: var(--cyan); }

.tl-node {
  position: absolute;
  top: -10px;
  left: 50%;
  transform: translateX(-50%);
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--bg-deep);
  border: 2px solid var(--purple);
  box-shadow: 0 0 10px rgba(168,85,247,0.3);
  z-index: 1;
}

.tl-event[data-phase="2"] .tl-node { border-color: var(--pink); box-shadow: 0 0 10px rgba(236,72,153,0.3); }
.tl-event[data-phase="3"] .tl-node { border-color: var(--blue); box-shadow: 0 0 10px rgba(59,130,246,0.3); }
.tl-event[data-phase="4"] .tl-node { border-color: var(--cyan); box-shadow: 0 0 10px rgba(6,182,212,0.3); }

.tl-card {
  margin-top: 12px;
  background: var(--bg-card);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  padding: 20px 16px;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}

.tl-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--purple), transparent);
}
.tl-event[data-phase="2"] .tl-card::before { background: linear-gradient(90deg, var(--pink), transparent); }
.tl-event[data-phase="3"] .tl-card::before { background: linear-gradient(90deg, var(--blue), transparent); }
.tl-event[data-phase="4"] .tl-card::before { background: linear-gradient(90deg, var(--cyan), transparent); }

.tl-card:hover {
  border-color: rgba(168,85,247,0.2);
  background: rgba(168,85,247,0.04);
  transform: scale(1.06);
  box-shadow: 0 12px 32px rgba(0,0,0,0.3), 0 0 24px rgba(168,85,247,0.08);
  z-index: 2;
}

.tl-event[data-phase="2"] .tl-card:hover { border-color: rgba(236,72,153,0.2); box-shadow: 0 12px 32px rgba(0,0,0,0.3), 0 0 24px rgba(236,72,153,0.08); }
.tl-event[data-phase="3"] .tl-card:hover { border-color: rgba(59,130,246,0.2); box-shadow: 0 12px 32px rgba(0,0,0,0.3), 0 0 24px rgba(59,130,246,0.08); }
.tl-event[data-phase="4"] .tl-card:hover { border-color: rgba(6,182,212,0.2); box-shadow: 0 12px 32px rgba(0,0,0,0.3), 0 0 24px rgba(6,182,212,0.08); }

.tl-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 8px; line-height: 1.4; }
.tl-desc { font-size: 12px; color: var(--text-dim); line-height: 1.7; }
.tl-link {
  display: inline-block; margin-top: 8px; font-size: 11px;
  color: var(--purple-light); text-decoration: none;
  border-bottom: 1px dashed rgba(168,85,247,0.3); transition: var(--transition);
}
.tl-link:hover { color: var(--purple); border-bottom-color: var(--purple); }

/* ===== 人物卡片 ===== */
.person-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

.person-card {
  background: var(--bg-card);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  padding: 24px 20px;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}
.person-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
}
.person-card:hover {
  border-color: rgba(168, 85, 247, 0.2);
  background: rgba(168, 85, 247, 0.03);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
}

.person-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }

.person-num {
  width: 28px; height: 28px; border-radius: 8px;
  background: linear-gradient(135deg, rgba(168,85,247,0.2), rgba(236,72,153,0.1));
  border: 1px solid rgba(168,85,247,0.2);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: var(--purple-light); flex-shrink: 0;
}

.person-name { flex: 1; }
.person-name-cn { font-size: 19px; font-weight: 700; color: var(--text); line-height: 1.3; margin-bottom: 4px; }
.person-name-en { font-size: 12px; color: var(--text-muted); }

.person-title { font-size: 12px; color: var(--purple-light); margin-bottom: 10px; font-weight: 500; }
.person-contrib { font-size: 13px; color: var(--text-dim); line-height: 1.8; margin-bottom: 12px; }
.person-works { font-size: 12px; color: var(--text-muted); padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.05); }
.person-works strong { color: var(--text-dim); font-weight: 500; }

/* ===== 公司卡片 ===== */
.company-list { display: flex; flex-direction: column; gap: 16px; }

.company-card {
  background: var(--bg-card);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  padding: 24px;
  transition: var(--transition);
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 24px;
  align-items: flex-start;
}
.company-card:hover { border-color: rgba(168, 85, 247, 0.2); background: rgba(168, 85, 247, 0.03); }

.company-logo {
  width: 48px; height: 48px;
  border-radius: 12px;
  background: #ffffff;
  border: 1px solid rgba(255,255,255,0.12);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; flex-shrink: 0;
  padding: 8px;
}
.company-logo img { width: 100%; height: 100%; object-fit: contain; }
.company-logo-fallback {
  font-size: 20px; font-weight: 700; color: var(--purple-light);
}

.company-num {
  width: 28px; height: 28px; border-radius: 8px;
  background: linear-gradient(135deg, rgba(168,85,247,0.15), rgba(59,130,246,0.08));
  border: 1px solid rgba(168,85,247,0.15);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: var(--purple-light); flex-shrink: 0;
}

.company-info h4 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.company-meta { display: flex; gap: 16px; font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
.company-desc { font-size: 13px; color: var(--text-dim); line-height: 1.8; margin-bottom: 12px; }
.company-products { display: flex; flex-wrap: wrap; gap: 8px; }
.product-tag { font-size: 12px; padding: 4px 10px; border-radius: 8px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); color: var(--text-dim); }

/* 基础概念卡片 */
.concept-tabs {
  display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap;
}
.concept-tab {
  padding: 8px 18px; border-radius: 20px;
  font-size: 13px; font-weight: 500; color: var(--text-muted);
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  cursor: pointer; transition: var(--transition);
}
.concept-tab:hover { color: var(--text); border-color: rgba(168,85,247,0.2); }
.concept-tab.active {
  color: var(--purple-light); font-weight: 600;
  background: rgba(168,85,247,0.08);
  border-color: rgba(168,85,247,0.25);
}
.concept-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
}
.concept-card {
  background: var(--bg-card);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  padding: 20px;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}
.concept-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--purple), transparent);
}
.concept-card:hover {
  border-color: rgba(168,85,247,0.2);
  background: rgba(168,85,247,0.03);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
}
.concept-card h4 {
  font-size: 16px; font-weight: 600; color: var(--text);
  margin-bottom: 2px;
}
.concept-card .concept-en-name {
  font-size: 14px; color: var(--text-dim); margin-bottom: 14px;
}
.concept-card .concept-label {
  font-size: 10px; font-weight: 600; color: var(--purple);
  text-transform: uppercase; letter-spacing: 0.05em;
  margin-bottom: 4px;
}
.concept-card .concept-desc {
  font-size: 13px; color: var(--text-dim); line-height: 1.7;
  margin-bottom: 12px;
}
.concept-card .concept-key {
  font-size: 13px; color: var(--text); line-height: 1.7;
  margin-bottom: 12px;
}
.concept-card .concept-example {
  font-size: 12px; color: var(--text-muted); line-height: 1.6;
  padding: 10px 12px; border-radius: 8px;
  background: rgba(255,255,255,0.03);
  border-left: 2px solid rgba(168,85,247,0.3);
  margin-bottom: 12px;
}
.concept-card .concept-related {
  display: flex; flex-wrap: wrap; gap: 6px;
}
.concept-card .concept-related span {
  font-size: 11px; color: var(--text-muted);
  padding: 2px 8px; border-radius: 4px;
  background: rgba(255,255,255,0.04);
}

/* Coming Soon */
.coming-soon-panel { text-align: center; padding: 80px 32px; }
.coming-soon-panel svg { margin-bottom: 20px; opacity: 0.3; }
.coming-soon-panel h3 { font-size: 22px; font-weight: 600; color: var(--text); margin-bottom: 10px; }
.coming-soon-panel p { font-size: 14px; color: var(--text-muted); }

/* 响应式 */
@media (max-width: 900px) { .toc-sidebar { display: none; } .learning-layout { padding: 32px 20px 60px; } }
@media (max-width: 768px) {
  .person-grid { grid-template-columns: 1fr; }
  .company-card { grid-template-columns: 1fr; gap: 12px; }
  .concept-grid { grid-template-columns: 1fr; }
  .path-bar { padding: 20px 16px 16px; gap: 2px; }
  .path-btn { padding: 5px 10px; font-size: 11px; }
  .tl-event { flex: 0 0 200px; }
}
</style>
</head>
<body>

<div id="vb-nav-mount"></div>
<div class="path-bar" id="pathBar"></div>

<div class="learning-layout">
  <aside class="toc-sidebar" id="tocSidebar">
    <ul class="toc-list" id="tocList"></ul>
  </aside>
  <main class="content-main" id="contentMain"></main>
</div>

<script>
const LEARNING_PATHS = [
  { id: '01', name: '基础认知', en: 'Understand', status: 'available' },
  { id: '02', name: '探索灵感', en: 'Explore', status: 'coming' },
  { id: '03', name: '需求分析', en: 'Discover', status: 'coming' },
  { id: '04', name: '产品定位', en: 'Define', status: 'coming' },
  { id: '05', name: '产品设计', en: 'Design', status: 'coming' },
  { id: '06', name: '产品开发', en: 'Build', status: 'coming' },
  { id: '07', name: '发布运营', en: 'Launch', status: 'coming' },
  { id: '08', name: '增长营销', en: 'Grow', status: 'coming' },
];

const PATH_01_DATA = {
  title: '基础认知',
  subtitle: '了解 AI 的发展脉络、核心人物、关键公司与基础概念，建立正确的认知起点。',
  sections: [
    {
      id: 'intro',
      title: '导览',
      type: 'intro',

            { cn: '自动化', en: 'Automation', desc: '自动化是利用程序、设备或流程，在较少人工参与的情况下重复完成任务。传统自动化通常按照预先设定的规则运行；加入AI后，系统还可以处理语言、图像和复杂数据，并根据不同情况作出一定调整。', key: '自动化强调"自动执行"，AI增加了识别、生成和判断等能力。两者可以结合：AI负责分析和决策，自动化系统负责触发和执行后续动作。', example: '每天定时发送邮件属于自动化；先由AI分析邮件内容，再判断转发给谁，属于AI与自动化结合。', related: ['算法','人工智能','工作流','智能体','工具调用'] },
            { cn: '模型', en: 'Model / AI Model', desc: '模型是AI系统处理输入并产生输出的核心组件。机器学习模型通过训练，从数据中学习参数和规律，再利用这些规律处理新的文字、图片、声音或其他输入。', key: '模型提供能力，产品负责把模型、界面、数据和工具组合成可以使用的服务。同一个模型可以被多个产品调用，一个产品也可以同时调用多个模型。', related: ['训练','参数','推理','大语言模型','AI产品'] },
            { cn: '机器学习', en: 'ML（Machine Learning）', desc: '机器学习是实现人工智能的一类方法。开发者提供数据、学习目标和训练方法，让系统从数据中寻找统计规律，并利用学到的模型对新数据进行分类、预测或生成结果。', key: '机器学习学到的是数据中的模式，并不天然理解现实世界。模型表现会受到数据质量、训练方法、任务定义和使用环境影响。', example: '利用历史邮件训练垃圾邮件识别模型，再判断新邮件是否属于垃圾邮件。', related: ['数据集','训练','模型','监督学习','深度学习'] },
            { cn: '神经网络', en: 'Neural Network / Artificial Neural Network', desc: '神经网络是一类由许多相互连接的计算单元组成的机器学习模型。输入数据经过多层计算和参数转换，模型逐步提取特征，并学习输入与输出之间的复杂关系。', key: '神经网络受到生物神经系统的启发，但它不是人脑的复制品，也不能因此被认为拥有人的意识和理解能力。', related: ['神经元','参数','机器学习','深度学习','训练'] },
            { cn: '深度学习', en: 'DL（Deep Learning）', desc: '深度学习是使用多层神经网络进行学习的机器学习方法。不同网络层可以逐步提取更复杂的特征，使系统能够处理图像、语音和语言等难以通过简单规则描述的数据。', key: '"深度"主要指神经网络具有较多处理层，不代表模型拥有更深的人类思想。深度学习的进步同时依赖模型架构、训练数据、计算方法和算力。', related: ['机器学习','神经网络','参数','GPU','Transformer'] },
            { cn: '大语言模型', en: 'LLM（Large Language Model）', desc: '大语言模型是使用大量文本及相关数据训练的语言模型。它把内容转换为Token，根据上下文预测接下来可能出现的Token，从而完成问答、写作、总结、翻译和编程等任务。', key: '大语言模型生成的是概率结果，并非从权威数据库中提取标准答案。它可以产生连贯、有逻辑但事实错误的内容，因此重要信息仍需核查。上下文窗口决定模型一次能够处理多少信息。', related: ['模型','Transformer','Token','上下文窗口','推理','幻觉'] },
            { cn: '人工智能生成内容', en: 'AIGC（Artificial Intelligence Generated Content）', desc: 'AIGC是由人工智能生成或辅助生成的文字、图片、音频、视频和代码等内容，也可以指使用AI进行内容生产的方式。实现这些能力的模型和技术通常被统称为生成式人工智能。', key: 'AI生成降低了部分内容的生产门槛，但不自动保证内容准确、原创或可以自由商用。使用者仍需检查事实、版权、隐私和内容来源。', related: ['大语言模型','扩散模型','提示词','深度伪造','版权'] },
            { cn: '智能体', en: 'AI Agent', desc: '智能体是围绕特定目标进行规划和行动的AI系统。它可以分析任务、安排步骤、调用搜索、文件、软件等工具，观察执行结果并继续调整，直到完成任务或需要人工介入。', key: '普通聊天机器人主要生成回答，智能体还会执行行动。智能体的自主程度并不固定，能使用工具也不代表它可以完全脱离人工监督。', example: '用户提出"整理会议材料"，智能体可以查找文件、提取信息、生成摘要并创建待办事项。', related: ['大语言模型','任务规划','工具调用','工作流','人在回路'] },
            { cn: '通用人工智能', en: 'AGI（Artificial General Intelligence）', desc: '通用人工智能通常指能够跨领域学习、理解和解决多种复杂问题，并把已有能力迁移到陌生任务中的高度通用AI。目前不同机构对AGI的定义并不完全一致，也没有获得广泛认可的统一测试标准。', key: 'AGI是研究目标和未来设想，不能直接等同于当前的大语言模型或智能体。', related: ['人工智能','大语言模型','智能体','AI对齐','AI安全'] },
          ]
        },
        {
          name: 'AI 如何学习',
          items: [
            { cn: '训练数据', en: 'Training Data', desc: '训练数据是模型在训练过程中接触的文字、图片、音频、视频或其他信息。模型通过分析大量数据中的规律，逐渐形成识别、预测和生成内容的能力。', key: '训练数据的数量很重要，质量、代表性和合法性同样重要。数据中的错误、缺失和偏见，也可能被模型学习并反映在输出中。', example: '一个识别猫的模型，需要通过大量不同品种、角度和环境中的猫图片进行学习。', related: ['数据标注','训练','数据偏差','预训练'] },
            { cn: '数据标注', en: 'Data Annotation', desc: '数据标注是为文字、图片、声音等数据添加名称、类别、答案或其他说明。标注后的数据可以告诉模型"什么是什么"或"什么结果更符合要求"。', key: '标注质量会直接影响模型的学习效果。数据标注可以由人工完成，也可以借助程序或AI辅助处理，但通常仍需要检查和校正。', example: '在图片中框出汽车、行人和红绿灯，并分别写上名称，就是一种数据标注。', related: ['训练数据','监督学习','人类反馈'] },
            { cn: '训练', en: 'Training', desc: '训练是让模型反复处理数据，并根据结果调整内部参数的过程。随着参数不断调整，模型会逐渐提高识别规律、预测结果或生成内容的能力。', key: '模型训练通常需要大量数据、算力和时间。普通用户上传文件或与AI聊天，一般不会让基础模型立即重新训练或永久记住这些内容。', related: ['训练数据','参数','预训练','微调','算力'] },
            { cn: '预训练', en: 'Pre-training', desc: '预训练是模型形成通用能力的早期训练阶段。大语言模型会处理大规模文本等数据，通过预测缺失内容或下一个Token等方式，学习语言规律和广泛的知识关联。', key: '预训练让模型获得广泛能力，但模型学到的主要是数据中的统计规律。它生成流畅内容，并不代表每个答案都真实准确。', related: ['训练','训练数据','自监督学习','大语言模型','Token'] },
            { cn: '微调', en: 'Fine-tuning', desc: '微调是在已经完成预训练的模型基础上，使用规模较小、目标更明确的数据继续训练，使模型更适合某类任务、专业领域或表达方式。指令微调是常见的微调方式之一。', key: '微调主要用于调整模型的能力重点和行为表现，并不能保证模型掌握的所有知识都正确，也不一定适合处理需要频繁更新的信息。', example: '通用模型经过医疗文本微调后，可以更熟悉医疗术语和专业表达，但其回答仍需专业人员核查。', related: ['预训练','指令微调','训练数据','大语言模型'] },
            { cn: '监督学习', en: 'Supervised Learning', desc: '监督学习是让模型通过带有参考答案的数据进行学习。模型先尝试判断结果，再与正确答案比较，并不断调整，从而提高后续预测的准确性。', key: '监督学习依赖数量充足且标注准确的数据。参考答案存在错误或覆盖不全面时，模型的判断也会受到影响。', example: '向模型提供大量已经标明"垃圾邮件"和"正常邮件"的样本，训练它判断新的邮件。', related: ['数据标注','训练数据','训练','分类'] },
            { cn: '强化学习', en: 'RL（Reinforcement Learning）', desc: '强化学习是一种通过行动结果和奖励信号改进行为的学习方法。模型在环境中尝试不同选择，根据获得的奖励或惩罚，逐渐学习更有可能实现目标的策略。', key: '强化学习的效果取决于目标和奖励如何设定。如果奖励设计不合理，AI可能找到意料之外的方法获得高分，却没有真正完成预期目标。', example: '游戏AI通过不断尝试，根据输赢和得分调整策略，逐渐提高游戏表现。', related: ['奖励','策略','人类反馈','RLHF','智能体'] },
            { cn: '人类反馈', en: 'Human Feedback', desc: '人类反馈是由人对AI的多个回答进行比较、评价或纠正，帮助模型学习哪些结果更有用、更安全、更符合人类要求。基于人类反馈的强化学习通常称为RLHF。', key: '人类反馈会受到评价标准、文化背景和个人判断影响。用户的一次点赞、点踩或纠正，通常不会让当前基础模型立即完成重新训练。', related: ['强化学习','RLHF','微调','对齐','数据标注'] },
          ]
        }
      ]
    }
  ]
};

// ===== 渲染路径按钮 =====
function renderPathBar(activeId) {
  const bar = document.getElementById('pathBar');
  let html = '';
  LEARNING_PATHS.forEach((p, i) => {
    const cls = p.status === 'available' ? (p.id === activeId ? 'path-btn active' : 'path-btn') : 'path-btn locked';
    html += `<span class="${cls}" data-path="${p.id}">${p.id} ${p.name}</span>`;
    if (i < LEARNING_PATHS.length - 1) html += '<span class="path-arrow">→</span>';
  });
  bar.innerHTML = html;
  bar.querySelectorAll('.path-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const pathData = LEARNING_PATHS.find(p => p.id === btn.dataset.path);
      if (pathData.status === 'available') renderPath(btn.dataset.path);
    });
  });
}

// ===== 渲染TOC（仅一级，无标题） =====
function renderTOC(data) {
  const toc = document.getElementById('tocList');
  toc.innerHTML = data.sections.map(s =>
    `<li class="toc-item"><div class="toc-link" data-target="${s.id}">${s.title}</div></li>`
  ).join('');
  toc.querySelectorAll('.toc-link').forEach(link => {
    link.addEventListener('click', () => {
      const target = document.getElementById(link.dataset.target);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
}

// ===== 渲染内容 =====
function renderContent(data) {
  const main = document.getElementById('contentMain');
  let html = `
    <div class="page-header">
      <div class="page-label">Learning Path 01</div>
      <h1 class="page-title">${data.title}</h1>
      <p class="page-subtitle">${data.subtitle}</p>
    </div>
  `;

  data.sections.forEach(section => {
    html += `<div class="content-section" id="${section.id}">`;
    html += `<h2 class="section-title">${section.title}</h2>`;

    if (section.type === 'intro') {
      html += `<div class="intro-card"><p class="intro-text">${section.content}</p></div>`;
    }

    if (section.type === 'timeline') {
      // 四阶段tab
      html += `<div class="timeline-phases">`;
      section.phases.forEach(ph => {
        html += `<button class="phase-tab" data-phase="${ph.id}">${ph.name}</button>`;
      });
      html += `</div>`;

      // 横向时间轴
      html += `<div class="timeline-scroll" id="timelineScroll">`;
      html += `<div class="timeline-track">`;
      section.events.forEach(ev => {
        html += `<div class="tl-event" data-phase="${ev.phase}">
          <div class="tl-year">${ev.year}</div>
          <div class="tl-node"></div>
          <div class="tl-card">
            <div class="tl-title">${ev.title}</div>
            <div class="tl-desc">${ev.desc}</div>`;
        if (ev.link) html += `<a class="tl-link" href="${ev.url}" target="_blank" rel="noopener">${ev.link} →</a>`;
        html += `</div></div>`;
      });
      html += `</div></div>`;
    }

    if (section.type === 'persons') {
      html += '<div class="person-grid">';
      section.items.forEach(p => {
        html += `<div class="person-card">
          <div class="person-header">
            <div class="person-name">
              <div class="person-name-cn">${p.nameCn}</div>
              <div class="person-name-en">${p.nameEn}</div>
            </div>
          </div>
          <div class="person-title">${p.title}</div>
          <div class="person-contrib">${p.contrib}</div>
          <div class="person-works"><strong>代表成果：</strong>${p.works}</div>
        </div>`;
      });
      html += '</div>';
    }

    if (section.type === 'companies') {
      html += '<div class="company-list">';
      section.items.forEach(c => {
        html += `<div class="company-card">
          <div class="company-logo">
            <img src="./assets/logos/${c.logo}" alt="${c.name}"
              onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
            <span class="company-logo-fallback" style="display:none">${c.name[0]}</span>
          </div>
          <div class="company-info">
            <h4>${c.name}</h4>
            <div class="company-meta">
              <span>成立：${c.founded}</span>
              <span>创始人：${c.founders}</span>
            </div>
            <p class="company-desc">${c.desc}</p>
            <div class="company-products">`;
        c.products.forEach(prod => { html += `<span class="product-tag">${prod}</span>`; });
        html += `</div></div></div>`;
      });
      html += '</div>';
    }

    if (section.type === 'concepts') {
      const cid = section.id;
      html += `<div class="concept-tabs" id="${cid}-tabs">`;
      section.categories.forEach((cat, i) => {
        html += `<button class="concept-tab ${i === 0 ? 'active' : ''}" data-cat="${i}">${cat.name}</button>`;
      });
      html += `</div>`;
      section.categories.forEach((cat, i) => {
        html += `<div class="concept-grid" id="${cid}-cat-${i}" style="${i === 0 ? '' : 'display:none;'}">`;
        cat.items.forEach(c => {
          html += `<div class="concept-card">
            <h4>${c.cn}</h4>
            <div class="concept-en-name">${c.en}</div>
            <div class="concept-label">概念解释</div>
            <div class="concept-desc">${c.desc}</div>
            <div class="concept-label">关键认识</div>
            <div class="concept-key">${c.key}</div>`;
          if (c.example) {
            html += `<div class="concept-label">实例</div>
            <div class="concept-example">${c.example}</div>`;
          }
          html += `<div class="concept-related">`;
          c.related.forEach(r => { html += `<span>${r}</span>`; });
          html += `</div></div>`;
        });
        html += '</div>';
      });
    }

    html += '</div>';
  });

  main.innerHTML = html;

  // 绑定阶段tab点击 → 滚动到该阶段第一个事件
  const scrollContainer = document.getElementById('timelineScroll');
  if (scrollContainer) {
    document.querySelectorAll('.phase-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const phase = tab.dataset.phase;
        const target = scrollContainer.querySelector(`.tl-event[data-phase="${phase}"]`);
        if (target) {
          const offset = target.offsetLeft - 40;
          scrollContainer.scrollTo({ left: offset, behavior: 'smooth' });
        }
      });
    });
  }

  // 绑定概念分类tab点击
  document.querySelectorAll('.concept-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const catIdx = tab.dataset.cat;
      const tabsContainer = tab.parentElement;
      const sectionId = tabsContainer.id.replace('-tabs', '');
      // 切换tab高亮
      tabsContainer.querySelectorAll('.concept-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      // 切换grid显示
      document.querySelectorAll(`.concept-grid[id^="${sectionId}-cat-"]`).forEach(grid => {
        grid.style.display = 'none';
      });
      const target = document.getElementById(`${sectionId}-cat-${catIdx}`);
      if (target) target.style.display = '';
    });
  });
}

// ===== Coming Soon =====
function renderComingSoon(pathData) {
  document.getElementById('contentMain').innerHTML = `
    <div class="page-header">
      <div class="page-label">Learning Path ${pathData.id}</div>
      <h1 class="page-title">${pathData.name}</h1>
    </div>
    <div class="coming-soon-panel">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--purple)">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
      <h3>内容筹备中</h3>
      <p>${pathData.name} 路径内容正在准备中，敬请期待</p>
    </div>`;
  document.getElementById('tocSidebar').style.display = 'none';
}

function renderPath(pathId) {
  const pathData = LEARNING_PATHS.find(p => p.id === pathId);
  renderPathBar(pathId);
  if (pathId === '01') {
    document.getElementById('tocSidebar').style.display = '';
    renderTOC(PATH_01_DATA);
    renderContent(PATH_01_DATA);
    setTimeout(initScrollSpy, 100);
  } else {
    renderComingSoon(pathData);
  }
}

function initScrollSpy() {
  const tocLinks = document.querySelectorAll('.toc-link');
  const offset = 120;
  function updateActive() {
    let current = '';
    document.querySelectorAll('.content-section').forEach(section => {
      if (window.scrollY >= section.offsetTop - offset) current = section.id;
    });
    tocLinks.forEach(link => link.classList.toggle('active', link.dataset.target === current));
  }
  window.addEventListener('scroll', updateActive, { passive: true });
  updateActive();
}

document.addEventListener('DOMContentLoaded', () => { renderPath('01'); });
</script>
