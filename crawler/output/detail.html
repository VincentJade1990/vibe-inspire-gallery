<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibe Bubble 灵感详情</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<style>
/* ===== CSS 变量与基础重置 ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-deep: #050a14;
  --bg-mid: #0a0f1a;
  --bg-surface: rgba(255, 255, 255, 0.02);
  --purple: #a855f7;
  --pink: #ec4899;
  --blue: #3b82f6;
  --cyan: #06b6d4;
  --amber: #f59e0b;
  --text: #f8fafc;
  --text-dim: #94a3b8;
  --text-muted: #64748b;
  --glass: rgba(255, 255, 255, 0.03);
  --glass-border: rgba(255, 255, 255, 0.08);
  --glass-highlight: rgba(255, 255, 255, 0.05);
  --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.25);
  --shadow-glow: 0 0 40px rgba(168, 85, 247, 0.15);
  --radius: 20px;
  --radius-lg: 24px;
  --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-deep);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  overflow-x: hidden;
  position: relative;
}

/* ===== 页面边缘五彩干涉效果（Iridescent Edge） ===== */
body::before {
  content: '';
  position: fixed;
  inset: -120px;
  background: conic-gradient(
    from 0deg,
    rgba(236, 72, 153, 0.18),
    rgba(168, 85, 247, 0.18),
    rgba(59, 130, 246, 0.18),
    rgba(6, 182, 212, 0.16),
    rgba(245, 158, 11, 0.12),
    rgba(236, 72, 153, 0.18)
  );
  animation: iridescentRotate 20s linear infinite;
  z-index: -2;
  filter: blur(80px);
  pointer-events: none;
}

@keyframes iridescentRotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* ===== 深层空间背景 ===== */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 70% 70% at 15% 25%, rgba(168, 85, 247, 0.14) 0%, transparent 55%),
    radial-gradient(ellipse 60% 60% at 85% 75%, rgba(236, 72, 153, 0.10) 0%, transparent 45%),
    radial-gradient(ellipse 50% 50% at 50% 50%, rgba(59, 130, 246, 0.08) 0%, transparent 45%),
    radial-gradient(ellipse 80% 40% at 50% 100%, rgba(168, 85, 247, 0.06) 0%, transparent 50%),
    linear-gradient(180deg, #040814 0%, #0a0f1a 35%, #080c18 70%, #0d0818 100%);
  z-index: -3;
  pointer-events: none;
}

/* ===== 漂浮背景气泡 ===== */
.bg-bubbles {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -1;
  overflow: hidden;
}

.bg-bubble {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%,
    rgba(255,255,255,0.08) 0%,
    rgba(168,85,247,0.06) 25%,
    rgba(236,72,153,0.03) 50%,
    transparent 70%
  );
  border: 1px solid rgba(255,255,255,0.05);
  box-shadow: 0 0 20px rgba(168,85,247,0.06);
  animation: floatBubble linear infinite;
}

@keyframes floatBubble {
  0% { transform: translateY(100vh) translateX(0) scale(0.4); opacity: 0; }
  10% { opacity: 0.6; }
  90% { opacity: 0.25; }
  100% { transform: translateY(-20vh) translateX(40px) scale(1); opacity: 0; }
}

/* ===== 轻粒子 ===== */
.light-particles {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}

.light-particle {
  position: absolute;
  width: 2px;
  height: 2px;
  border-radius: 50%;
  background: rgba(255,255,255,0.5);
  box-shadow: 0 0 10px rgba(168,85,247,0.5), 0 0 20px rgba(236,72,153,0.2);
  animation: particleDrift linear infinite;
}

@keyframes particleDrift {
  0% { transform: translateY(0) translateX(0); opacity: 0; }
  15% { opacity: 1; }
  85% { opacity: 0.5; }
  100% { transform: translateY(-100vh) translateX(25px); opacity: 0; }
}

/* ===== 页面进入动画 ===== */
.page-enter {
  animation: pageEnter 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

@keyframes pageEnter {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* ===== 头部封面区域 ===== */
.hero-section {
  position: relative;
  width: 100%;
  min-height: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 40px 24px 40px;
  overflow: hidden;
}

/* ===== 主气泡容器 ===== */
.bubble-container {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 104px;
  margin-top: 100px;
}

.bubble-wrapper {
  position: relative;
  width: 300px;
  height: 300px;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: bubbleEnter 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

@keyframes bubbleEnter {
  from { transform: scale(0.3); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

/* ===== WebGL 气泡容器（容器圆角裁切，Canvas 不裁切） ===== */
#webglBubbleContainer {
  position: relative;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  overflow: hidden;
  animation: bubbleEnter 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

#bubbleCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
}

.bubble-title-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 45px;
  text-align: center;
  font-size: 24px;
  font-weight: 700;
  color: #fff;
  text-shadow: 0 2px 16px rgba(0,0,0,0.35), 0 0 50px rgba(168,85,247,0.25);
  line-height: 1.3;
  z-index: 2;
  pointer-events: none;
  letter-spacing: 0.5px;
}

/* 戳破后的碎片粒子 */
.pop-particle {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  z-index: 10;
}

/* ===== 互动操作栏 ===== */
.action-bar {
  display: flex;
  align-items: center;
  gap: 20px;
  z-index: 2;
  flex-wrap: wrap;
  justify-content: center;
}

.action-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 28px;
  border-radius: 28px;
  border: 1px solid var(--glass-border);
  background: var(--glass);
  color: var(--text);
  font-size: 14px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  transition: var(--transition);
  backdrop-filter: blur(16px) saturate(1.2);
  -webkit-backdrop-filter: blur(16px) saturate(1.2);
  user-select: none;
  letter-spacing: 0.3px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.04);
}

.action-btn:hover {
  transform: translateY(-3px);
  border-color: rgba(168,85,247,0.3);
  background: rgba(168,85,247,0.1);
  box-shadow: 0 8px 24px rgba(0,0,0,0.2), 0 0 20px rgba(168,85,247,0.1), inset 0 1px 0 rgba(255,255,255,0.06);
}

.action-btn:active {
  transform: translateY(-1px) scale(0.97);
}

.action-btn .count {
  font-weight: 700;
  color: var(--pink);
}

.action-btn.liked {
  border-color: rgba(236,72,153,0.4);
  background: rgba(236,72,153,0.12);
  box-shadow: 0 4px 16px rgba(0,0,0,0.15), 0 0 20px rgba(236,72,153,0.1), inset 0 1px 0 rgba(255,255,255,0.04);
}

/* ===== 右上角关闭按钮 ===== */
.close-btn {
  position: fixed;
  top: 24px;
  right: 24px;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 1px solid var(--glass-border);
  background: var(--glass);
  color: var(--text);
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
  backdrop-filter: blur(16px) saturate(1.2);
  -webkit-backdrop-filter: blur(16px) saturate(1.2);
  z-index: 200;
  text-decoration: none;
  box-shadow: 0 4px 16px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.04);
}

.close-btn:hover {
  background: rgba(236,72,153,0.15);
  border-color: rgba(236,72,153,0.4);
  transform: rotate(90deg) scale(1.05);
  box-shadow: 0 0 20px rgba(236,72,153,0.15);
}

/* ===== iOS 玻璃拟态卡片 ===== */
.content-section {
  max-width: 720px;
  margin: 0 auto;
  padding: 20px 24px 80px;
  position: relative;
  z-index: 1;
}

.glass-card {
  background: rgba(255, 255, 255, 0.04);
  backdrop-filter: blur(28px) saturate(1.6);
  -webkit-backdrop-filter: blur(28px) saturate(1.6);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: var(--radius-lg);
  padding: 32px;
  margin-bottom: 20px;
  box-shadow:
    0 8px 32px rgba(0, 0, 0, 0.25),
    0 0 0 1px rgba(255, 255, 255, 0.02) inset,
    inset 0 1px 0 rgba(255, 255, 255, 0.08);
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}

.glass-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
}

.glass-card::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1.5px;
  background: linear-gradient(180deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0.03) 40%, transparent 100%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
  opacity: 0.6;
}

.glass-card:hover {
  border-color: rgba(255, 255, 255, 0.18);
  box-shadow:
    0 16px 48px rgba(0, 0, 0, 0.3),
    0 0 40px rgba(168, 85, 247, 0.08),
    0 0 0 1px rgba(255, 255, 255, 0.03) inset,
    inset 0 1px 0 rgba(255, 255, 255, 0.1);
  transform: translateY(-3px);
}

.glass-card h2 {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 20px;
  background: linear-gradient(90deg, var(--purple), var(--pink));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 0.5px;
}

/* 项目描述 */
.description-text {
  font-size: 15px;
  line-height: 2;
  color: var(--text-dim);
  white-space: pre-wrap;
}

/* 标签 */
.tag-list {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 20px;
}

.tag {
  padding: 6px 16px;
  border-radius: 24px;
  font-size: 12px;
  font-weight: 500;
  border: 1px solid rgba(168, 85, 247, 0.25);
  background: rgba(168, 85, 247, 0.08);
  color: var(--purple);
  transition: var(--transition);
  backdrop-filter: blur(8px);
}

.tag:hover {
  background: rgba(168, 85, 247, 0.15);
  border-color: rgba(168, 85, 247, 0.4);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(168, 85, 247, 0.1);
}

/* 元信息网格 */
.meta-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 20px;
}

.meta-item {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.meta-label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-weight: 500;
}

.meta-value {
  font-size: 14px;
  color: var(--text);
  font-weight: 500;
}

.meta-value a {
  color: var(--cyan);
  text-decoration: none;
  transition: var(--transition);
  word-break: break-all;
}

.meta-value a:hover {
  color: var(--blue);
  text-decoration: underline;
}

/* 项目图片 */
.project-images {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-top: 20px;
}

.project-image {
  width: 100%;
  border-radius: 14px;
  border: 1px solid var(--glass-border);
  transition: var(--transition);
  cursor: pointer;
}

.project-image:hover {
  transform: scale(1.03);
  border-color: rgba(168, 85, 247, 0.3);
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
}

/* ===== 评论区 ===== */
.comments-section {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 24px 80px;
}

.comment-input-area {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
}

.comment-input {
  flex: 1;
  padding: 14px 18px;
  border-radius: 14px;
  border: 1px solid var(--glass-border);
  background: var(--glass);
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: var(--transition);
  backdrop-filter: blur(12px);
}

.comment-input:focus {
  border-color: rgba(168, 85, 247, 0.4);
  background: rgba(168, 85, 247, 0.06);
  box-shadow: 0 0 20px rgba(168, 85, 247, 0.08);
}

.comment-input::placeholder {
  color: var(--text-muted);
}

.comment-submit-btn {
  padding: 14px 28px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: var(--transition);
  white-space: nowrap;
  box-shadow: 0 4px 16px rgba(168, 85, 247, 0.3);
}

.comment-submit-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 28px rgba(168, 85, 247, 0.4);
}

.comment-submit-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

/* 评论列表 */
.comment-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.comment-item {
  background: rgba(255, 255, 255, 0.02);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: var(--radius);
  padding: 20px;
  transition: var(--transition);
}

.comment-item:hover {
  border-color: rgba(168, 85, 247, 0.15);
  background: rgba(255, 255, 255, 0.03);
}

.comment-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.comment-author {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}

.comment-time {
  font-size: 12px;
  color: var(--text-muted);
}

.comment-body {
  font-size: 14px;
  color: var(--text-dim);
  line-height: 1.8;
  margin-bottom: 12px;
}

.comment-actions {
  display: flex;
  gap: 12px;
}

.comment-like-btn {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 5px 12px;
  border-radius: 12px;
  border: 1px solid var(--glass-border);
  background: transparent;
  color: var(--text-dim);
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  transition: var(--transition);
}

.comment-like-btn:hover,
.comment-like-btn.liked {
  border-color: rgba(236, 72, 153, 0.4);
  color: var(--pink);
  background: rgba(236, 72, 153, 0.08);
}

.empty-comments {
  text-align: center;
  padding: 48px;
  color: var(--text-muted);
  font-size: 14px;
}

/* ===== 分享弹窗 ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  z-index: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s;
  backdrop-filter: blur(8px);
  padding: 20px;
}

.modal-overlay.show {
  opacity: 1;
  pointer-events: auto;
}

.share-modal {
  background: rgba(10, 12, 30, 0.85);
  backdrop-filter: blur(32px) saturate(1.4);
  -webkit-backdrop-filter: blur(32px) saturate(1.4);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: var(--radius-lg);
  padding: 32px;
  max-width: 480px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  transform: scale(0.92) translateY(10px);
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
  box-shadow: 0 24px 60px rgba(0,0,0,0.4), 0 0 40px rgba(168,85,247,0.08);
}

.modal-overlay.show .share-modal {
  transform: scale(1) translateY(0);
}

.modal-close {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--glass-border);
  background: var(--glass);
  color: var(--text);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
  backdrop-filter: blur(12px);
}

.modal-close:hover {
  background: rgba(236, 72, 153, 0.2);
  border-color: rgba(236, 72, 153, 0.4);
  transform: rotate(90deg);
}

.share-modal h2 {
  font-size: 20px;
  margin-bottom: 24px;
  background: linear-gradient(90deg, var(--purple), var(--pink));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  padding-right: 40px;
  font-weight: 700;
}

/* 分享选项 */
.share-options {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 24px;
}

.share-option {
  padding: 10px 18px;
  border-radius: 14px;
  border: 1px solid var(--glass-border);
  background: var(--glass);
  color: var(--text-dim);
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  transition: var(--transition);
  backdrop-filter: blur(8px);
}

.share-option:hover {
  border-color: rgba(6, 182, 212, 0.4);
  background: rgba(6, 182, 212, 0.1);
  color: var(--text);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(6, 182, 212, 0.1);
}

/* 分享卡片预览 */
.share-card-preview {
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 28px;
  margin-bottom: 24px;
  text-align: center;
  backdrop-filter: blur(8px);
}

.share-card-bubble {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  margin: 0 auto 16px;
  background:
    radial-gradient(ellipse 30% 20% at 28% 22%, rgba(255,255,255,0.7) 0%, transparent 55%),
    radial-gradient(circle at 42% 42%,
      rgba(236,72,153,0.4) 0%,
      rgba(168,85,247,0.3) 30%,
      rgba(59,130,246,0.2) 60%,
      transparent 100%
    );
  box-shadow: 0 0 40px rgba(168,85,247,0.2);
  border: 1.5px solid rgba(255,255,255,0.12);
}

.share-card-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
}

.share-card-author {
  font-size: 13px;
  color: var(--text-dim);
}

.download-btn {
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: var(--transition);
  box-shadow: 0 4px 16px rgba(168, 85, 247, 0.3);
}

.download-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 28px rgba(168, 85, 247, 0.4);
}

/* ===== 不存在提示 ===== */
.not-found {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  text-align: center;
  padding: 40px;
}

.not-found-icon {
  font-size: 72px;
  opacity: 0.5;
  filter: drop-shadow(0 0 20px rgba(168,85,247,0.3));
}

.not-found h1 {
  font-size: 28px;
  color: var(--text);
  font-weight: 700;
}

.not-found p {
  color: var(--text-dim);
  font-size: 15px;
}

.not-found a {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 28px;

<script type="module">
import * as THREE from 'three';
// ==================== Supabase 配置 ====================

// ==================== WebGL 气泡 Shader（复用 gallery.html）====================
const bubbleVertexShader = `
varying vec3 vNormal;
varying vec3 vPosition;
varying vec2 vUv;

void main() {
  vNormal = normalize(normalMatrix * normal);
  vPosition = (modelViewMatrix * vec4(position, 1.0)).xyz;
  vUv = uv;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}
`;

const bubbleFragmentShader = `
uniform float uTime;
uniform vec3 uColor1;
uniform vec3 uColor2;
uniform vec3 uColor3;
uniform float uOpacity;

varying vec3 vNormal;
varying vec3 vPosition;
varying vec2 vUv;

vec3 thinFilmIridescence(float cosTheta, float filmThickness) {
  float phase = filmThickness * sqrt(1.0 - cosTheta * cosTheta) * 3.14159;
  float r = 0.5 + 0.5 * cos(phase);
  float g = 0.5 + 0.5 * cos(phase - 2.094);
  float b = 0.5 + 0.5 * cos(phase - 4.189);
  return vec3(r, g, b);
}

void main() {
  vec3 viewDir = normalize(-vPosition);
  vec3 normal = normalize(vNormal);
  float ndotv = abs(dot(viewDir, normal));

  float fresnel = pow(1.0 - ndotv, 1.5);
  float fresnelSoft = pow(1.0 - ndotv, 0.8);

  float filmThickness = 6.0 + sin(uTime * 0.8) * 3.0 + sin(uTime * 1.3 + vUv.x * 6.28) * 1.5;
  vec3 irid = thinFilmIridescence(ndotv, filmThickness);

  vec3 filmColor = mix(uColor1, uColor2, irid.r);
  filmColor = mix(filmColor, uColor3, irid.g * 0.7);
  filmColor = mix(filmColor, vec3(0.9, 0.6, 0.3), irid.b * 0.4);

  vec3 lightDir = normalize(vec3(1.0, 1.0, 2.0));
  vec3 halfDir = normalize(lightDir + viewDir);
  float spec = pow(max(dot(normal, halfDir), 0.0), 64.0);

  vec3 reflectDir = reflect(-viewDir, normal);
  float envSpec = pow(max(dot(reflectDir, vec3(0.0, 1.0, 0.0)), 0.0), 2.0);

  vec3 innerReflect = vec3(0.3, 0.2, 0.5) * (1.0 - fresnelSoft) * 0.15;

  vec3 color = vec3(0.0);
  color += filmColor * fresnel * 1.5;
  color += vec3(1.0, 0.95, 0.9) * spec * 2.0;
  color += vec3(0.7, 0.8, 1.0) * envSpec * 0.3;
  color += vec3(0.6, 0.3, 0.9) * fresnel * 0.25;
  color += innerReflect;

  float centerAlpha = fresnel * uOpacity * 1.0 + spec * 0.5 + 0.08;
  centerAlpha = clamp(centerAlpha, 0.0, 0.92);

  float rim = pow(1.0 - ndotv, 4.0);
  color += vec3(0.9, 0.85, 1.0) * rim * 0.4;

  gl_FragColor = vec4(color, centerAlpha);
}
`;

// 色板 - 紫粉梦幻（详情页默认）
const DEFAULT_PALETTE = [[0.6, 0.2, 0.9], [0.95, 0.4, 0.7], [0.4, 0.6, 1.0]];

let webglScene = null;
let webglBubbleMesh = null;
let webglRenderer = null;
let webglCamera = null;
let webglAnimId = null;
let isWebglPopped = false;

/**
 * 初始化 WebGL 气泡（复用 gallery Shader）
 */
function initWebGLBubble() {
  const canvas = document.getElementById('bubbleCanvas');
  const container = document.getElementById('webglBubbleContainer');
  if (!canvas || !container) return;

  const w = container.offsetWidth;
  const h = container.offsetHeight;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 100);
  camera.position.z = 80;

  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const geometry = new THREE.SphereGeometry(30, 64, 64);
  const palette = DEFAULT_PALETTE;
  const material = new THREE.ShaderMaterial({
    vertexShader: bubbleVertexShader,
    fragmentShader: bubbleFragmentShader,
    uniforms: {
      uTime: { value: 0 },
      uColor1: { value: new THREE.Vector3(...palette[0]) },
      uColor2: { value: new THREE.Vector3(...palette[1]) },
      uColor3: { value: new THREE.Vector3(...palette[2]) },
      uOpacity: { value: 0.9 }
    },
    transparent: true,
    side: THREE.FrontSide,
    depthWrite: false
  });

  const mesh = new THREE.Mesh(geometry, material);
  scene.add(mesh);

  webglScene = scene;
  webglBubbleMesh = mesh;
  webglRenderer = renderer;
  webglCamera = camera;

  // 响应式
  window.addEventListener('resize', () => {
    const nw = container.offsetWidth;
    const nh = container.offsetHeight;
    camera.aspect = nw / nh;
    camera.updateProjectionMatrix();
    renderer.setSize(nw, nh);
  });

  // 动画循环
  let startTime = performance.now();
  function animate() {
    if (isWebglPopped) {
      webglAnimId = requestAnimationFrame(animate);
      return;
    }
    const t = (performance.now() - startTime) * 0.001;
    material.uniforms.uTime.value = t;

    // 轻微漂浮（极小幅度，不超出圆形容器）
    mesh.position.x = Math.sin(t * 0.5) * 0.6;
    mesh.position.y = Math.cos(t * 0.4) * 0.5;

    renderer.render(scene, camera);
    webglAnimId = requestAnimationFrame(animate);
  }
  animate();
}

/**

function formatTime(dateStr) {
  const date = new Date(dateStr);
  const now = new Date();
  const diff = now - date;
  const minutes = Math.floor(diff / 60000);
  const hours = Math.floor(diff / 3600000);
  const days = Math.floor(diff / 86400000);

  if (minutes < 1) return '刚刚';
  if (minutes < 60) return `${minutes}分钟前`;
  if (hours < 24) return `${hours}小时前`;
  if (days < 30) return `${days}天前`;
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
}

// ==================== 音效系统（Web Audio API） ====================
let audioCtx = null;

function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) {
    console.log('音频初始化失败', e);
  }
}

/**
 * 播放充气/点赞音效 - 轻快的上升音
 */
function playInflateSound() {
  if (!audioCtx) initAudio();
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.2);
  } catch (e) {}
}

/**
 * 播放戳破音效 - 短促的爆破音
 */
function playPopSound() {
  if (!audioCtx) initAudio();
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.12);

    // 添加噪声模拟爆破感
    const bufferSize = audioCtx.sampleRate * 0.05;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    }
    const noise = audioCtx.createBufferSource();
    const noiseGain = audioCtx.createGain();
    noise.buffer = buffer;
    noiseGain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    noise.connect(noiseGain);
    noiseGain.connect(audioCtx.destination);
    noise.start();
  } catch (e) {}
}

/**
 * 播放分享音效 - 清脆的提示音
 */
function playShareSound() {
  if (!audioCtx) initAudio();
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.frequency.setValueAtTime(880, audioCtx.currentTime);

    gain.gain.setValueAtTime(0.06, audioCtx.currentTime);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.stop(audioCtx.currentTime + 0.2);
  } catch (e) {}
}

// ==================== 点赞与戳破状态管理 ====================

function getLikeKey(caseId) {

function getDislikeKey(caseId) {

function isLiked(caseId) {

function getCommentsKey(caseId) {
  return `comments_${caseId}`;
}

function loadComments(caseId) {
  try {
    const data = localStorage.getItem(getCommentsKey(caseId));
    return data ? JSON.parse(data) : [];
  } catch (e) {
    return [];
  }
}

function saveComments(caseId, comments) {
  localStorage.setItem(getCommentsKey(caseId), JSON.stringify(comments));
}

function addComment(caseId, content) {
  const comments = loadComments(caseId);
  comments.unshift({
    id: generateId(),
    content: content.trim(),
    time: new Date().toISOString(),
    likes: 0,
    liked: false
  });
  saveComments(caseId, comments);
  return comments;
}

function likeComment(caseId, commentId) {
  const comments = loadComments(caseId);
  const comment = comments.find(c => c.id === commentId);
  if (comment) {
    comment.liked = !comment.liked;
    comment.likes += comment.liked ? 1 : -1;
    saveComments(caseId, comments);
  }
  return comments;
}

// ==================== 分享卡片生成（Canvas） ====================

function generateShareCard(caseData) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const w = 600;
  const h = 400;
  canvas.width = w;
  canvas.height = h;

  // 背景渐变
  const bgGrad = ctx.createLinearGradient(0, 0, w, h);
  bgGrad.addColorStop(0, '#0f172a');
  bgGrad.addColorStop(1, '#1e1b4b');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, w, h);

  // 装饰圆点
  for (let i = 0; i < 30; i++) {
    const x = Math.random() * w;
    const y = Math.random() * h;
    const r = Math.random() * 2 + 0.5;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(168, 85, 247, ${Math.random() * 0.3 + 0.1})`;
    ctx.fill();
  }

  // 绘制气泡
  const bx = w / 2;
  const by = 140;
  const br = 70;

  // 气泡外发光
  const glow = ctx.createRadialGradient(bx, by, br * 0.8, bx, by, br * 1.8);
  glow.addColorStop(0, 'rgba(168, 85, 247, 0.2)');
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(bx, by, br * 1.8, 0, Math.PI * 2);
  ctx.fill();

  // 气泡主体
  const bubbleGrad = ctx.createRadialGradient(bx - 20, by - 20, 5, bx, by, br);
  bubbleGrad.addColorStop(0, 'rgba(255, 255, 255, 0.3)');
  bubbleGrad.addColorStop(0.2, 'rgba(236, 72, 153, 0.25)');
  bubbleGrad.addColorStop(0.4, 'rgba(168, 85, 247, 0.2)');
  bubbleGrad.addColorStop(0.6, 'rgba(59, 130, 246, 0.15)');
  bubbleGrad.addColorStop(0.8, 'rgba(6, 182, 212, 0.1)');
  bubbleGrad.addColorStop(1, 'rgba(168, 85, 247, 0.05)');

  ctx.beginPath();
  ctx.arc(bx, by, br, 0, Math.PI * 2);
  ctx.fillStyle = bubbleGrad;
  ctx.fill();

  // 气泡高光
  ctx.beginPath();
  ctx.ellipse(bx - 25, by - 25, 18, 10, -Math.PI / 4, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
  ctx.fill();

  // 气泡边框
  ctx.beginPath();
  ctx.arc(bx, by, br, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // 标题
  ctx.font = 'bold 26px "Noto Sans SC", sans-serif';
  ctx.fillStyle = '#f1f5f9';
  ctx.textAlign = 'center';
  ctx.fillText(caseData.title, w / 2, 260);

  // 作者
  ctx.font = '15px "Noto Sans SC", sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.fillText(`by ${caseData.username}`, w / 2, 290);

  // 平台标签
  const platform = platformNames[caseData.source_platform] || caseData.source_platform;
  ctx.font = '13px "Noto Sans SC", sans-serif';
  ctx.fillStyle = '#a855f7';
  ctx.fillText(`来自 ${platform}`, w / 2, 320);

  // 底部品牌
  ctx.font = '12px "Noto Sans SC", sans-serif';
  ctx.fillStyle = '#64748b';
  ctx.fillText('Vibe Bubble 灵感库', w / 2, 370);

  return canvas;
}

    <!-- 头部封面区域 -->
    <section class="hero-section">
      <a href="./gallery.html" class="close-btn" title="返回画廊">&times;</a>

      <div class="bubble-container">
        <div class="bubble-wrapper" id="bubbleWrapper">
          <div id="webglBubbleContainer">
            <canvas id="bubbleCanvas"></canvas>
            <div class="bubble-title-overlay">${caseData.title}</div>
          </div>
        </div>

        <div class="action-bar">
          <button class="action-btn ${liked ? 'liked' : ''}" id="likeBtn" title="给气泡充气">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
            充气 <span class="count" id="likeCount">${likeCount}</span>
          </button>
          <button class="action-btn" id="dislikeBtn" title="戳破气泡">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 12 2-6-6 2-6-2 2 6-2 6 6-2 6 2-2-6Z"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>
            戳破
          </button>
          <button class="action-btn" id="shareBtn" title="分享灵感">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
            分享
          </button>
        </div>
      </div>
    </section>

    <!-- 内容区域 -->
    <section class="content-section">
      <!-- 项目描述 -->
      <div class="glass-card">
        <h2>项目描述</h2>
        <p class="description-text">${caseData.content}</p>
        <div class="tag-list">${tagsHtml}</div>
      </div>

      <!-- 项目信息 -->
      <div class="glass-card">
        <h2>项目信息</h2>
        <div class="meta-grid">
          <div class="meta-item">
            <span class="meta-label">来源平台</span>
            <span class="meta-value">${platform}</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">原始链接</span>
            <span class="meta-value"><a href="${caseData.source_url}" target="_blank" rel="noopener">点击访问 &rarr;</a></span>
          </div>
          <div class="meta-item">
            <span class="meta-label">作者</span>
            <span class="meta-value">${caseData.username}</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">是否上线</span>
            <span class="meta-value">${caseData.is_launched === true ? '已上线' : caseData.is_launched === false ? '未上线' : '未知'}</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">用户数量</span>
            <span class="meta-value">${caseData.user_count || '未知'}</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">盈利情况</span>
            <span class="meta-value">${caseData.profit_status || '未知'}</span>
          </div>
        </div>
      </div>

      <!-- 项目图片（如果有） -->
      ${caseData.images && caseData.images.length > 0 ? `
      <div class="glass-card">
        <h2>项目截图</h2>
        <div class="project-images">
          ${caseData.images.map(img => `<img src="${img}" alt="项目截图" class="project-image" loading="lazy">`).join('')}
        </div>
      </div>
      ` : ''}
    </section>

    <!-- 评论区 -->
    <section class="comments-section">
      <div class="glass-card">
        <h2>评论区</h2>
        <div class="comment-input-area">
          <input type="text" class="comment-input" id="commentInput" placeholder="分享你对这个项目的想法..." maxlength="500">
          <button class="comment-submit-btn" id="submitComment">发布</button>
        </div>
        <div class="comment-list" id="commentList">
          <!-- 评论由 JS 渲染 -->
        </div>
      </div>
    </section>
  `;

  // 绑定事件
  bindEvents(caseData);
  renderComments(caseData.id);
}

// ==================== 事件绑定 ====================

function bindEvents(caseData) {
  const likeBtn = document.getElementById('likeBtn');
  const dislikeBtn = document.getElementById('dislikeBtn');
  const shareBtn = document.getElementById('shareBtn');
  const commentInput = document.getElementById('commentInput');
  const submitComment = document.getElementById('submitComment');
  const webglContainer = document.getElementById('webglBubbleContainer');
  const bubbleTitle = document.querySelector('.bubble-title-overlay');

  // 充气（点赞）按钮
  likeBtn.addEventListener('click', () => {
    if (!audioCtx) initAudio();
    const liked = isLiked(caseData.id);
    const newLiked = !liked;
    setLiked(caseData.id, newLiked);

    if (newLiked) {
      playInflateSound();
      setWebGLBubbleScale(1.18);
      likeBtn.classList.add('liked');
    } else {
      setWebGLBubbleScale(1.0);
      likeBtn.classList.remove('liked');
    }

    const baseCount = caseData.likes;
    const currentLiked = isLiked(caseData.id);
    document.getElementById('likeCount').textContent = baseCount + (currentLiked ? 1 : 0);
  });

  // 戳破（不喜欢）按钮
  dislikeBtn.addEventListener('click', () => {
    if (!audioCtx) initAudio();
    const disliked = isDisliked(caseData.id);
    if (disliked) {
      // 已经戳破了，手动恢复
      setDisliked(caseData.id, false);
      restoreBubble();
      return;
    }

    setDisliked(caseData.id, true);
    playPopSound();
    popBubble();
  });

  /**
   * 戳破气泡 - 粒子爆炸 + 5s 后自动恢复
   */
  function popBubble() {
    if (!webglContainer) return;
    isWebglPopped = true;

    // 隐藏 WebGL 气泡和标题
    webglContainer.style.transition = 'opacity 0.15s ease-out';
    webglContainer.style.opacity = '0';
    if (bubbleTitle) bubbleTitle.style.opacity = '0';

    // 生成大量彩色粒子碎片
    const wrapper = document.getElementById('bubbleWrapper');
    const centerX = 170;
    const centerY = 170;
    const colors = [
      'rgba(236,72,153,',
      'rgba(168,85,247,',
      'rgba(59,130,246,',
      'rgba(6,182,212,',
      'rgba(255,255,255,',
      'rgba(245,158,11,'
    ];

    const particles = [];
    const particleCount = 48;

    for (let i = 0; i < particleCount; i++) {
      const p = document.createElement('div');
      p.className = 'pop-particle';
      const size = 4 + Math.random() * 12;
      const colorBase = colors[Math.floor(Math.random() * colors.length)];
      const opacity = 0.6 + Math.random() * 0.4;

      p.style.width = `${size}px`;
      p.style.height = `${size}px`;
      p.style.background = `radial-gradient(circle, ${colorBase}${opacity}) 0%, transparent 70%)`;
      p.style.boxShadow = `0 0 ${size * 2}px ${colorBase}0.4)`;
      p.style.left = `${centerX}px`;
      p.style.top = `${centerY}px`;

      const angle = (Math.PI * 2 / particleCount) * i + Math.random() * 0.8;
      const speed = 60 + Math.random() * 140;
      const tx = Math.cos(angle) * speed;
      const ty = Math.sin(angle) * speed;
      const rot = Math.random() * 720 - 360;
      const scaleEnd = 0.1 + Math.random() * 0.3;
      const duration = 0.6 + Math.random() * 0.8;

      p.style.transition = `all ${duration}s cubic-bezier(0.25, 0.46, 0.45, 0.94)`;
      wrapper.appendChild(p);
      particles.push(p);

      requestAnimationFrame(() => {
        p.style.transform = `translate(${tx}px, ${ty}px) rotate(${rot}deg) scale(${scaleEnd})`;
        p.style.opacity = '0';
      });
    }

    // 清理粒子
    setTimeout(() => {
      particles.forEach(p => p.remove());
    }, 1600);

    // 5秒后自动恢复
    setTimeout(() => {
      setDisliked(caseData.id, false);
      restoreBubble();
    }, 5000);
  }

  /**
   * 恢复气泡显示
   */
  function restoreBubble() {
    if (!webglContainer) return;
    isWebglPopped = false;
    webglContainer.style.transition = 'opacity 0.6s ease-out';
    webglContainer.style.opacity = '1';
    if (bubbleTitle) {
      bubbleTitle.style.transition = 'opacity 0.6s ease-out 0.2s';
      bubbleTitle.style.opacity = '1';
    }
    setWebGLBubbleScale(isLiked(caseData.id) ? 1.18 : 1.0);
  }

  // 分享按钮
  shareBtn.addEventListener('click', () => {
    if (!audioCtx) initAudio();
    playShareSound();
    openShareModal(caseData);
  });

  // 评论提交
  submitComment.addEventListener('click', () => {
    const content = commentInput.value.trim();
    if (!content) return;
    addComment(caseData.id, content);
    commentInput.value = '';
    renderComments(caseData.id);
  });

  commentInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      submitComment.click();
    }
  });

  // 图片预览
  document.querySelectorAll('.project-image').forEach(img => {
    img.addEventListener('click', () => {
      const preview = document.getElementById('imagePreview');
      const previewImg = document.getElementById('imagePreviewImg');
      previewImg.src = img.src;
      preview.classList.add('show');
    });
  });

  document.getElementById('imagePreview').addEventListener('click', () => {
    document.getElementById('imagePreview').classList.remove('show');
  });
}

// ==================== 评论渲染 ====================

function renderComments(caseId) {
  const list = document.getElementById('commentList');
  if (!list) return;

  const comments = loadComments(caseId);

  if (comments.length === 0) {
    list.innerHTML = '<div class="empty-comments">还没有评论，来做第一个留言的人吧~</div>';
    return;
  }

  list.innerHTML = comments.map(c => `
    <div class="comment-item" data-id="${c.id}">
      <div class="comment-header">
        <span class="comment-author">匿名用户</span>
        <span class="comment-time">${formatTime(c.time)}</span>
      </div>
      <div class="comment-body">${escapeHtml(c.content)}</div>
      <div class="comment-actions">
        <button class="comment-like-btn ${c.liked ? 'liked' : ''}" data-id="${c.id}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="${c.liked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
          ${c.likes || 0}
        </button>
      </div>
    </div>
  `).join('');

  // 绑定评论点赞
  list.querySelectorAll('.comment-like-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const commentId = btn.dataset.id;
      likeComment(caseId, commentId);
      renderComments(caseId);
    });
  });
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ==================== 分享弹窗 ====================

let currentShareCanvas = null;

function openShareModal(caseData) {
  const modal = document.getElementById('shareModal');
  const platform = platformNames[caseData.source_platform] || caseData.source_platform;

  document.getElementById('shareCardTitle').textContent = caseData.title;
  document.getElementById('shareCardAuthor').textContent = `by ${caseData.username} · ${platform}`;

  // 预生成 canvas
  currentShareCanvas = generateShareCard(caseData);

  modal.classList.add('show');
}

function closeShareModal() {
  document.getElementById('shareModal').classList.remove('show');
}

// 分享选项点击
document.querySelectorAll('.share-option').forEach(btn => {
  btn.addEventListener('click', () => {
    const platform = btn.dataset.platform;
    const url = window.location.href;

    switch (platform) {
      case 'wechat':
        alert('请使用微信扫一扫分享，或截图发送给好友');
        break;
      case 'douyin':
        alert('已复制链接，请打开抖音粘贴分享');
        navigator.clipboard.writeText(url);
        break;
      case 'xiaohongshu':
        alert('已复制链接，请打开小红书粘贴分享');
        navigator.clipboard.writeText(url);
        break;
      case 'link':
        window.open(url, '_blank');
        break;
      case 'copy':
        navigator.clipboard.writeText(url).then(() => {
          const original = btn.textContent;
          btn.textContent = '已复制';
          setTimeout(() => btn.textContent = original, 2000);
        });
        break;
    }
  });
});

document.getElementById('closeShareModal').addEventListener('click', closeShareModal);
document.getElementById('shareModal').addEventListener('click', (e) => {
  if (e.target.id === 'shareModal') closeShareModal();
});

// 下载分享卡片
document.getElementById('downloadCardBtn').addEventListener('click', () => {
  if (!currentShareCanvas) return;
  const link = document.createElement('a');
  link.download = `vibe-bubble-${Date.now()}.png`;
  link.href = currentShareCanvas.toDataURL('image/png');
  link.click();
});

// ESC 关闭弹窗
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeShareModal();
    document.getElementById('imagePreview').classList.remove('show');
  }
});

// ==================== 启动 ====================
async function init() {
  // 先从 Supabase 加载数据
  await loadDataFromSupabase();

  const caseId = getUrlParam('id');
  if (!caseId) {
    renderNotFound();
    return;
  }

  const caseData = findCaseById(caseId);
  if (!caseData) {
    renderNotFound();
    return;
  }

  renderPage(caseData);
  generateBackgroundEffects();
  initWebGLBubble();
}

/**
 * 生成漂浮背景气泡和轻粒子
 */
function generateBackgroundEffects() {
  const bubblesContainer = document.getElementById('bgBubbles');
  const particlesContainer = document.getElementById('lightParticles');
  if (!bubblesContainer || !particlesContainer) return;

  // 生成 8 个漂浮气泡
  for (let i = 0; i < 8; i++) {
    const b = document.createElement('div');
    b.className = 'bg-bubble';
    const size = 30 + Math.random() * 80;
    b.style.cssText = `
      left: ${Math.random() * 100}%;
      width: ${size}px;
      height: ${size}px;
      animation-delay: ${Math.random() * 8}s;
      animation-duration: ${10 + Math.random() * 12}s;
    `;
    bubblesContainer.appendChild(b);
  }

  // 生成 20 个轻粒子
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'light-particle';
    p.style.cssText = `
      left: ${Math.random() * 100}%;
      animation-delay: ${Math.random() * 10}s;
      animation-duration: ${6 + Math.random() * 10}s;
    `;
    particlesContainer.appendChild(p);
  }
}

// 页面加载完成后初始化
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
