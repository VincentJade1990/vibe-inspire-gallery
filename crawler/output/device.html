<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>连接 AI Passport · VibeBubble</title>
<style>
  :root {
    --bg: #07060d;
    --card: rgba(255, 255, 255, 0.045);
    --stroke: rgba(255, 255, 255, 0.09);
    --text: #f2f0ff;
    --muted: rgba(242, 240, 255, 0.55);
    --purple: #a78bfa;
    --purple-deep: #7c5cfc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 20% -10%, rgba(124, 92, 252, 0.22), transparent 60%),
      radial-gradient(900px 500px at 100% 10%, rgba(167, 139, 250, 0.14), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px 56px;
  }
  .wrap { width: 100%; max-width: 480px; }
  .back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    margin-bottom: 28px;
    transition: color .2s;
  }
  .back:hover { color: var(--text); }
  .title { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 8px; }
  .subtitle { color: var(--muted); font-size: 14px; line-height: 1.7; margin: 0 0 28px; }
  .card {
    background: var(--card);
    border: 1px solid var(--stroke);
    border-radius: 20px;
    padding: 28px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
  }
  .btn {
    width: 100%;
    border: 0;
    border-radius: 12px;
    padding: 14px 18px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    color: #fff;
    background: linear-gradient(135deg, var(--purple-deep), var(--purple));
    cursor: pointer;
    transition: transform .15s, opacity .2s;
  }
  .btn:hover:not(:disabled) { transform: translateY(-1px); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-ghost {
    background: transparent;
    border: 1px solid var(--stroke);
    color: var(--muted);
    font-weight: 500;
  }
  .btn-ghost:hover:not(:disabled) { color: var(--text); }
  .hint { color: var(--muted); font-size: 12.5px; line-height: 1.7; margin: 16px 0 0; }
  .code-box { text-align: center; padding: 8px 0 4px; }
  .code {
    font-size: 44px;
    font-weight: 700;
    letter-spacing: 10px;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(135deg, #fff, var(--purple));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    user-select: all;
    margin-left: 10px;
  }
  .countdown { color: var(--muted); font-size: 13px; margin-top: 10px; }
  .countdown b { color: var(--purple); font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 10px; margin-top: 22px; }
  .row .btn { flex: 1; }
  .steps { margin: 22px 0 0; padding: 0; list-style: none; counter-reset: s; }
  .steps li {
    counter-increment: s;
    position: relative;
    padding-left: 30px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.9;
  }
  .steps li::before {
    content: counter(s);
    position: absolute;
    left: 0;
    top: 3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: rgba(167, 139, 250, 0.16);
    color: var(--purple);
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .state { display: none; }
  .state.active { display: block; }
  .err {
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(255, 92, 92, 0.12);
    border: 1px solid rgba(255, 92, 92, 0.25);
    color: #ffb3b3;
    font-size: 13px;
    line-height: 1.6;
    display: none;
  }
  .err.show { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="profile.html">← 返回我的主页</a>

  <h1 class="title">连接 AI Passport</h1>
  <p class="subtitle">
    生成一次性配对码，在 AI Passport 上输入即可绑定你的账号。<br>
    绑定后，设备上看到的灵感和记录的灵感，都会同步到这里。
  </p>

  <div class="card">
    <!-- 未登录 -->
    <div class="state" id="stateGuest">
      <p class="hint" style="margin-top:0;">请先登录 VibeBubble，再回来生成配对码。</p>
      <div class="row">
        <a class="btn" href="index.html" style="text-align:center;text-decoration:none;display:block;">去登录</a>
      </div>
    </div>

    <!-- 已登录，未生成 -->
    <div class="state" id="stateIdle">
      <button class="btn" id="genBtn">生成配对码</button>
      <ol class="steps">
        <li>点击上方按钮，得到一个 6 位数字</li>
        <li>在 AI Passport 上进入「连接设备」，输入这 6 位数字</li>
        <li>设备显示「已连接」即完成，之后无需重复配对</li>
      </ol>
    </div>

    <!-- 已生成 -->
    <div class="state" id="stateCode">
      <div class="code-box">
        <div class="code" id="codeText">------</div>
        <div class="countdown">剩余有效时间 <b id="countdown">--:--</b></div>
      </div>
      <div class="row">
        <button class="btn btn-ghost" id="copyBtn">复制</button>
        <button class="btn btn-ghost" id="againBtn">换一个</button>
      </div>
      <p class="hint">配对码 10 分钟内有效，且只能使用一次。生成新码后旧码立即失效。</p>
    </div>

    <div class="err" id="errBox"></div>
  </div>
</div>

<script>
(function () {
  // 后台接口地址：正式环境走 admin 域名；本地联调可加 ?api=http://localhost:3000
  var API = new URLSearchParams(location.search).get('api') || 'https://admin.vibebubble.co';
  var token = localStorage.getItem('vb_access_token');

  var els = {
    guest: document.getElementById('stateGuest'),
    idle: document.getElementById('stateIdle'),
    code: document.getElementById('stateCode'),
    genBtn: document.getElementById('genBtn'),
    copyBtn: document.getElementById('copyBtn'),
    againBtn: document.getElementById('againBtn'),
    codeText: document.getElementById('codeText'),
    countdown: document.getElementById('countdown'),
    err: document.getElementById('errBox')
  };

  var timer = null;
  var currentCode = '';

  function show(state) {
    [els.guest, els.idle, els.code].forEach(function (el) { el.classList.remove('active'); });
    state.classList.add('active');
  }

  function showError(msg) {
    els.err.textContent = msg;
    els.err.classList.add('show');
  }

  function clearError() {
    els.err.textContent = '';
    els.err.classList.remove('show');
  }

  function stopTimer() {
    if (timer) { clearInterval(timer); timer = null; }
  }

  function startCountdown(expiresAt) {
    stopTimer();
    var end = new Date(expiresAt).getTime();

    function tick() {
      var left = end - Date.now();
      if (left <= 0) {
        stopTimer();
        els.countdown.textContent = '00:00';
        els.codeText.textContent = '------';
        show(els.idle);
        showError('配对码已过期，请重新生成。');
        return;
      }
      var m = Math.floor(left / 60000);
      var s = Math.floor((left % 60000) / 1000);
      els.countdown.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    }

    tick();
    timer = setInterval(tick, 1000);
  }

  async function generate() {
    clearError();
    els.genBtn.disabled = true;
    els.againBtn.disabled = true;

    try {
      var res = await fetch(API + '/api/device/pair-code', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token }
      });
      var body = await res.json().catch(function () { return null; });

      if (!res.ok || !body || body.ok !== true) {
        var code = body && body.error && body.error.code;
        if (res.status === 401) { show(els.guest); return; }
        if (code === 'MISSING_ENV') {
          showError('后台还没配置 service role key，暂时无法生成配对码。');
        } else {
          showError((body && body.error && body.error.message) || '生成失败，请稍后再试。');
        }
        return;
      }

      currentCode = body.data.code;
      els.codeText.textContent = currentCode;
      show(els.code);
      startCountdown(body.data.expires_at);
    } catch (e) {
      showError('网络异常，请检查网络后重试。');
    } finally {
      els.genBtn.disabled = false;
      els.againBtn.disabled = false;
    }
  }

  els.genBtn.addEventListener('click', generate);
  els.againBtn.addEventListener('click', generate);

  els.copyBtn.addEventListener('click', async function () {
    if (!currentCode) return;
    try {
      await navigator.clipboard.writeText(currentCode);
      els.copyBtn.textContent = '已复制';
      setTimeout(function () { els.copyBtn.textContent = '复制'; }, 1500);
    } catch (e) {
      showError('复制失败，请手动选中数字。');
    }
  });

  // 初始状态
  if (!token) {
    show(els.guest);
  } else {
    show(els.idle);
  }
})();
</script>
</body>
</html>
