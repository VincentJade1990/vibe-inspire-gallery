<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人中心 - Vibe Bubble</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="./auth.js"></script>
<script>window.VBNavConfig = { mode: 'sub', backHref: './gallery.html', backLabel: 'BACK' };</script>
<script src="./nav.js"></script>
<style>
/* ===== CSS 变量与基础重置 ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-deep: #050a14;
  --bg-mid: #0a0f1a;
  --bg-surface: rgba(255, 255, 255, 0.02);
  --purple: #a855f7;
  --pink: #ec4899;
  --blue: #3b82f6;
  --cyan: #06b6d4;
  --amber: #f59e0b;
  --text: #f8fafc;
  --text-dim: #94a3b8;
  --text-muted: #64748b;
  --glass: rgba(255, 255, 255, 0.03);
  --glass-border: rgba(255, 255, 255, 0.08);
  --glass-highlight: rgba(255, 255, 255, 0.05);
  --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.25);
  --shadow-glow: 0 0 40px rgba(168, 85, 247, 0.15);
  --radius: 20px;
  --radius-lg: 24px;
  --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-deep);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  overflow-x: hidden;
  position: relative;
}

/* ===== 背景效果（与 gallery/detail 一致） ===== */
body::before {
  content: '';
  position: fixed;
  inset: -120px;
  background: conic-gradient(
    from 0deg,
    rgba(236, 72, 153, 0.18),
    rgba(168, 85, 247, 0.18),
    rgba(59, 130, 246, 0.18),
    rgba(6, 182, 212, 0.16),
    rgba(245, 158, 11, 0.12),
    rgba(236, 72, 153, 0.18)
  );
  animation: iridescentRotate 20s linear infinite;
  z-index: -2;
  filter: blur(80px);
  pointer-events: none;
}

@keyframes iridescentRotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 70% 70% at 15% 25%, rgba(168, 85, 247, 0.14) 0%, transparent 55%),
    radial-gradient(ellipse 60% 60% at 85% 75%, rgba(236, 72, 153, 0.10) 0%, transparent 45%),
    radial-gradient(ellipse 50% 50% at 50% 50%, rgba(59, 130, 246, 0.08) 0%, transparent 45%),
    radial-gradient(ellipse 80% 40% at 50% 100%, rgba(168, 85, 247, 0.06) 0%, transparent 50%),
    linear-gradient(180deg, #040814 0%, #0a0f1a 35%, #080c18 70%, #0d0818 100%);
  z-index: -3;
  pointer-events: none;
}

/* ===== 导航栏 ===== */
.navbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  background: rgba(5, 10, 20, 0.7);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

.navbar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--text);
  font-size: 18px;
  font-weight: 700;
}

.navbar-brand .logo-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}

.navbar-nav {
  display: flex;
  align-items: center;
  gap: 20px;
}

.navbar-nav a {
  color: var(--text-dim);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  transition: var(--transition);
  padding: 6px 12px;
  border-radius: 8px;
}

.navbar-nav a:hover {
  color: var(--text);
  background: rgba(255, 255, 255, 0.05);
}

.navbar-nav a.active {
  color: var(--text);
  background: rgba(168, 85, 247, 0.1);
}

/* ===== 页面容器 ===== */
.page-container {
  max-width: 720px;
  margin: 0 auto;
  padding: 80px 24px 80px;
  position: relative;
  z-index: 1;
}

/* ===== 页面标题 ===== */
.page-title {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 32px;
  background: linear-gradient(90deg, var(--purple), var(--pink));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ===== iOS 玻璃拟态卡片 ===== */
.glass-card {
  background: rgba(255, 255, 255, 0.04);
  backdrop-filter: blur(28px) saturate(1.6);
  -webkit-backdrop-filter: blur(28px) saturate(1.6);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: var(--radius-lg);
  padding: 32px;
  margin-bottom: 24px;
  box-shadow:
    0 8px 32px rgba(0, 0, 0, 0.25),
    0 0 0 1px rgba(255, 255, 255, 0.02) inset,
    inset 0 1px 0 rgba(255, 255, 255, 0.08);
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}

.glass-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
}

.glass-card:hover {
  border-color: rgba(255, 255, 255, 0.18);
  box-shadow:
    0 16px 48px rgba(0, 0, 0, 0.3),
    0 0 40px rgba(168, 85, 247, 0.08),
    0 0 0 1px rgba(255, 255, 255, 0.03) inset,
    inset 0 1px 0 rgba(255, 255, 255, 0.1);
  transform: translateY(-3px);
}

/* ===== 用户信息卡片 ===== */
.user-card {
  display: flex;
  align-items: center;
  gap: 24px;
}

.user-avatar {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
  box-shadow: 0 4px 20px rgba(168, 85, 247, 0.3);
  overflow: hidden;
}

.user-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.user-info {
  flex: 1;
  min-width: 0;
}

.user-name {
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.user-email {
  font-size: 14px;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.user-provider {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--text-muted);
  padding: 4px 10px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--glass-border);
}

/* ===== 编辑昵称 ===== */
.nickname-edit {
  display: flex;
  align-items: center;
  gap: 8px;
}

.nickname-input {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 10px;
  padding: 6px 12px;
  color: var(--text);
  font-size: 16px;
  font-family: inherit;
  outline: none;
  width: 200px;
}

.nickname-input:focus {
  border-color: var(--purple);
}

.edit-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px;
  border-radius: 6px;
  transition: all 0.2s;
  font-size: 14px;
}

.edit-btn:hover {
  color: var(--text);
  background: rgba(255, 255, 255, 0.08);
}

.save-btn {
  padding: 6px 14px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  color: #fff;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}

.save-btn:hover {
  opacity: 0.9;
  transform: translateY(-1px);
}

.save-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.edit-error {
  font-size: 12px;
  color: #f87171;
  margin-top: 4px;
}

/* ===== 统计卡片 ===== */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}

.stat-item {
  text-align: center;
  padding: 20px;
  border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--glass-border);
  transition: var(--transition);
}

.stat-item:hover {
  background: rgba(255, 255, 255, 0.05);
  border-color: rgba(168, 85, 247, 0.2);
  transform: translateY(-2px);
}

.stat-number {
  font-size: 28px;
  font-weight: 700;
  background: linear-gradient(90deg, var(--purple), var(--pink));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 4px;
}

.stat-label {
  font-size: 13px;
  color: var(--text-muted);
}

/* ===== 收藏列表 ===== */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}

.section-title {
  font-size: 18px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}

.favorites-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

.favorite-card {
  background: rgba(255, 255, 255, 0.04);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: var(--radius);
  overflow: hidden;
  transition: var(--transition);
  position: relative;
}

.favorite-card:hover {
  transform: translateY(-4px);
  border-color: rgba(168, 85, 247, 0.3);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3), 0 0 30px rgba(168, 85, 247, 0.08);
}

.favorite-card .card-cover {
  width: 100%;
  height: 160px;
  object-fit: cover;
  background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(236, 72, 153, 0.15));
}

.favorite-card .card-body {
  padding: 16px;
}

.favorite-card .card-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 8px;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.favorite-card .card-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.favorite-card .card-tags {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}

.favorite-card .card-tag {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  background: rgba(168, 85, 247, 0.1);
  color: var(--purple);
  border: 1px solid rgba(168, 85, 247, 0.2);
}

.favorite-card .unfav-btn {
  background: none;
  border: none;
  color: var(--pink);
  cursor: pointer;
  padding: 4px;
  border-radius: 6px;
  transition: all 0.2s;
  font-size: 16px;
  flex-shrink: 0;
}

.favorite-card .unfav-btn:hover {
  background: rgba(236, 72, 153, 0.1);
  transform: scale(1.1);
}

/* ===== 空状态 ===== */
.empty-state {
  text-align: center;
  padding: 48px 24px;
  color: var(--text-muted);
}

.empty-state .empty-icon {
  font-size: 48px;
  margin-bottom: 16px;
  opacity: 0.5;
}

.empty-state .empty-text {
  font-size: 14px;
}

/* ===== 账号设置 ===== */
.settings-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.setting-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

.setting-item:last-child {
  border-bottom: none;
}

.setting-label {
  font-size: 14px;
  color: var(--text-dim);
}

.logout-btn {
  padding: 8px 20px;
  border-radius: 10px;
  border: 1px solid rgba(239, 68, 68, 0.3);
  background: rgba(239, 68, 68, 0.08);
  color: #f87171;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.logout-btn:hover {
  background: rgba(239, 68, 68, 0.15);
  border-color: rgba(239, 68, 68, 0.5);
  transform: translateY(-1px);
}

/* ===== 加载状态 ===== */
.skeleton {
  background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
  background-size: 200% 100%;
  animation: skeleton 1.5s infinite;
  border-radius: 8px;
}

@keyframes skeleton {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ===== 响应式 ===== */
@media (max-width: 640px) {
  .page-container {
    padding: 88px 16px 60px;
  }

  .user-card {
    flex-direction: column;
    text-align: center;
  }

  .stats-grid {
    grid-template-columns: 1fr 1fr;
  }

  .favorites-grid {
    grid-template-columns: 1fr;
  }

  .navbar {
    padding: 12px 16px;
  }

  .navbar-brand span:not(.logo-icon) {
    display: none;
  }
}

/* ===== 滚动条 ===== */
::-webkit-scrollbar {
  width: 6px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.1);
  border-radius: 3px;
}

::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 255, 255, 0.2);
}
</style>
</head>

<body>
<!-- 子页面返回按钮挂载点 -->
<div id="vb-nav-mount"></div>

<!-- 页面内容 -->
<div class="page-container">
  <h1 class="page-title">&#x1F464; 个人中心</h1>

  <!-- 用户信息卡片 -->
  <div class="glass-card" id="userCard">
    <div class="user-card">
      <div class="user-avatar" id="userAvatar">&#x1F464;</div>
      <div class="user-info">
        <div class="user-name" id="userName">
          <span id="nicknameDisplay">加载中...</span>
          <button class="edit-btn" id="editNicknameBtn" title="修改昵称">&#x270F;</button>
        </div>
        <div class="user-email" id="userEmail">--</div>
        <div class="user-provider" id="userProvider">--</div>
      </div>
    </div>
  </div>

  <!-- 统计信息 -->
  <div class="glass-card">
    <div class="stats-grid" id="statsGrid">
      <div class="stat-item">
        <div class="stat-number skeleton" style="width:60px;height:36px;margin:0 auto 4px;"></div>
        <div class="stat-label">我的收藏</div>
      </div>
      <div class="stat-item">
        <div class="stat-number skeleton" style="width:60px;height:36px;margin:0 auto 4px;"></div>
        <div class="stat-label">我的评分</div>
      </div>
    </div>
  </div>

  <!-- 收藏列表 -->
  <div class="glass-card">
    <div class="section-header">
      <div class="section-title">&#x1F4CC; 我的收藏</div>
    </div>
    <div id="favoritesContainer">
      <div class="favorites-grid" id="favoritesGrid">
        <!-- 收藏卡片由 JS 渲染 -->
      </div>
    </div>
  </div>

  <!-- 账号设置 -->
  <div class="glass-card">
    <div class="section-header">
      <div class="section-title">&#x2699;&#xFE0F; 账号设置</div>
    </div>
    <div class="settings-list">
      <div class="setting-item">
        <span class="setting-label">退出当前账号</span>
        <button class="logout-btn" id="logoutBtn">退出登录</button>
      </div>
    </div>
  </div>
</div>

<script>
// ==================== 页面初始化 ====================

let isEditingNickname = false;

async function init() {
  // 等待 auth 初始化完成
  let attempts = 0;
  while (!authReady && attempts < 50) {
    await new Promise(r => setTimeout(r, 100));
    attempts++;
  }

  // 检查登录状态
  if (!currentUser) {
    // 未登录，重定向到首页
    window.location.href = './gallery.html';
    return;
  }

  // 渲染用户信息
  renderUserInfo();

  // 加载统计数据
  loadStats();

  // 加载收藏列表
  loadFavorites();

  // 绑定事件
  bindEvents();
}

// ==================== 渲染用户信息 ====================

function renderUserInfo() {
  if (!currentUser) return;

  const avatarEl = document.getElementById('userAvatar');
  const nameEl = document.getElementById('nicknameDisplay');
  const emailEl = document.getElementById('userEmail');
  const providerEl = document.getElementById('userProvider');

  // 头像
  if (currentUser.avatar) {
    avatarEl.innerHTML = `<img src="${currentUser.avatar}" alt="avatar" referrerpolicy="no-referrer">`;
  } else {
    const initial = (currentUser.nickname || currentUser.email || 'U').charAt(0).toUpperCase();
    avatarEl.textContent = initial;
  }

  // 昵称
  nameEl.textContent = currentUser.nickname || currentUser.email?.split('@')[0] || '用户';

  // 邮箱
  emailEl.textContent = currentUser.email || '';

  // 注册方式
  const providerMap = {
    'github': 'GitHub',
    'email': '邮箱注册'
  };
  providerEl.innerHTML = `
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    ${providerMap[currentUser.provider] || currentUser.provider || '邮箱注册'}
  `;
}

// ==================== 昵称编辑 ====================

function bindEvents() {
  const editBtn = document.getElementById('editNicknameBtn');
  const logoutBtn = document.getElementById('logoutBtn');

  editBtn?.addEventListener('click', toggleNicknameEdit);
  logoutBtn?.addEventListener('click', () => {
    if (confirm('确定要退出登录吗？')) {
      signOut();
    }
  });
}

function toggleNicknameEdit() {
  const nameContainer = document.getElementById('userName');
  const displayEl = document.getElementById('nicknameDisplay');

  if (isEditingNickname) {
    // 取消编辑
    renderUserInfo();
    isEditingNickname = false;
    return;
  }

  isEditingNickname = true;
  const currentName = displayEl.textContent;

  nameContainer.innerHTML = `
    <div class="nickname-edit">
      <input type="text" class="nickname-input" id="nicknameInput" value="${currentName}" maxlength="20" placeholder="输入新昵称">
      <button class="save-btn" id="saveNicknameBtn">保存</button>
      <button class="edit-btn" id="cancelEditBtn">&#x2715;</button>
    </div>
  `;

  const input = document.getElementById('nicknameInput');
  const saveBtn = document.getElementById('saveNicknameBtn');
  const cancelBtn = document.getElementById('cancelEditBtn');

  input.focus();
  input.select();

  saveBtn.addEventListener('click', async () => {
    const newName = input.value.trim();
    if (!newName) return;

    saveBtn.disabled = true;
    saveBtn.textContent = '保存中...';

    const result = await updateNickname(newName);

    if (result.success) {
      isEditingNickname = false;
      renderUserInfo();
      // 恢复编辑按钮
      const nameEl = document.getElementById('userName');
      if (nameEl && !document.getElementById('editNicknameBtn')) {
        nameEl.insertAdjacentHTML('beforeend', '<button class="edit-btn" id="editNicknameBtn" title="修改昵称">&#x270F;</button>');
        document.getElementById('editNicknameBtn').addEventListener('click', toggleNicknameEdit);
      }
    } else {
      saveBtn.disabled = false;
      saveBtn.textContent = '保存';
      // 显示错误
      let errorEl = document.querySelector('.edit-error');
      if (!errorEl) {
        errorEl = document.createElement('div');
        errorEl.className = 'edit-error';
        input.parentElement.appendChild(errorEl);
      }
      errorEl.textContent = result.error;
    }
  });

  cancelBtn.addEventListener('click', () => {
    isEditingNickname = false;
    renderUserInfo();
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') saveBtn.click();
    if (e.key === 'Escape') cancelBtn.click();
  });
}

// ==================== 加载统计 ====================

async function loadStats() {
  if (!currentUser) return;

  const stats = await getUserStats(currentUser.id);

  const grid = document.getElementById('statsGrid');
  grid.innerHTML = `
    <div class="stat-item">
      <div class="stat-number">${stats.favorites}</div>
      <div class="stat-label">我的收藏</div>
    </div>
    <div class="stat-item">
      <div class="stat-number">${stats.ratings}</div>
      <div class="stat-label">我的评分</div>
    </div>
  `;
}

// ==================== 加载收藏列表 ====================

async function loadFavorites() {
  if (!currentUser) return;

  const container = document.getElementById('favoritesGrid');
  const favorites = await getUserFavorites(currentUser.id);

  if (favorites.length === 0) {
    container.innerHTML = `
      <div class="empty-state" style="grid-column: 1 / -1;">
        <div class="empty-icon">&#x1F4CB;</div>
        <div class="empty-text">还没有收藏任何灵感</div>
        <div class="empty-text" style="margin-top:8px;font-size:13px;">
          <a href="./gallery.html" style="color:var(--purple);text-decoration:none;">去首页逛逛 &#x2192;</a>
        </div>
      </div>
    `;
    return;
  }

  container.innerHTML = favorites.map(item => {
    const coverHtml = item.cover_image_url
      ? `<img class="card-cover" src="${item.cover_image_url}" alt="${item.title}" loading="lazy" referrerpolicy="no-referrer">`
      : `<div class="card-cover" style="display:flex;align-items:center;justify-content:center;font-size:40px;">&#x2728;</div>`;

    const tagsHtml = (item.tags || []).slice(0, 3).map(tag =>
      `<span class="card-tag">${tag}</span>`
    ).join('');

    return `
      <a href="./detail.html?id=${item.id}" class="favorite-card" style="text-decoration:none;color:inherit;">
        ${coverHtml}
        <div class="card-body">
          <div class="card-title">${item.title || '未命名灵感'}</div>
          <div class="card-meta">
            <div class="card-tags">${tagsHtml}</div>
            <button class="unfav-btn" data-id="${item.id}" title="取消收藏">&#x2764;</button>
          </div>
        </div>
      </a>
    `;
  }).join('');

  // 绑定取消收藏事件
  container.querySelectorAll('.unfav-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.preventDefault();
      e.stopPropagation();

      const inspirationId = btn.dataset.id;
      if (!confirm('确定取消收藏这个灵感吗？')) return;

      const result = await removeFavorite(inspirationId);
      if (result.success) {
        // 移除卡片动画
        const card = btn.closest('.favorite-card');
        card.style.transition = 'all 0.3s ease';
        card.style.opacity = '0';
        card.style.transform = 'scale(0.9)';
        setTimeout(() => {
          card.remove();
          // 如果为空，显示空状态
          if (container.children.length === 0) {
            loadFavorites();
          }
          // 刷新统计
          loadStats();
        }, 300);
      }
    });
  });
}

// ==================== 初始化 ====================

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>

</body>
</html>
