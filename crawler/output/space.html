<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative Space - Vibe Bubble</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="./auth.js"></script>
<script src="./nav.js"></script>
<style>
/* ===== 基础重置与变量 ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-deep: #0a0a0f;
  --bg-mid: #0f0f1a;
  --purple: #8b5cf6;
  --purple-light: #a78bfa;
  --blue: #3b82f6;
  --pink: #ec4899;
  --cyan: #06b6d4;
  --amber: #f59e0b;
  --green: #10b981;
  --red: #ef4444;
  --indigo: #6366f1;
  --text: #f8fafc;
  --text-dim: #94a3b8;
  --text-muted: #64748b;
  --glass-border: rgba(255, 255, 255, 0.08);
  --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-deep);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  overflow-x: hidden;
  position: relative;
  padding-top: 68px;
}

/* ===== 深色宇宙背景 ===== */
body::before {
  content: '';
  position: fixed;
  inset: -120px;
  background: conic-gradient(
    from 0deg,
    rgba(139, 92, 246, 0.12),
    rgba(59, 130, 246, 0.12),
    rgba(236, 72, 153, 0.10),
    rgba(6, 182, 212, 0.08),
    rgba(139, 92, 246, 0.12)
  );
  animation: cosmicRotate 30s linear infinite;
  z-index: -2;
  filter: blur(100px);
  pointer-events: none;
}

@keyframes cosmicRotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 60% at 20% 20%, rgba(139, 92, 246, 0.10) 0%, transparent 50%),
    radial-gradient(ellipse 50% 50% at 80% 80%, rgba(59, 130, 246, 0.08) 0%, transparent 45%),
    radial-gradient(ellipse 40% 40% at 50% 50%, rgba(236, 72, 153, 0.05) 0%, transparent 40%),
    linear-gradient(180deg, #08080f 0%, #0a0a0f 50%, #0c0815 100%);
  z-index: -3;
  pointer-events: none;
}

/* ===== 页面容器 ===== */
.space-container {
  max-width: 720px;
  margin: 0 auto;
  padding: 40px 24px 120px;
  position: relative;
  z-index: 1;
}

/* ===== 巨大渐变标题 ===== */
.space-header {
  text-align: center;
  margin-bottom: 24px;
}

.space-title {
  font-size: clamp(42px, 5vw, 64px);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1;
  margin-bottom: 10px;
  background: linear-gradient(135deg, #c4b5fd 0%, var(--purple) 35%, var(--blue) 70%, #60a5fa 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.space-welcome {
  font-size: 15px;
  color: var(--text-dim);
  font-weight: 400;
  letter-spacing: 0.02em;
}

.space-welcome .welcome-name {
  background: linear-gradient(90deg, var(--purple), var(--blue));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 600;
}

/* ===== 胶囊分段标签栏 ===== */
.tabs {
  display: flex;
  gap: 6px;
  margin: 0 auto 36px;
  padding: 5px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--glass-border);
  border-radius: 999px;
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  width: fit-content;
}

.tab {
  padding: 9px 24px;
  border: none;
  background: transparent;
  color: var(--text-dim);
  font-size: 14px;
  font-weight: 600;
  font-family: inherit;
  letter-spacing: 0.04em;
  border-radius: 999px;
  cursor: pointer;
  transition: var(--transition);
}

.tab:hover:not(.disabled) { color: var(--text); }

.tab.active {
  color: #fff;
  background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(59, 130, 246, 0.25));
  box-shadow: 0 0 20px rgba(139, 92, 246, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.1);
}

.tab.disabled { opacity: 0.4; cursor: not-allowed; }

.tab.tab-flash {
  animation: tabFlash 1.5s ease;
}

@keyframes tabFlash {
  0%, 100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.15); }
  20%, 60% { box-shadow: 0 0 40px rgba(139, 92, 246, 0.6), 0 0 80px rgba(139, 92, 246, 0.3); }
}

/* ===== 标签面板 ===== */
.tab-panel { display: none; }
.tab-panel.active { display: block; animation: panelFadeIn 0.4s ease; }

@keyframes panelFadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== 气泡舞台区域 ===== */
.bubble-stage {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  min-height: 380px;
  position: relative;
  padding: 20px 0;
}

/* 导航箭头 */
.nav-arrow {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(255, 255, 255, 0.03);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  color: var(--text-dim);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
  flex-shrink: 0;
  z-index: 5;
}

.nav-arrow:hover {
  background: rgba(139, 92, 246, 0.15);
  border-color: rgba(139, 92, 246, 0.4);
  color: var(--text);
  transform: scale(1.1);
}

.nav-arrow:active { transform: scale(0.92); }

.nav-arrow.disabled {
  opacity: 0.2;
  cursor: not-allowed;
  pointer-events: none;
}

.bubble-center {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ===== 核心玻璃态气泡 ===== */
.center-bubble {
  width: var(--bubble-size, 360px);
  height: var(--bubble-size, 360px);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background: radial-gradient(
    circle at 35% 30%,
    rgba(255, 255, 255, calc(var(--bubble-opacity, 1) * 0.12)),
    rgba(139, 92, 246, calc(var(--bubble-opacity, 1) * 0.10)) 40%,
    rgba(59, 130, 246, calc(var(--bubble-opacity, 1) * 0.06)) 70%,
    rgba(10, 10, 15, 0.4) 100%
  );
  border: 1px solid rgba(255, 255, 255, calc(var(--bubble-opacity, 1) * 0.12));
  box-shadow:
    0 0 var(--bubble-glow, 60px) rgba(139, 92, 246, calc(var(--bubble-opacity, 1) * 0.25)),
    inset 0 0 60px rgba(139, 92, 246, calc(var(--bubble-opacity, 1) * 0.10)),
    inset 0 2px 4px rgba(255, 255, 255, calc(var(--bubble-opacity, 1) * 0.08));
  backdrop-filter: blur(16px) saturate(1.4);
  -webkit-backdrop-filter: blur(16px) saturate(1.4);
  transition:
    width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1),
    height 0.8s cubic-bezier(0.34, 1.56, 0.64, 1),
    box-shadow 0.8s ease,
    opacity 0.6s ease;
  animation: bubbleFloat 5s ease-in-out infinite;
  cursor: pointer;
}

.center-bubble::before {
  content: '';
  position: absolute;
  top: 12%;
  left: 18%;
  width: 32%;
  height: 28%;
  border-radius: 50%;
  background: rgba(255, 255, 255, calc(var(--bubble-opacity, 1) * 0.2));
  filter: blur(10px);
  pointer-events: none;
  z-index: 1;
}

.center-bubble.iridescent::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: conic-gradient(
    from 0deg,
    rgba(236, 72, 153, 0.10),
    rgba(139, 92, 246, 0.10),
    rgba(59, 130, 246, 0.10),
    rgba(6, 182, 212, 0.10),
    rgba(245, 158, 11, 0.08),
    rgba(236, 72, 153, 0.10)
  );
  animation: iridescentSpin 8s linear infinite;
  pointer-events: none;
  mix-blend-mode: screen;
  z-index: 0;
}

@keyframes iridescentSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes bubbleFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.bubble-title-inner {
  font-size: var(--bubble-font-size, 16px);
  font-weight: 600;
  text-align: center;
  padding: 0 18%;
  color: rgba(255, 255, 255, 0.95);
  word-break: break-word;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: var(--bubble-line-clamp, 5);
  -webkit-box-orient: vertical;
  text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
  z-index: 2;
  position: relative;
  line-height: 1.4;
}

.center-bubble.subtle-glow {
  animation: bubbleFloat 5s ease-in-out infinite, subtleGlow 1.2s ease;
}

@keyframes subtleGlow {
  0% { filter: brightness(1); }
  30% { filter: brightness(1.2) saturate(1.3); }
  100% { filter: brightness(1); }
}

.center-bubble.grow-in {
  animation: bubbleFloat 5s ease-in-out infinite, bubbleGrowIn 1s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes bubbleGrowIn {
  0% { transform: scale(0); opacity: 0; }
  50% { transform: scale(1.15); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}

/* ===== 产品阶段节点（8节点） ===== */
.stage-bar-wrap {
  max-width: 640px;
  margin: 32px auto 0;
}

.stage-bar {
  display: flex;
  align-items: flex-start;
  gap: 0;
}

.stage-seg {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  cursor: pointer;
  padding: 4px 0;
}

.stage-seg:not(:last-child)::after {
  content: '';
  position: absolute;
  top: 18px;
  left: 50%;
  width: 100%;
  height: 2px;
  background: rgba(255, 255, 255, 0.06);
  z-index: 0;
}

.stage-seg.completed:not(:last-child)::after {
  background: var(--seg-color, var(--purple));
  opacity: 0.5;
}

.stage-seg.current:not(:last-child)::after {
  background: rgba(255, 255, 255, 0.06);
}

.stage-dot {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.1);
  background: var(--bg-deep);
  position: relative;
  z-index: 1;
  transition: var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
}

.stage-seg.completed .stage-dot {
  background: var(--seg-color, var(--purple));
  border-color: var(--seg-color, var(--purple));
  box-shadow: 0 0 12px var(--seg-color, var(--purple));
}

.stage-seg.current .stage-dot {
  background: var(--seg-color, var(--purple));
  border-color: var(--seg-color, var(--purple));
  box-shadow: 0 0 18px var(--seg-color, var(--purple)), 0 0 36px var(--seg-color, var(--purple));
  animation: stagePulse 2s ease-in-out infinite;
}

.stage-seg.locked .stage-dot {
  cursor: not-allowed;
  opacity: 0.5;
}

@keyframes stagePulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}

.stage-seg:hover .stage-dot {
  transform: scale(1.25);
  border-color: var(--seg-color, var(--purple));
}

.stage-seg.locked:hover .stage-dot {
  transform: scale(1);
  border-color: rgba(255, 255, 255, 0.1);
}

.stage-dot-num {
  font-size: 12px;
  font-weight: 700;
  color: rgba(255, 255, 255, 0.4);
  position: relative;
  z-index: 2;
}

.stage-seg.current .stage-dot-num,
.stage-seg.completed .stage-dot-num {
  color: #fff;
}

.stage-zh {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 6px;
  text-align: center;
  line-height: 1.2;
  max-width: 64px;
  font-weight: 500;
  transition: color 0.3s;
}

.stage-seg.current .stage-zh {
  color: var(--text);
  font-weight: 600;
}

.stage-seg.completed .stage-zh {
  color: var(--text-dim);
}

/* ===== AI分析 + 前往学习 按钮 ===== */
.action-area {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-top: 32px;
}

.ai-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 40px;
  border-radius: 999px;
  border: none;
  background: linear-gradient(135deg, var(--purple), var(--blue));
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 4px 24px rgba(139, 92, 246, 0.2);
  letter-spacing: 0.04em;
}

.ai-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(139, 92, 246, 0.35);
}

.ai-btn:active { transform: scale(0.97); }

.learn-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 28px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  background: rgba(255, 255, 255, 0.04);
  color: var(--text-dim);
  font-size: 14px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.3s;
  letter-spacing: 0.04em;
  text-decoration: none;
}

.learn-btn:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.25);
  color: var(--text);
  transform: translateY(-1px);
}

/* ===== 核心产出卡片 ===== */
.output-card {
  max-width: 520px;
  margin: 32px auto 0;
  background: rgba(255, 255, 255, 0.025);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.06);
  overflow: hidden;
}

.output-header {
  display: flex;
  align-items: center;
  padding: 14px 22px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.04);
}

.output-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: 0.04em;
}

.output-body {
  padding: 18px 22px 0;
}

/* 拆分输入框 */
.output-field {
  margin-bottom: 16px;
}

.output-field-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-dim);
  margin-bottom: 6px;
  letter-spacing: 0.03em;
}

.output-field-input {
  width: 100%;
  padding: 12px 14px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  line-height: 1.6;
  outline: none;
  transition: border-color 0.2s, background 0.2s;
  resize: none;
}

.output-field-input:focus {
  border-color: rgba(139, 92, 246, 0.4);
  background: rgba(255, 255, 255, 0.05);
}

.output-field-input::placeholder {
  color: rgba(255, 255, 255, 0.2);
}

.output-field-input:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  background: rgba(255, 255, 255, 0.01);
}

/* 工具选择芯片 */
.output-tools-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.output-tool-chip {
  padding: 8px 16px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: rgba(255, 255, 255, 0.04);
  color: var(--text-dim);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
}

.output-tool-chip:hover {
  border-color: rgba(139, 92, 246, 0.4);
  color: var(--text);
  background: rgba(139, 92, 246, 0.08);
}

.output-tool-chip.active {
  background: rgba(139, 92, 246, 0.2);
  border-color: rgba(139, 92, 246, 0.5);
  color: var(--purple-light);
  box-shadow: 0 0 12px rgba(139, 92, 246, 0.15);
}

.output-tool-chip.disabled {
  opacity: 0.5;
  cursor: not-allowed;
  pointer-events: none;
}

/* 查看模式下的工具标签 */
.output-tools-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.output-tool-tag {
  padding: 4px 12px;
  border-radius: 999px;
  border: 1px solid rgba(139, 92, 246, 0.3);
  background: rgba(139, 92, 246, 0.1);
  color: var(--purple-light);
  font-size: 12px;
  font-weight: 500;
}

/* 查看模式 */
.output-field-view {
  font-size: 14px;
  line-height: 1.7;
  color: var(--text-dim);
  padding: 12px 14px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(255, 255, 255, 0.04);
  white-space: pre-wrap;
  min-height: 44px;
}

.output-placeholder-text {
  font-size: 13px;
  color: var(--text-muted);
  text-align: center;
  padding: 28px 16px;
  line-height: 1.8;
}

/* 保存 / 下一阶段 按钮 */
.output-footer {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 22px;
}

.output-btn {
  padding: 10px 32px;
  border-radius: 999px;
  border: none;
  font-size: 14px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.3s;
}

.output-btn-save {
  background: linear-gradient(135deg, var(--purple), var(--blue));
  color: #fff;
}

.output-btn-save:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(139, 92, 246, 0.3);
}

.output-btn-save.edit-mode {
  background: rgba(255, 255, 255, 0.06);
  color: var(--text);
  border: 1px solid rgba(255, 255, 255, 0.15);
}

.output-btn-next {
  background: rgba(255, 255, 255, 0.06);
  color: var(--text);
  border: 1px solid rgba(255, 255, 255, 0.15);
}

.output-btn-next:hover:not(:disabled) {
  background: rgba(139, 92, 246, 0.15);
  border-color: rgba(139, 92, 246, 0.4);
  transform: translateY(-1px);
}

.output-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
  transform: none !important;
}

/* ===== 底部删除 ===== */
.delete-area {
  text-align: center;
  margin-top: 48px;
  padding-bottom: 20px;
}

.delete-link {
  font-size: 13px;
  color: var(--text-muted);
  cursor: pointer;
  transition: color 0.2s;
  text-decoration: none;
  border-bottom: 1px dashed transparent;
  padding-bottom: 2px;
}

.delete-link:hover {
  color: #f87171;
  border-bottom-color: rgba(248, 113, 113, 0.4);
}

/* ===== 新灵感种子入口 ===== */
.new-idea-seed {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  cursor: pointer;
}

.seed-bubble {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 2px dashed rgba(139, 92, 246, 0.3);
  background: rgba(139, 92, 246, 0.04);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  color: rgba(139, 92, 246, 0.5);
  transition: var(--transition);
  animation: bubbleFloat 5s ease-in-out infinite;
}

.new-idea-seed:hover .seed-bubble {
  border-color: rgba(139, 92, 246, 0.6);
  background: rgba(139, 92, 246, 0.08);
  transform: scale(1.05);
  box-shadow: 0 0 40px rgba(139, 92, 246, 0.15);
}

.seed-text { font-size: 15px; font-weight: 500; color: var(--text-dim); }
.seed-hint { font-size: 12px; color: var(--text-muted); }

/* ===== 空状态 ===== */
.empty-state {
  text-align: center;
  padding: 60px 24px;
}

.empty-bubble-icon {
  width: 80px;
  height: 80px;
  margin: 0 auto 24px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.1), rgba(139, 92, 246, 0.08) 60%, transparent);
  border: 1px solid rgba(139, 92, 246, 0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  animation: bubbleFloat 4s ease-in-out infinite;
}

.empty-text { font-size: 18px; color: var(--text-dim); margin-bottom: 8px; font-weight: 500; }
.empty-hint { font-size: 14px; color: var(--text-muted); margin-bottom: 28px; }

.empty-record-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 36px;
  border-radius: 999px;
  border: none;
  background: linear-gradient(135deg, var(--purple), var(--blue));
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 4px 24px rgba(139, 92, 246, 0.25);
}

.empty-record-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(139, 92, 246, 0.4);
}

/* ===== 即将上线 ===== */
.coming-soon {
  text-align: center;
  padding: 100px 24px;
}

.coming-soon-icon {
  font-size: 48px;
  margin-bottom: 20px;
  opacity: 0.5;
  animation: bubbleFloat 4s ease-in-out infinite;
}

.coming-soon-text {
  font-size: 22px;
  font-weight: 700;
  background: linear-gradient(90deg, var(--purple), var(--blue));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}

.coming-soon-sub { font-size: 14px; color: var(--text-muted); }

/* ===== 记录灵感弹窗 ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 9998;
  display: none;
  align-items: center;
  justify-content: center;
  animation: overlayFade 0.2s ease;
}

.modal-overlay.show { display: flex; }

@keyframes overlayFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal {
  background: rgba(15, 15, 28, 0.95);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 20px;
  padding: 32px 28px 28px;
  max-width: 440px;
  width: 90%;
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
  animation: modalSlide 0.3s ease;
  position: relative;
}

@keyframes modalSlide {
  from { opacity: 0; transform: scale(0.95) translateY(10px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-close {
  position: absolute;
  top: 14px;
  right: 18px;
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 22px;
  cursor: pointer;
  padding: 4px 8px;
  transition: color 0.2s;
  line-height: 1;
}

.modal-close:hover { color: var(--text); }

.modal h2 {
  font-size: 20px;
  text-align: center;
  margin-bottom: 24px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--purple-light), var(--blue));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.inspire-input-wrap { display: flex; flex-direction: column; gap: 16px; }

.inspire-input {
  width: 100%;
  padding: 14px 16px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: var(--text);
  font-size: 15px;
  font-weight: 500;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
  line-height: 1.6;
  resize: none;
}

.inspire-textarea { min-height: 68px; }

.inspire-input:focus {
  border-color: var(--purple);
  background: rgba(255, 255, 255, 0.08);
}

.inspire-input::placeholder { color: rgba(255, 255, 255, 0.25); }

.inspire-tags-section { display: flex; flex-direction: column; gap: 10px; }

.inspire-tags-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 0.08em;
}

.inspire-tags-select { display: flex; flex-wrap: wrap; gap: 8px; }

.inspire-tag-chip {
  padding: 6px 14px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(255, 255, 255, 0.04);
  color: var(--text-dim);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
}

.inspire-tag-chip:hover { border-color: rgba(139, 92, 246, 0.4); color: var(--text); }

.inspire-tag-chip.active {
  background: rgba(139, 92, 246, 0.2);
  border-color: rgba(139, 92, 246, 0.5);
  color: var(--purple-light);
}

.inspire-submit-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 13px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(135deg, var(--purple), var(--blue));
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.3s;
}

.inspire-submit-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(139, 92, 246, 0.3);
}

.inspire-submit-btn:active { transform: scale(0.97); }
.inspire-submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* ===== Toast ===== */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  padding: 12px 24px;
  border-radius: 999px;
  background: rgba(15, 15, 28, 0.95);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: var(--text);
  font-size: 14px;
  font-weight: 500;
  z-index: 10000;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  animation: toastIn 0.3s ease, toastOut 0.3s ease 2.5s forwards;
}

@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(10px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

@keyframes toastOut {
  to { opacity: 0; transform: translateX(-50%) translateY(10px); }
}

/* ===== 骨架屏 ===== */
.skeleton-bubble-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  padding: 40px 0;
}

.skeleton-circle-lg {
  width: 240px;
  height: 240px;
  border-radius: 50%;
  background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0.03) 75%);
  background-size: 200% 100%;
  animation: skeleton 1.5s infinite;
}

.skeleton-line-sm {
  width: 120px;
  height: 14px;
  border-radius: 7px;
  background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0.03) 75%);
  background-size: 200% 100%;
  animation: skeleton 1.5s infinite;
}

@keyframes skeleton {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ===== 响应式 ===== */
@media (max-width: 640px) {
  .space-container { padding: 28px 16px 100px; }
  .space-title { font-size: clamp(48px, 12vw, 80px); }
  .tabs { gap: 4px; }
  .tab { padding: 8px 16px; font-size: 13px; }
  .bubble-stage { gap: 8px; min-height: 340px; }
  .nav-arrow { width: 36px; height: 36px; font-size: 14px; }
  .center-bubble {
    width: calc(var(--bubble-size, 360px) * 0.75) !important;
    height: calc(var(--bubble-size, 360px) * 0.75) !important;
  }
  .stage-zh { font-size: 10px; max-width: 48px; }
  .stage-dot { width: 30px; height: 30px; }
  .stage-dot-num { font-size: 11px; }
  .action-area { flex-direction: column; gap: 8px; }
  .ai-btn, .learn-btn { width: 100%; justify-content: center; }
  .output-card { margin: 24px 0 0; }
  .output-footer { flex-direction: column; }
  .output-btn { width: 100%; text-align: center; }
}

/* ===== 滚动条 ===== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
</style>
</head>
<body>
<div id="vb-nav-mount"></div>

<div class="space-container">
  <header class="space-header">
    <h1 class="space-title">Creative Space</h1>
    <p class="space-welcome">Welcome back, <span class="welcome-name" id="userNickname">...</span>, your creative journey starts here.</p>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="ideas">我的灵感</button>
    <button class="tab" data-tab="projects">发布的项目</button>
    <button class="tab" data-tab="activity">我的互动</button>
  </div>

  <div class="tab-content">
    <div id="ideasTab" class="tab-panel active">
      <div id="ideasContent"></div>
    </div>
    <div id="projectsTab" class="tab-panel">
      <div class="coming-soon">
        <div class="coming-soon-icon">&#x1F680;</div>
        <div class="coming-soon-text">即将上线</div>
        <div class="coming-soon-sub">项目管理功能正在开发中，敬请期待</div>
      </div>
    </div>
    <div id="activityTab" class="tab-panel">
      <div class="coming-soon">
        <div class="coming-soon-icon">&#x1F4AC;</div>
        <div class="coming-soon-text">即将上线</div>
        <div class="coming-soon-sub">互动动态功能正在开发中，敬请期待</div>
      </div>
    </div>
  </div>
</div>

<!-- 记录灵感弹窗 -->
<div class="modal-overlay" id="submitModal">
  <div class="modal">
    <button class="modal-close" onclick="closeSpaceRecord()">&times;</button>
    <h2>记录你的灵感火花</h2>
    <div class="inspire-input-wrap">
      <textarea id="inspireInput" class="inspire-input inspire-textarea" placeholder="此刻你的脑海浮现了什么产品灵感？" rows="2"></textarea>
      <div class="inspire-tags-section">
        <div class="inspire-tags-label">Tags</div>
        <div class="inspire-tags-select" id="inspireTagsSelect"></div>
      </div>
      <button class="inspire-submit-btn" id="inspireSubmitBtn" onclick="handleSpaceRecordSubmit()">
        <span>记录灵感</span>
      </button>
    </div>
  </div>
</div>

<script>
// ==================== 8 阶段定义（与 learning 对应）====================
var STAGES = [
  { num: '01', en: 'Basic Cognition', zh: '基础认知', status: 'basic_cognition', color: '#6366f1' },
  { num: '02', en: 'Explore Ideas',    zh: '探索灵感', status: 'explore_ideas',    color: '#8b5cf6' },
  { num: '03', en: 'Discover Needs',   zh: '需求分析', status: 'discover_needs',   color: '#ec4899' },
  { num: '04', en: 'Define Product',   zh: '产品定位', status: 'define_product',   color: '#3b82f6' },
  { num: '05', en: 'Design Product',   zh: '产品设计', status: 'design_product',   color: '#06b6d4' },
  { num: '06', en: 'Build Product',    zh: '产品构建', status: 'build_product',    color: '#f59e0b' },
  { num: '07', en: 'Launch Product',   zh: '发布运营', status: 'launch_product',   color: '#10b981' },
  { num: '08', en: 'Grow Users',       zh: '用户增长', status: 'grow_users',       color: '#ef4444' }
];

// 阶段视觉映射（气泡大小/光晕/透明度/字体/行数）
var STAGE_VISUAL = {
  basic_cognition: { size: 140, glow: 20, opacity: 0.50, fontSize: 11, lineClamp: 3 },
  explore_ideas:   { size: 160, glow: 24, opacity: 0.55, fontSize: 12, lineClamp: 3 },
  discover_needs:  { size: 185, glow: 30, opacity: 0.62, fontSize: 13, lineClamp: 4 },
  define_product:  { size: 210, glow: 38, opacity: 0.70, fontSize: 14, lineClamp: 4 },
  design_product:  { size: 240, glow: 46, opacity: 0.78, fontSize: 15, lineClamp: 5 },
  build_product:   { size: 270, glow: 56, opacity: 0.85, fontSize: 16, lineClamp: 5 },
  launch_product:  { size: 310, glow: 68, opacity: 0.92, fontSize: 18, lineClamp: 6 },
  grow_users:      { size: 360, glow: 90, opacity: 1.0,  fontSize: 20, lineClamp: 6 }
};

// 核心产出模板（每个阶段一组字段，每个字段 { label, placeholder }）
var OUTPUT_TEMPLATES = {
  basic_cognition: [
    { type: 'tools', label: '选择AI工具', options: ['Codex', 'Trae', 'WorkBuddy', 'Cursor', 'Windsurf', 'Bolt', 'v0', 'Lovable', 'Replit', 'GitHub Copilot', 'Claude Code', 'Gemini Code Assist'] },
    { label: '工具能力边界', placeholder: '这些工具擅长什么？不擅长什么？' },
    { label: '使用场景匹配', placeholder: '你的产品场景适合用哪些工具？为什么？' }
  ],
  explore_ideas: [
    { label: '灵感来源', placeholder: '这个想法从哪里来？看到了什么？' },
    { label: '核心问题', placeholder: '它试图解决什么问题？' },
    { label: '初步构思', placeholder: '你脑海中的产品是什么样的？' }
  ],
  discover_needs: [
    { label: '目标用户', placeholder: '谁会使用这个产品？' },
    { label: '用户痛点', placeholder: '他们现在遇到了什么问题？' },
    { label: '使用场景', placeholder: '用户在什么场景下使用？' },
    { label: '竞品参考', placeholder: '有没有类似的产品可以参考？' }
  ],
  define_product: [
    { label: '产品名称', placeholder: '给你的产品起个名字' },
    { label: '目标用户', placeholder: '面向哪些用户群体？' },
    { label: '核心价值', placeholder: '一句话说清楚这个产品的核心价值' },
    { label: 'MVP功能', placeholder: '第一个版本需要包含哪些功能？' }
  ],
  design_product: [
    { label: '用户流程', placeholder: '描述用户使用产品的主要流程' },
    { label: '设计方案', placeholder: '产品界面和交互的设计思路' },
    { label: '参考链接', placeholder: '设计参考链接（Figma、Dribbble等）' }
  ],
  build_product: [
    { label: '技术方案', placeholder: '使用什么技术栈？为什么？' },
    { label: 'Demo链接', placeholder: '产品Demo或预览链接' },
    { label: '代码仓库', placeholder: 'GitHub 或其他代码仓库链接' }
  ],
  launch_product: [
    { label: '产品链接', placeholder: '产品正式访问链接' },
    { label: '发布渠道', placeholder: '在哪些平台发布？Product Hunt、小红书...' },
    { label: '用户反馈', placeholder: '收集到的用户反馈摘要' }
  ],
  grow_users: [
    { label: '增长策略', placeholder: '你计划如何获取更多用户？' },
    { label: '关键指标', placeholder: '关注哪些数据指标？' },
    { label: '优化方向', placeholder: '下一步优化计划是什么？' }
  ]
};

var FALLBACK_TAGS = ['AI应用', '工具脚本', 'Web应用', '设计工具', '小游戏', '教育学习'];

// ==================== 状态 ====================
var ideasList = [];
var currentIdeaIndex = 0;
var selectedIdeaTags = [];
var isEditingOutput = false;
var currentOutputData = null;
var isSavingOutput = false;
var hasSavedOutput = false; // 当前阶段是否已保存产出
var viewingStageStatus = null; // 正在查看的历史阶段（null = 当前阶段）

// ==================== 工具函数 ====================

function getStageIndex(status) {
  for (var i = 0; i < STAGES.length; i++) {
    if (STAGES[i].status === status) return i;
  }
  return 0;
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function showToast(msg) {
  var existing = document.querySelector('.toast');
  if (existing) existing.remove();
  var toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(function() { toast.remove(); }, 3000);
}

// ==================== 页面初始化 ====================

async function init() {
  var attempts = 0;
  while (typeof authReady === 'undefined' || !authReady) {
    if (attempts >= 50) break;
    await new Promise(function(r) { setTimeout(r, 100); });
    attempts++;
  }

  var user = (typeof window.currentUser === 'function') ? window.currentUser() : (typeof currentUser !== 'undefined' ? currentUser : null);
  if (!user) { window.location.href = './gallery.html'; return; }

  var nickEl = document.getElementById('userNickname');
  if (nickEl) { nickEl.textContent = user.nickname || (user.email ? user.email.split('@')[0] : 'Creator'); }

  bindTabs();
  await loadIdeas();
}

function bindTabs() {
  document.querySelectorAll('.tab').forEach(function(tab) {
    tab.addEventListener('click', function() { switchTab(tab.dataset.tab); });
  });
}

function switchTab(target) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.toggle('active', t.dataset.tab === target); });
  document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.toggle('active', p.id === target + 'Tab'); });
}

// ==================== 加载灵感列表 ====================

async function loadIdeas(growInIndex) {
  var container = document.getElementById('ideasContent');
  if (!container) return;

  var user = (typeof window.currentUser === 'function') ? window.currentUser() : (typeof currentUser !== 'undefined' ? currentUser : null);
  if (!user) return;

  container.innerHTML = renderSkeleton();

  try {
    ideasList = await getUserIdeas(user.id);

    if (!ideasList || ideasList.length === 0) {
      currentIdeaIndex = -1;
      container.innerHTML = renderEmptyState();
      bindEmptyStateEvents();
      return;
    }

    if (typeof growInIndex === 'number') {
      currentIdeaIndex = growInIndex;
    } else if (currentIdeaIndex >= ideasList.length) {
      currentIdeaIndex = 0;
    }

    renderIdeaStage(container, typeof growInIndex === 'number');
    await loadOutputForCurrentIdea();
  } catch (e) {
    console.error('[Space] Load ideas error:', e);
    container.innerHTML = renderEmptyState();
    bindEmptyStateEvents();
  }
}

function renderSkeleton() {
  return '<div class="skeleton-bubble-area"><div class="skeleton-circle-lg"></div><div class="skeleton-line-sm"></div></div>';
}

function renderEmptyState() {
  return '<div class="empty-state">' +
    '<div class="empty-bubble-icon">&#x1F4AD;</div>' +
    '<div class="empty-text">还没有记录任何灵感</div>' +
    '<div class="empty-hint">开始你的创意之旅吧</div>' +
    '<button class="empty-record-btn" id="emptyRecordBtn">记录灵感</button></div>';
}

function bindEmptyStateEvents() {
  var btn = document.getElementById('emptyRecordBtn');
  if (btn) btn.addEventListener('click', function() { openSpaceRecord(); });
}

// ==================== 渲染气泡舞台 ====================

function renderIdeaStage(container, growIn) {
  var isNewIdeaEntry = (currentIdeaIndex === -1 || currentIdeaIndex >= ideasList.length);

  if (isNewIdeaEntry) {
    container.innerHTML = renderNewIdeaSeed();
    bindSeedEvents();
    return;
  }

  var idea = ideasList[currentIdeaIndex];
  var stageIdx = getStageIndex(idea.status);
  var stage = STAGES[stageIdx];
  var visual = STAGE_VISUAL[stage.status] || STAGE_VISUAL.basic_cognition;
  var isMature = stageIdx >= 6;
  var growClass = growIn ? ' grow-in' : '';

  var html = '';

  // 气泡舞台
  html += '<div class="bubble-stage">' +
    '<button class="nav-arrow nav-prev' + (currentIdeaIndex === 0 ? ' disabled' : '') + '" id="navPrev">&#x2039;</button>' +
    '<div class="bubble-center">' +
      '<div class="center-bubble' + (isMature ? ' iridescent' : '') + growClass + '" id="centerBubble"' +
        ' style="--bubble-size:' + visual.size + 'px;--bubble-glow:' + visual.glow + 'px;' +
        '--bubble-opacity:' + visual.opacity + ';--bubble-font-size:' + visual.fontSize + 'px;' +
        '--bubble-line-clamp:' + visual.lineClamp + ';">' +
        '<span class="bubble-title-inner">' + escapeHtml(idea.title) + '</span>' +
      '</div>' +
    '</div>' +
    '<button class="nav-arrow nav-next" id="navNext">&#x203A;</button>' +
  '</div>';

  // 8 节点产品阶段
  html += '<div class="stage-bar-wrap"><div class="stage-bar" id="stageBar">';
  for (var i = 0; i < STAGES.length; i++) {
    var s = STAGES[i];
    var segClass = 'stage-seg';
    if (i < stageIdx) segClass += ' completed';
    if (i === stageIdx) segClass += ' current';
    // 未完成的节点（非当前、非已完成）标记为锁定
    if (i > stageIdx) segClass += ' locked';
    html += '<div class="' + segClass + '" data-stage-idx="' + i + '" data-stage-status="' + s.status + '"' +
      ' style="--seg-color:' + s.color + ';">' +
      '<div class="stage-dot"><span class="stage-dot-num">' + s.num + '</span></div>' +
      '<div class="stage-zh">' + s.zh + '</div>' +
    '</div>';
  }
  html += '</div></div>';

  // AI分析 + 前往学习 按钮
  html += '<div class="action-area">';
  html += '<button class="ai-btn" id="aiAnalysisBtn">&#x2728; AI 分析</button>';
  html += '<a class="learn-btn" id="learnBtn" href="./learning.html" target="_blank">&#x1F4DA; 前往学习</a>';
  html += '</div>';

  // 核心产出
  html += '<div class="output-card" id="outputCard">' +
    '<div class="output-header">' +
      '<span class="output-title" id="outputTitle">' + stage.num + ' ' + stage.zh + ' - 核心产出</span>' +
    '</div>' +
    '<div class="output-body" id="outputBody">' +
      '<div class="output-placeholder-text">加载中...</div>' +
    '</div>' +
    '<div class="output-footer" id="outputFooter" style="display:none;">' +
      '<button class="output-btn output-btn-save" id="outputSaveBtn">保存</button>' +
      '<button class="output-btn output-btn-next" id="outputNextBtn" disabled>下一阶段</button>' +
    '</div>' +
  '</div>';

  // 底部删除
  html += '<div class="delete-area"><span class="delete-link" id="deleteIdeaBtn">删除这个灵感</span></div>';

  container.innerHTML = html;

  bindBubbleStageEvents();
}

function renderNewIdeaSeed() {
  return '<div class="bubble-stage">' +
    '<button class="nav-arrow nav-prev" id="navPrev">&#x2039;</button>' +
    '<div class="bubble-center">' +
      '<div class="new-idea-seed" id="newIdeaSeed">' +
        '<div class="seed-bubble">+</div>' +
        '<div class="seed-text">记录新灵感</div>' +
        '<div class="seed-hint">点击创建一个新的灵感气泡</div>' +
      '</div>' +
    '</div>' +
    '<button class="nav-arrow nav-next disabled">&#x203A;</button>' +
  '</div>';
}

function bindSeedEvents() {
  var seed = document.getElementById('newIdeaSeed');
  if (seed) seed.addEventListener('click', function() { openSpaceRecord(); });
  var prevBtn = document.getElementById('navPrev');
  if (prevBtn) prevBtn.addEventListener('click', function() {
    currentIdeaIndex = ideasList.length - 1;
    var container = document.getElementById('ideasContent');
    renderIdeaStage(container);
    loadOutputForCurrentIdea();
  });
}

// ==================== 绑定气泡舞台事件 ====================

function bindBubbleStageEvents() {
  // 上一个灵感
  var prevBtn = document.getElementById('navPrev');
  if (prevBtn && !prevBtn.classList.contains('disabled')) {
    prevBtn.addEventListener('click', function() {
      if (currentIdeaIndex === -1 || currentIdeaIndex >= ideasList.length) {
        currentIdeaIndex = ideasList.length - 1;
      } else {
        currentIdeaIndex = Math.max(0, currentIdeaIndex - 1);
      }
      var container = document.getElementById('ideasContent');
      renderIdeaStage(container);
      loadOutputForCurrentIdea();
    });
  }

  // 下一个灵感
  var nextBtn = document.getElementById('navNext');
  if (nextBtn && !nextBtn.classList.contains('disabled')) {
    nextBtn.addEventListener('click', function() {
      if (currentIdeaIndex < ideasList.length - 1) {
        currentIdeaIndex++;
        var container = document.getElementById('ideasContent');
        renderIdeaStage(container);
        loadOutputForCurrentIdea();
      } else {
        currentIdeaIndex = -1;
        var container = document.getElementById('ideasContent');
        renderIdeaStage(container);
      }
    });
  }

  // 阶段节点点击
  var stageBar = document.getElementById('stageBar');
  if (stageBar) {
    stageBar.querySelectorAll('.stage-seg').forEach(function(seg) {
      seg.addEventListener('click', function(e) {
        e.stopPropagation();
        var targetIdx = parseInt(seg.dataset.stageIdx);
        var targetStatus = seg.dataset.stageStatus;
        handleStageClick(targetIdx, targetStatus);
      });
    });
  }

  // AI分析
  var aiBtn = document.getElementById('aiAnalysisBtn');
  if (aiBtn) {
    aiBtn.addEventListener('click', function() {
      showToast('AI 分析功能即将上线');
      // 自动进入编辑模式
      if (!isEditingOutput) enterEditMode();
    });
  }

  // 前往学习
  var learnBtn = document.getElementById('learnBtn');
  if (learnBtn) {
    learnBtn.addEventListener('click', function(e) {
      // 允许跳转（新标签页打开，不阻止默认行为）
    });
  }

  // 删除
  var deleteBtn = document.getElementById('deleteIdeaBtn');
  if (deleteBtn) {
    deleteBtn.addEventListener('click', function() { handleDeleteIdea(); });
  }

  // 气泡点击 → 编辑核心产出
  var bubble = document.getElementById('centerBubble');
  if (bubble) {
    bubble.addEventListener('click', function() {
      if (!isEditingOutput) enterEditMode();
    });
  }
}

// ==================== 阶段节点点击逻辑 ====================

function handleStageClick(targetIdx, targetStatus) {
  if (currentIdeaIndex < 0 || currentIdeaIndex >= ideasList.length) return;

  var idea = ideasList[currentIdeaIndex];
  var currentStageIdx = getStageIndex(idea.status);

  // 点击已完成节点 → 查看该阶段产出（不改变当前阶段）
  if (targetIdx < currentStageIdx) {
    viewStageOutput(targetStatus);
    return;
  }

  // 点击当前节点 → 切换编辑/查看模式
  if (targetIdx === currentStageIdx) {
    if (viewingStageStatus) {
      // 正在查看历史阶段，返回当前阶段
      viewingStageStatus = null;
      loadOutputForCurrentIdea();
    } else if (hasSavedOutput && !isEditingOutput) {
      enterEditMode();
    } else if (!isEditingOutput) {
      enterEditMode();
    }
    return;
  }

  // 点击未完成节点 → 需要先保存当前阶段产出
  if (!hasSavedOutput) {
    showToast('先填写当前阶段核心产出');
    return;
  }

  // 只能推进到下一步（不能跳跃）
  if (targetIdx !== currentStageIdx + 1) {
    showToast('先填写当前阶段核心产出');
    return;
  }

  // 推进阶段
  handleStageSwitch(targetStatus);
}

// ==================== 阶段切换 ====================

async function handleStageSwitch(newStatus) {
  if (currentIdeaIndex < 0 || currentIdeaIndex >= ideasList.length) return;

  var idea = ideasList[currentIdeaIndex];
  if (idea.status === newStatus) return;

  if (typeof updateIdeaStatus !== 'function') return;

  var result = await updateIdeaStatus(idea.id, newStatus);
  if (result.success) {
    idea.status = newStatus;
    hasSavedOutput = false;
    isEditingOutput = false;
    viewingStageStatus = null;
    currentOutputData = null;
    var container = document.getElementById('ideasContent');
    renderIdeaStage(container);
    await loadOutputForCurrentIdea();
  } else {
    showToast('阶段切换失败');
  }
}

// ==================== 查看已完成阶段产出 ====================

async function viewStageOutput(stageStatus) {
  if (currentIdeaIndex < 0 || currentIdeaIndex >= ideasList.length) return;

  var idea = ideasList[currentIdeaIndex];
  viewingStageStatus = stageStatus;

  if (typeof getIdeaOutput !== 'function') return;

  var outputData = await getIdeaOutput(idea.id, stageStatus);
  var outputBody = document.getElementById('outputBody');
  var outputFooter = document.getElementById('outputFooter');
  var outputTitle = document.getElementById('outputTitle');

  if (!outputBody) return;

  // 更新卡片标题
  var stageIdx = getStageIndex(stageStatus);
  var stage = STAGES[stageIdx];
  if (outputTitle) {
    outputTitle.textContent = stage.num + ' ' + stage.zh + ' - 核心产出（查看）';
  }

  // 显示查看模式
  if (outputData && outputData.content) {
    renderOutputView(outputData.content, stageStatus);
  } else {
    outputBody.innerHTML = '<div class="output-placeholder-text">产出数据加载失败，请刷新重试</div>';
  }

  // 隐藏保存/下一步按钮，显示返回按钮
  if (outputFooter) {
    outputFooter.style.display = 'flex';
    outputFooter.innerHTML = '<button class="output-btn output-btn-save edit-mode" id="outputBackBtn">返回当前阶段</button>';
    var backBtn = document.getElementById('outputBackBtn');
    if (backBtn) {
      backBtn.addEventListener('click', function() {
        viewingStageStatus = null;
        loadOutputForCurrentIdea();
      });
    }
  }
}

// ==================== 核心产出加载 ====================

async function loadOutputForCurrentIdea() {
  if (currentIdeaIndex < 0 || currentIdeaIndex >= ideasList.length) return;

  viewingStageStatus = null;

  var idea = ideasList[currentIdeaIndex];
  var stageIdx = getStageIndex(idea.status);
  var stage = STAGES[stageIdx];
  var outputBody = document.getElementById('outputBody');
  var outputFooter = document.getElementById('outputFooter');
  var outputTitle = document.getElementById('outputTitle');
  if (!outputBody) return;

  // 恢复卡片标题
  if (outputTitle) {
    outputTitle.textContent = stage.num + ' ' + stage.zh + ' - 核心产出';
  }

  if (typeof getIdeaOutput !== 'function') return;

  currentOutputData = await getIdeaOutput(idea.id, stage.status);
  isEditingOutput = false;

  if (currentOutputData && currentOutputData.content) {
    hasSavedOutput = true;
    renderOutputView(currentOutputData.content);
  } else {
    hasSavedOutput = false;
    isEditingOutput = true;
    renderOutputEditor();
  }

  updateFooterButtons();
}

// ==================== 渲染核心产出编辑模式 ====================

function renderOutputEditor() {
  var outputBody = document.getElementById('outputBody');
  var outputFooter = document.getElementById('outputFooter');
  if (!outputBody) return;

  var idea = ideasList[currentIdeaIndex];
  var stageIdx = getStageIndex(idea.status);
  var stage = STAGES[stageIdx];
  var fields = OUTPUT_TEMPLATES[stage.status] || [];

  var html = '';
  var savedContent = null;
  if (currentOutputData && currentOutputData.content) {
    try {
      savedContent = JSON.parse(currentOutputData.content);
    } catch (e) {
      savedContent = null;
    }
  }

  for (var i = 0; i < fields.length; i++) {
    var field = fields[i];
    if (field.type === 'tools') {
      // 工具选择芯片
      var selectedTools = [];
      if (savedContent && savedContent[i]) {
        try { selectedTools = JSON.parse(savedContent[i]); } catch (e) { selectedTools = []; }
      }
      html += '<div class="output-field">' +
        '<div class="output-field-label">' + field.label + '</div>' +
        '<div class="output-tools-grid" data-field-idx="' + i + '">';
      for (var t = 0; t < field.options.length; t++) {
        var toolName = field.options[t];
        var isActive = selectedTools.indexOf(toolName) > -1;
        html += '<span class="output-tool-chip' + (isActive ? ' active' : '') + '" data-tool="' + escapeHtml(toolName) + '">' + escapeHtml(toolName) + '</span>';
      }
      html += '</div></div>';
    } else {
      var val = (savedContent && savedContent[i]) ? savedContent[i] : '';
      html += '<div class="output-field">' +
        '<div class="output-field-label">' + field.label + '</div>' +
        '<textarea class="output-field-input" data-field-idx="' + i + '" placeholder="' + escapeHtml(field.placeholder) + '" rows="2">' + escapeHtml(val) + '</textarea>' +
      '</div>';
    }
  }

  outputBody.innerHTML = html;
  if (outputFooter) outputFooter.style.display = 'flex';

  // 绑定工具芯片点击事件
  outputBody.querySelectorAll('.output-tool-chip').forEach(function(chip) {
    chip.addEventListener('click', function() {
      chip.classList.toggle('active');
    });
  });

  updateFooterButtons();
}

// ==================== 渲染核心产出查看模式 ====================

function renderOutputView(contentJson, optStageStatus) {
  var outputBody = document.getElementById('outputBody');
  var outputFooter = document.getElementById('outputFooter');
  if (!outputBody) return;

  var idea = ideasList[currentIdeaIndex];
  var stageStatus = optStageStatus || idea.status;
  var stageIdx = getStageIndex(stageStatus);
  var stage = STAGES[stageIdx];
  var fields = OUTPUT_TEMPLATES[stageStatus] || [];

  var savedContent = null;
  try {
    savedContent = JSON.parse(contentJson);
  } catch (e) {
    savedContent = null;
  }

  var html = '';
  for (var i = 0; i < fields.length; i++) {
    var field = fields[i];
    if (field.type === 'tools') {
      // 工具标签展示
      var selectedTools = [];
      if (savedContent && savedContent[i]) {
        try { selectedTools = JSON.parse(savedContent[i]); } catch (e) { selectedTools = []; }
      }
      html += '<div class="output-field">' +
        '<div class="output-field-label">' + field.label + '</div>';
      if (selectedTools.length > 0) {
        html += '<div class="output-tools-tags">';
        for (var t = 0; t < selectedTools.length; t++) {
          html += '<span class="output-tool-tag">' + escapeHtml(selectedTools[t]) + '</span>';
        }
        html += '</div>';
      } else {
        html += '<div class="output-field-view"><span style="color:var(--text-muted);font-style:italic;">未选择</span></div>';
      }
      html += '</div>';
    } else {
      var val = (savedContent && savedContent[i]) ? savedContent[i] : '';
      html += '<div class="output-field">' +
        '<div class="output-field-label">' + field.label + '</div>' +
        '<div class="output-field-view">' + (val ? escapeHtml(val) : '<span style="color:var(--text-muted);font-style:italic;">未填写</span>') + '</div>' +
      '</div>';
    }
  }

  outputBody.innerHTML = html;
  if (outputFooter) outputFooter.style.display = 'flex';

  updateFooterButtons();
}

// ==================== 底部按钮 ====================

function updateFooterButtons() {
  var saveBtn = document.getElementById('outputSaveBtn');
  var nextBtn = document.getElementById('outputNextBtn');

  if (saveBtn) {
    if (isEditingOutput) {
      saveBtn.textContent = '保存';
      saveBtn.className = 'output-btn output-btn-save';
      saveBtn.disabled = false;
    } else {
      saveBtn.textContent = '编辑';
      saveBtn.className = 'output-btn output-btn-save edit-mode';
      saveBtn.disabled = false;
    }
    // 移除旧事件，重新绑定
    var newSaveBtn = saveBtn.cloneNode(true);
    saveBtn.parentNode.replaceChild(newSaveBtn, saveBtn);
    newSaveBtn.addEventListener('click', function() {
      if (isEditingOutput) {
        handleSaveOutput();
      } else {
        enterEditMode();
      }
    });
  }

  if (nextBtn) {
    if (hasSavedOutput && !isEditingOutput) {
      nextBtn.disabled = false;
    } else {
      nextBtn.disabled = true;
    }
    var newNextBtn = nextBtn.cloneNode(true);
    nextBtn.parentNode.replaceChild(newNextBtn, nextBtn);
    newNextBtn.addEventListener('click', function() {
      if (hasSavedOutput && !isEditingOutput) {
        handleNextStage();
      }
    });
  }
}

function enterEditMode() {
  if (currentIdeaIndex < 0 || currentIdeaIndex >= ideasList.length) return;
  if (viewingStageStatus) return; // 正在查看历史阶段，不允许编辑
  isEditingOutput = true;
  renderOutputEditor();
  updateFooterButtons();
}

// ==================== 保存核心产出 ====================

async function handleSaveOutput() {
  if (isSavingOutput) return;
  if (currentIdeaIndex < 0 || currentIdeaIndex >= ideasList.length) return;

  var idea = ideasList[currentIdeaIndex];
  var stageIdx = getStageIndex(idea.status);
  var stage = STAGES[stageIdx];

  // 收集所有字段值
  var fields = OUTPUT_TEMPLATES[stage.status] || [];
  var values = [];
  var allEmpty = true;

  for (var i = 0; i < fields.length; i++) {
    var field = fields[i];
    if (field.type === 'tools') {
      // 收集选中的工具芯片
      var grid = document.querySelector('.output-tools-grid[data-field-idx="' + i + '"]');
      var selected = [];
      if (grid) {
        grid.querySelectorAll('.output-tool-chip.active').forEach(function(chip) {
          selected.push(chip.dataset.tool);
        });
      }
      values.push(JSON.stringify(selected));
      if (selected.length > 0) allEmpty = false;
    } else {
      var input = document.querySelector('.output-field-input[data-field-idx="' + i + '"]');
      var val = input ? input.value.trim() : '';
      values.push(val);
      if (val) allEmpty = false;
    }
  }

  if (allEmpty) {
    showToast('请至少填写一项内容');
    return;
  }

  var content = JSON.stringify(values);
  var saveBtn = document.querySelector('#outputSaveBtn');
  if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = '保存中...'; }
  isSavingOutput = true;

  var result = await saveIdeaOutput(idea.id, stage.status, content, stage.status);

  isSavingOutput = false;

  if (result && result.success) {
    currentOutputData = result.data;
    hasSavedOutput = true;
    isEditingOutput = false;
    renderOutputView(content);

    // 气泡微亮动画
    var bubble = document.getElementById('centerBubble');
    if (bubble) {
      bubble.classList.add('subtle-glow');
      setTimeout(function() { bubble.classList.remove('subtle-glow'); }, 1200);
    }

    updateFooterButtons();
    showToast('核心产出已保存');

    // 重新加载列表（updated_at 变了）
    setTimeout(function() { loadIdeas(); }, 500);
  } else {
    showToast('保存失败: ' + (result && result.error ? result.error : '未知错误'));
    updateFooterButtons();
  }
}

// ==================== 下一阶段 ====================

async function handleNextStage() {
  if (currentIdeaIndex < 0 || currentIdeaIndex >= ideasList.length) return;

  var idea = ideasList[currentIdeaIndex];
  var stageIdx = getStageIndex(idea.status);
  if (stageIdx >= STAGES.length - 1) {
    showToast('已经是最后一个阶段');
    return;
  }

  var nextStatus = STAGES[stageIdx + 1].status;
  await handleStageSwitch(nextStatus);
}

// ==================== 删除灵感 ====================

async function handleDeleteIdea() {
  if (currentIdeaIndex < 0 || currentIdeaIndex >= ideasList.length) return;

  var idea = ideasList[currentIdeaIndex];
  if (!confirm('确定要删除这个灵感吗？删除后不可恢复。')) return;

  var result = await deleteIdea(idea.id);
  if (result.success) {
    currentIdeaIndex = 0;
    await loadIdeas();
  } else {
    showToast(result.error || '删除失败');
  }
}

// ==================== Space 内记录灵感弹窗 ====================

function openSpaceRecord() {
  var modal = document.getElementById('submitModal');
  if (!modal) return;
  modal.classList.add('show');
  selectedIdeaTags = [];
  renderSpaceTags();
  setTimeout(function() {
    var input = document.getElementById('inspireInput');
    if (input) input.focus();
  }, 300);
}

function closeSpaceRecord() {
  var modal = document.getElementById('submitModal');
  if (modal) modal.classList.remove('show');
  var input = document.getElementById('inspireInput');
  if (input) input.value = '';
  selectedIdeaTags = [];
}

function renderSpaceTags() {
  var container = document.getElementById('inspireTagsSelect');
  if (!container) return;
  var tags = (typeof allTags !== 'undefined' && allTags.length > 0) ? allTags.slice(0, 12) : FALLBACK_TAGS;
  container.innerHTML = tags.map(function(t) {
    return '<span class="inspire-tag-chip" data-tag="' + escapeHtml(t) + '">' + escapeHtml(t) + '</span>';
  }).join('');
  container.querySelectorAll('.inspire-tag-chip').forEach(function(chip) {
    chip.addEventListener('click', function() {
      var tag = chip.dataset.tag;
      var idx = selectedIdeaTags.indexOf(tag);
      if (idx > -1) { selectedIdeaTags.splice(idx, 1); chip.classList.remove('active'); }
      else { selectedIdeaTags.push(tag); chip.classList.add('active'); }
    });
  });
}

async function handleSpaceRecordSubmit() {
  var input = document.getElementById('inspireInput');
  if (!input) return;
  var text = input.value.trim();
  if (!text) {
    input.style.borderColor = 'rgba(239,68,68,0.5)';
    input.focus();
    setTimeout(function() { input.style.borderColor = ''; }, 1500);
    return;
  }

  var user = (typeof window.currentUser === 'function') ? window.currentUser() : (typeof currentUser !== 'undefined' ? currentUser : null);
  if (!user) { closeSpaceRecord(); if (typeof showAuthModal === 'function') showAuthModal('login'); return; }

  var submitBtn = document.getElementById('inspireSubmitBtn');
  if (submitBtn) { submitBtn.disabled = true; submitBtn.querySelector('span').textContent = '保存中...'; }

  var result = await saveIdea(text, selectedIdeaTags);

  if (submitBtn) { submitBtn.disabled = false; submitBtn.querySelector('span').textContent = '记录灵感'; }

  if (result.error) { showToast('保存失败: ' + result.error); return; }

  input.value = '';
  selectedIdeaTags = [];
  closeSpaceRecord();
  await loadIdeas(0);
}

// ==================== 飞行气泡到达（从 gallery 页面来） ====================

function receiveFlyingBubble(title) {
  switchTab('ideas');
  var ideasTab = document.querySelector('.tab[data-tab="ideas"]');
  if (ideasTab) {
    ideasTab.classList.add('tab-flash');
    setTimeout(function() { ideasTab.classList.remove('tab-flash'); }, 1500);
  }
  loadIdeas(0);
}

// ==================== 暴露到全局 ====================

window.loadIdeas = loadIdeas;
window.receiveFlyingBubble = receiveFlyingBubble;
window.openSpaceRecord = openSpaceRecord;
window.closeSpaceRecord = closeSpaceRecord;
window.handleSpaceRecordSubmit = handleSpaceRecordSubmit;

// ==================== 启动 ====================

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
