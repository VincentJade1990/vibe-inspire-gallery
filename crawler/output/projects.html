<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects - Vibe Bubble</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="./auth.js?v=20261119c"></script>
<script src="./nav.js?v=20261119e"></script>
<script type="module" src="./idea-bubbles.js?v=20261120f"></script>
<style>
/* ===== 变量与基础 ===== */
:root {
  --bg-deep: #0a0a0f;
  --bg-mid: #0f0f1a;
  --purple: #8b5cf6;
  --purple-light: #a78bfa;
  --blue: #3b82f6;
  --indigo: #6366f1;
  --text: #f8fafc;
  --text-dim: #94a3b8;
  --text-muted: #64748b;
  --glass-border: rgba(255, 255, 255, 0.08);
  --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-deep);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  overflow-x: hidden;
  padding-top: 68px;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: '';
  position: fixed;
  inset: -120px;
  background: conic-gradient(
    from 0deg,
    rgba(139, 92, 246, 0.12),
    rgba(59, 130, 246, 0.12),
    rgba(236, 72, 153, 0.10),
    rgba(6, 182, 212, 0.08),
    rgba(139, 92, 246, 0.12)
  );
  animation: cosmicRotate 30s linear infinite;
  z-index: -2;
  filter: blur(100px);
  pointer-events: none;
}

@keyframes cosmicRotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 60% at 20% 20%, rgba(139, 92, 246, 0.10) 0%, transparent 50%),
    radial-gradient(ellipse 50% 50% at 80% 80%, rgba(59, 130, 246, 0.08) 0%, transparent 45%),
    linear-gradient(180deg, #08080f 0%, #0a0a0f 50%, #0c0815 100%);
  z-index: -3;
  pointer-events: none;
}

/* ===== 容器 ===== */
.proj-wrap {
  position: relative;
  z-index: 1;
  max-width: 920px;
  margin: 0 auto;
  padding: 32px 24px 120px;
}

/* ===== 提示条 ===== */
.banner {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 13px 18px;
  border-radius: 14px;
  border: 1px solid rgba(139, 92, 246, 0.25);
  background: rgba(139, 92, 246, 0.08);
  font-size: 13px;
  color: var(--purple-light);
  margin-bottom: 22px;
  line-height: 1.7;
}

.banner.warn {
  border-color: rgba(245, 158, 11, 0.28);
  background: rgba(245, 158, 11, 0.08);
  color: #fbbf24;
}

.banner[hidden] { display: none; }

.banner-link {
  padding: 5px 14px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.22);
  background: rgba(255, 255, 255, 0.06);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: var(--transition);
}

.banner-link:hover {
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.4);
}

/* ===== 项目头 ===== */
.proj-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}

.proj-switch-wrap { position: relative; min-width: 0; }

.proj-switch {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 14px 9px 10px;
  border-radius: 16px;
  border: 1px solid var(--glass-border);
  background: rgba(255, 255, 255, 0.03);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  color: var(--text);
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  max-width: 100%;
  transition: var(--transition);
}

.proj-switch:hover {
  border-color: rgba(139, 92, 246, 0.35);
  background: rgba(139, 92, 246, 0.07);
}

.proj-dot {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: radial-gradient(circle at 32% 30%, #fff, #a79ef2 38%, #8b5cf6 72%);
  box-shadow: 0 0 16px rgba(139, 92, 246, 0.6);
  flex-shrink: 0;
}

.proj-switch-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.proj-title-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.proj-title {
  font-size: 16px;
  font-weight: 650;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 44vw;
}

.proj-demo-badge {
  flex-shrink: 0;
  padding: 2px 7px;
  border-radius: 999px;
  border: 1px solid rgba(198, 242, 78, 0.3);
  background: rgba(198, 242, 78, 0.08);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: rgba(198, 242, 78, 0.85);
}

.proj-demo-badge[hidden] { display: none; }

.proj-meta {
  font-size: 11.5px;
  color: var(--text-muted);
  margin-top: 2px;
  letter-spacing: 0.02em;
}

.proj-caret {
  width: 14px;
  height: 14px;
  color: var(--text-muted);
  margin-left: 4px;
  flex-shrink: 0;
  transition: transform 0.25s ease;
}

.proj-switch[aria-expanded="true"] .proj-caret { transform: rotate(180deg); }

.proj-actions { display: flex; gap: 10px; flex-wrap: wrap; }

.btn {
  padding: 10px 20px;
  border-radius: 999px;
  border: 1px solid var(--glass-border);
  background: rgba(255, 255, 255, 0.04);
  color: var(--text-dim);
  font-size: 13px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: var(--transition);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn:hover {
  color: var(--purple-light);
  border-color: rgba(139, 92, 246, 0.35);
  background: rgba(139, 92, 246, 0.08);
}

.btn-primary {
  background: linear-gradient(135deg, var(--purple), var(--indigo));
  border-color: transparent;
  color: #fff;
}

.btn-primary:hover {
  color: #fff;
  transform: translateY(-1px);
  box-shadow: 0 8px 24px rgba(139, 92, 246, 0.35);
}

/* ===== 页面底部操作 ===== */
.proj-foot {
  margin-top: 56px;
  text-align: center;
}

.link-danger {
  padding: 4px 2px;
  border: none;
  border-bottom: 1px solid transparent;
  background: none;
  color: rgba(252, 165, 165, 0.55);
  font-family: inherit;
  font-size: 12.5px;
  letter-spacing: 0.02em;
  cursor: pointer;
  transition: color 0.2s, border-color 0.2s;
}

.link-danger:hover {
  color: #fecaca;
  border-bottom-color: rgba(239, 68, 68, 0.5);
}

.link-danger[hidden] { display: none; }

.btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

/* 项目切换下拉 */
.proj-menu {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  min-width: 300px;
  max-width: 420px;
  max-height: 320px;
  overflow-y: auto;
  padding: 8px;
  border-radius: 16px;
  border: 1px solid var(--glass-border);
  background: rgba(15, 15, 28, 0.97);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  z-index: 60;
  display: none;
}

.proj-menu.show { display: block; animation: menuIn 0.18s ease; }

@keyframes menuIn {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}

.menu-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 10px 12px;
  border: none;
  border-radius: 10px;
  background: none;
  color: var(--text-dim);
  font-size: 13.5px;
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  transition: var(--transition);
}

.menu-item:hover { background: rgba(139, 92, 246, 0.10); color: var(--text); }

.menu-item.active { background: rgba(139, 92, 246, 0.12); color: var(--purple-light); }

.menu-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.7;
  flex-shrink: 0;
}

.menu-item-text {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.menu-badge {
  flex-shrink: 0;
  padding: 1px 6px;
  border-radius: 999px;
  border: 1px solid rgba(139, 92, 246, 0.35);
  background: rgba(139, 92, 246, 0.12);
  font-size: 9.5px;
  letter-spacing: 0.02em;
  color: var(--purple-light);
  white-space: nowrap;
}

.menu-empty {
  padding: 14px 12px;
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.7;
}

.menu-sep {
  height: 1px;
  margin: 6px 4px;
  background: rgba(255, 255, 255, 0.07);
}

/* ===== 孵化气泡 ===== */
.hatch {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 380px;
  padding-top: 18px;
}

.center-bubble {
  width: var(--bubble-size, 150px);
  height: var(--bubble-size, 150px);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background: radial-gradient(
    circle at 35% 30%,
    rgba(255, 255, 255, calc(var(--bubble-opacity, 1) * 0.12)),
    rgba(139, 92, 246, calc(var(--bubble-opacity, 1) * 0.10)) 40%,
    rgba(59, 130, 246, calc(var(--bubble-opacity, 1) * 0.06)) 70%,
    rgba(10, 10, 15, 0.4) 100%
  );
  border: 1px solid rgba(255, 255, 255, calc(var(--bubble-opacity, 1) * 0.12));
  box-shadow:
    0 0 var(--bubble-glow, 60px) rgba(139, 92, 246, calc(var(--bubble-opacity, 1) * 0.25)),
    inset 0 0 60px rgba(139, 92, 246, calc(var(--bubble-opacity, 1) * 0.10)),
    inset 0 2px 4px rgba(255, 255, 255, calc(var(--bubble-opacity, 1) * 0.08));
  backdrop-filter: blur(16px) saturate(1.4);
  -webkit-backdrop-filter: blur(16px) saturate(1.4);
  transition:
    width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1),
    height 0.8s cubic-bezier(0.34, 1.56, 0.64, 1),
    box-shadow 0.8s ease,
    opacity 0.6s ease;
  animation: bubbleFloat 5s ease-in-out infinite;
}

.center-bubble::before {
  content: '';
  position: absolute;
  top: 12%;
  left: 18%;
  width: 32%;
  height: 28%;
  border-radius: 50%;
  background: rgba(255, 255, 255, calc(var(--bubble-opacity, 1) * 0.2));
  filter: blur(10px);
  pointer-events: none;
  z-index: 1;
}

.center-bubble.iridescent::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: conic-gradient(
    from 0deg,
    rgba(236, 72, 153, 0.10),
    rgba(139, 92, 246, 0.10),
    rgba(59, 130, 246, 0.10),
    rgba(6, 182, 212, 0.10),
    rgba(245, 158, 11, 0.08),
    rgba(236, 72, 153, 0.10)
  );
  animation: iridescentSpin 8s linear infinite;
  pointer-events: none;
  mix-blend-mode: screen;
  z-index: 0;
}

@keyframes iridescentSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes bubbleFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.bubble-title-inner {
  font-size: var(--bubble-font-size, 12px);
  font-weight: 600;
  text-align: center;
  padding: 0 18%;
  color: rgba(255, 255, 255, 0.95);
  word-break: break-word;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: var(--bubble-line-clamp, 3);
  -webkit-box-orient: vertical;
  text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
  z-index: 2;
  position: relative;
  line-height: 1.4;
}

.center-bubble.subtle-glow {
  animation: bubbleFloat 5s ease-in-out infinite, subtleGlow 1.2s ease;
}

@keyframes subtleGlow {
  0% { filter: brightness(1); }
  30% { filter: brightness(1.2) saturate(1.3); }
  100% { filter: brightness(1); }
}

.hatch-caption {
  margin-top: 20px;
  font-size: 13px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
}

.hatch-step {
  color: var(--purple-light);
  font-weight: 600;
  letter-spacing: 0.06em;
}

.hatch-sep { color: var(--text-muted); }

/* ===== 8 步流程条 ===== */
.stage-overview-title {
  max-width: 640px;
  margin: 46px auto 0;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.015em;
  color: var(--text);
}

.stage-bar-wrap {
  max-width: 640px;
  margin: 20px auto 0;
}

.stage-bar {
  display: flex;
  align-items: flex-start;
}

.stage-seg {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  cursor: pointer;
  padding: 4px 0;
  outline: none;
}

.stage-seg:not(:last-child)::after {
  content: '';
  position: absolute;
  top: 18px;
  left: 50%;
  width: 100%;
  height: 2px;
  background: rgba(255, 255, 255, 0.06);
  z-index: 0;
}

.stage-seg.completed:not(:last-child)::after {
  background: var(--seg-color, var(--purple));
  opacity: 0.5;
}

.stage-seg.current:not(:last-child)::after {
  background: rgba(255, 255, 255, 0.06);
}

.stage-dot {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.1);
  background: var(--bg-deep);
  position: relative;
  z-index: 1;
  transition: var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
}

.stage-seg.completed .stage-dot {
  background: var(--seg-color, var(--purple));
  border-color: var(--seg-color, var(--purple));
  box-shadow: 0 0 12px var(--seg-color, var(--purple));
}

.stage-seg.current .stage-dot {
  background: var(--seg-color, var(--purple));
  border-color: var(--seg-color, var(--purple));
  box-shadow: 0 0 18px var(--seg-color, var(--purple)), 0 0 36px var(--seg-color, var(--purple));
  animation: stagePulse 2s ease-in-out infinite;
}

@keyframes stagePulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}

.stage-seg:hover .stage-dot {
  transform: scale(1.2);
  border-color: var(--seg-color, var(--purple));
}

.stage-dot-num {
  font-size: 12px;
  font-weight: 700;
  color: rgba(255, 255, 255, 0.4);
  position: relative;
  z-index: 2;
}

.stage-seg.current .stage-dot-num,
.stage-seg.completed .stage-dot-num { color: #fff; }

.stage-zh {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 6px;
  text-align: center;
  line-height: 1.2;
  max-width: 64px;
  font-weight: 500;
  transition: color 0.3s;
}

.stage-seg.current .stage-zh { color: var(--text); font-weight: 600; }
.stage-seg.completed .stage-zh { color: var(--text-dim); }

/* ===== 卡片 ===== */
.card {
  background: rgba(255, 255, 255, 0.025);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 24px;
  backdrop-filter: blur(16px) saturate(1.3);
  -webkit-backdrop-filter: blur(16px) saturate(1.3);
}

.method-card { margin-top: 46px; }

.method-title {
  margin: 0 0 8px;
  font-size: 18px;
  font-weight: 650;
  letter-spacing: -0.01em;
  color: var(--text);
}

.method-title[hidden] { display: none; }

.overview {
  font-size: 14px;
  line-height: 1.9;
  color: var(--text-dim);
  margin-bottom: 22px;
}

/* 胶囊标签栏 */
.tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 20px;
  padding: 5px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--glass-border);
  border-radius: 999px;
  width: fit-content;
}

.tab {
  padding: 8px 20px;
  border: none;
  background: transparent;
  color: var(--text-dim);
  font-size: 13px;
  font-weight: 600;
  font-family: inherit;
  letter-spacing: 0.04em;
  border-radius: 999px;
  cursor: pointer;
  transition: var(--transition);
}

.tab:hover { color: var(--text); }

.tab.active {
  color: #fff;
  background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(59, 130, 246, 0.25));
  box-shadow: 0 0 20px rgba(139, 92, 246, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.1);
}

.tab-panel { display: none; }

.tab-panel.active { display: block; animation: panelFadeIn 0.35s ease; }

@keyframes panelFadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 待办清单 */
.check-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.04);
  cursor: pointer;
  font-size: 14px;
  color: var(--text-dim);
  line-height: 1.65;
}

.check-item:last-child { border-bottom: none; }

.check-box {
  width: 18px;
  height: 18px;
  border-radius: 5px;
  border: 1.5px solid rgba(255, 255, 255, 0.18);
  flex-shrink: 0;
  margin-top: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
}

.check-item.done .check-box {
  background: linear-gradient(135deg, var(--purple), var(--indigo));
  border-color: transparent;
}

.check-item.done .check-box::after {
  content: '';
  width: 5px;
  height: 9px;
  border: solid #fff;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg) translate(-1px, -1px);
}

.check-item.done .check-text { color: var(--text-muted); text-decoration: line-through; }

.check-progress {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 6px;
}

/* 闪卡 */
.flash-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 12px;
}

.flash {
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  padding: 16px;
  background: rgba(255, 255, 255, 0.02);
  cursor: pointer;
  transition: var(--transition);
}

.flash:hover { border-color: rgba(139, 92, 246, 0.3); }

.flash-q { font-size: 14px; font-weight: 600; line-height: 1.5; }

.flash-a {
  font-size: 13px;
  line-height: 1.8;
  color: var(--text-dim);
  margin-top: 10px;
  display: none;
}

.flash.open .flash-a { display: block; }

/* 提示词 */
.prompt-box {
  position: relative;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 14px;
  padding: 18px 18px 54px;
}

.prompt-text {
  font-family: 'SF Mono', ui-monospace, Menlo, monospace;
  font-size: 13px;
  line-height: 1.85;
  color: #cbd5e1;
  white-space: pre-wrap;
  word-break: break-word;
}

.copy-btn {
  position: absolute;
  right: 14px;
  bottom: 14px;
  padding: 7px 16px;
  border-radius: 999px;
  border: 1px solid var(--glass-border);
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-dim);
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  transition: var(--transition);
}

.copy-btn:hover { color: var(--purple-light); border-color: rgba(139, 92, 246, 0.35); }

.copy-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* 占位提示 */
.pending {
  font-size: 13px;
  color: var(--text-muted);
  padding: 10px 0;
  line-height: 1.8;
}

/* ===== 产出卡 ===== */
.output-card { margin-top: 20px; }

.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}

.card-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.16em;
  color: var(--text-muted);
  text-transform: uppercase;
}

.card-hint { font-size: 12px; color: var(--text-muted); }

.output-spec {
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.7;
  padding: 12px 14px;

  function el(id) { return document.getElementById(id); }

  // ===== 认证辅助 =====
  function authUser() {
    if (typeof window.currentUser === 'function') {
      var live = window.currentUser();
      if (live) return live;
    }
    try {
      var cached = localStorage.getItem('vb_user');
      return cached ? JSON.parse(cached) : null;
    } catch (e) { return null; }
  }

  function isLoggedIn() {
    return !!(typeof getAccessToken === 'function' && getAccessToken() && authUser());
  }

  // ===== 数据加载 =====
  function loadSteps() {
    return fetch('./steps.json', { cache: 'no-cache' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) { STEPS = data.steps || []; });
  }

  // 一次读回该项目的全部阶段产出；表不存在时标记降级
  async function loadOutputs(ideaId) {
    outputs = {};
    tableMissing = false;
    var token = typeof getAccessToken === 'function' ? getAccessToken() : null;
    if (!token || !ideaId) return;

    try {
      var res = await fetch(
        SUPABASE_URL + '/rest/v1/idea_outputs?idea_id=eq.' + encodeURIComponent(ideaId) + '&select=stage,content',
        { headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + token } }
      );

      if (!res.ok) {
        var body = {};
        try { body = await res.json(); } catch (e) { /* ignore */ }
        var msg = (body && (body.message || body.hint || body.code)) || ('HTTP ' + res.status);
        if (body.code === 'PGRST205' || MISSING_PATTERN.test(msg)) {
          tableMissing = true;
          return;
        }
        console.warn('[Projects] 读取产出失败:', msg);
        return;
      }

      var rows = await res.json();
      (rows || []).forEach(function (row) {
        if (row && row.stage) outputs[row.stage] = row.content;
      });
    } catch (e) {
      console.error('[Projects] 读取产出异常:', e);
    }
  }

  function findStep(key) {
    for (var i = 0; i < STEPS.length; i++) {
      if (STEPS[i].key === key) return i;
    }
    return 0;
  }

  function countDone() {
    return STEPS.filter(function (s) { return !!outputs[s.key]; }).length;
  }

  function firstUnfinished() {
    for (var i = 0; i < STEPS.length; i++) {
      if (!outputs[STEPS[i].key]) return i;
    }
    return Math.max(0, STEPS.length - 1);
  }

  // ===== 渲染 =====
  function renderHeader() {
    var demo = !currentIdea;
    el('projTitle').textContent = demo ? DEMO.title : currentIdea.title;
    el('demoBadge').hidden = !demo;
    var total = STEPS.length || 8;
    el('projMeta').textContent = demo
      ? '示例项目 · 模拟数据'
      : '8 Step Creation Loop · 已完成 ' + countDone() + ' / ' + total;
    el('deleteProjectBtn').hidden = !(loggedIn && currentIdea);
    renderMenu();
  }

  function renderMenu() {
    var menu = el('projMenu');
    var demoItem = '<button class="menu-item' + (!currentIdea ? ' active' : '') + '" data-demo="1">' +
      '<span class="menu-dot"></span>' +
      '<span class="menu-item-text">' + escapeHtml(DEMO.title) + '</span>' +
      '<span class="menu-badge">示例</span>' +
      '</button>';

    if (!loggedIn) {
      menu.innerHTML = demoItem + '<div class="menu-empty">登录后可以切换和管理你的项目。</div>';
    } else if (!ideas.length) {
      menu.innerHTML = demoItem + '<div class="menu-empty">还没有项目。点右上角「新建项目」，或从 Ideas 里挑一条灵感开始孵化。</div>';
    } else {
      menu.innerHTML = ideas.map(function (idea) {
        var active = currentIdea && currentIdea.id === idea.id ? ' active' : '';
        var badge = idea.source_type === 'ai-passport'
          ? '<span class="menu-badge">AI Passport</span>'
          : '';
        return '<button class="menu-item' + active + '" data-id="' + idea.id + '">' +
          '<span class="menu-dot"></span>' +
          '<span class="menu-item-text">' + escapeHtml(idea.title) + '</span>' +
          badge +
          '</button>';
      }).join('') + '<div class="menu-sep"></div>' + demoItem;
    }

    menu.querySelectorAll('.menu-item').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (btn.getAttribute('data-demo') === '1') {
          selectDemo();
          return;
        }
        var id = btn.getAttribute('data-id');
        var target = ideas.filter(function (x) { return x.id === id; })[0];
        if (target) selectIdea(target);
      });
    });
  }

  function renderBubble() {
    var v = STAGE_VISUAL[currentIndex] || STAGE_VISUAL[0];
    var host = el('hatchBubble');
    var label = el('bubbleTitle');

    host.style.width = v.size + 'px';
    host.style.height = v.size + 'px';
    label.style.fontSize = v.fontSize + 'px';
    label.textContent = currentIdea ? currentIdea.title : DEMO.title;

    if (heroBubble) heroBubble.setSize(v.size);

    var s = STEPS[currentIndex] || {};
    el('hatchStep').textContent = '第 ' + (s.no || '01') + ' 步';
    el('hatchName').textContent = (s.name || '') + (s.nameCn ? ' ' + s.nameCn : '');
  }

  function mountProjectBubble() {
    if (heroBubble || !window.IdeaBubbles || !window.IdeaBubbles.mountHero) return;
    var v = STAGE_VISUAL[currentIndex] || STAGE_VISUAL[0];
    heroBubble = window.IdeaBubbles.mountHero(el('hatchBubble'), {
      labelEl: el('bubbleTitle'),
      sizePx: v.size,
      paletteIndex: 0
    });
  }

  function renderStageBar() {
    var bar = el('stageBar');
    var demo = !currentIdea;
    bar.innerHTML = STEPS.map(function (s, i) {
      var cls = 'stage-seg';
      var done = demo ? (i < currentIndex) : !!aiCache[aiKeyOf(s)];
      if (done) cls += ' completed';
      if (i === currentIndex) cls += ' current';
      return '<div class="' + cls + '" data-i="' + i + '" role="button" tabindex="0"' +
        ' aria-label="' + escapeHtml(s.name + ' ' + s.nameCn) + '"' +
        ' style="--seg-color:' + STEP_COLORS[i % STEP_COLORS.length] + ';">' +
        '<div class="stage-dot"><span class="stage-dot-num">' + escapeHtml(s.no) + '</span></div>' +
        '<div class="stage-zh">' + escapeHtml(s.nameCn) + '</div>' +
        '</div>';
    }).join('');

    bar.querySelectorAll('.stage-seg').forEach(function (seg) {
      seg.addEventListener('click', function () {
        gotoStep(parseInt(seg.getAttribute('data-i'), 10));
      });
      seg.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          gotoStep(parseInt(seg.getAttribute('data-i'), 10));
        }
      });
    });
  }

  function stageData() {
    var base = STEPS[currentIndex] || {};
    if (!currentIdea) {
      var demoStage = DEMO.stages[base.key];
      if (demoStage) return Object.assign({}, base, demoStage);
    }
    return base;
  }

  function renderStageContent() {
    var s = stageData();

    el('methodTitle').textContent = s.subtitle || '';
    el('methodTitle').hidden = !s.subtitle;
    el('overview').textContent = s.overview || '这一阶段的方法说明正在整理中。';
    el('summaryHint').textContent = '阶段 ' + (s.no || '') + ' / 08';
    el('outputStageHint').textContent = (s.no || '') + ' ' + (s.name || '');

    renderAi(s);
    renderOutput(s);
  }

  function renderChecklist(s, doneRef, persistKey) {
    var box = el('checkList');
    var items = s.checklist || [];
    s._done = doneRef || s._done || {};

    if (!items.length) {
      box.innerHTML = '<div class="pending">这一步的待办正在整理中。</div>';
      el('checkProgress').textContent = '';
      return;
    }

    var done = s._done || {};
    box.innerHTML = items.map(function (text, i) {
      return '<div class="check-item' + (done[i] ? ' done' : '') + '" data-i="' + i + '">' +
        '<span class="check-box"></span>' +
        '<span class="check-text">' + escapeHtml(text) + '</span>' +
        '</div>';
    }).join('');

    box.querySelectorAll('.check-item').forEach(function (item) {
      item.addEventListener('click', function () {
        var i = item.getAttribute('data-i');
        s._done[i] = !s._done[i];
        item.classList.toggle('done', !!s._done[i]);
        if (persistKey) {
          aiCheckDone[persistKey] = s._done;
          saveAiCache();
        }
        updateProgress(s);
      });
    });

    updateProgress(s);
  }

  function updateProgress(s) {
    var total = (s.checklist || []).length;
    if (!total) { el('checkProgress').textContent = ''; return; }
    var doneCount = 0;
    Object.keys(s._done || {}).forEach(function (k) { if (s._done[k]) doneCount++; });
    el('checkProgress').textContent = '进度 ' + doneCount + ' / ' + total;
  }

  function renderFlashcards(s) {
    var grid = el('flashGrid');
    var cards = s.flashcards || [];

    if (!cards.length) {
      grid.innerHTML = '<div class="pending">这一步的闪卡正在整理中，可以先看看「提示词」。</div>';
      return;
    }

    grid.innerHTML = cards.map(function (c) {
      return '<div class="flash">' +
        '<div class="flash-q">' + escapeHtml(c.q) + '</div>' +
        '<div class="flash-a">' + escapeHtml(c.a) + '</div>' +
        '</div>';
    }).join('');

    grid.querySelectorAll('.flash').forEach(function (card) {
      card.addEventListener('click', function () { card.classList.toggle('open'); });
    });
  }

  function renderPrompt(s) {
    var hasPrompt = !!s.prompt;
    el('promptText').textContent = hasPrompt ? s.prompt : '这一步的提示词正在整理中。';
    el('copyBtn').disabled = !hasPrompt;
  }

  // ===== AI 解析 =====
  function aiKeyOf(s) {
    return (currentIdea ? currentIdea.id : 'demo') + ':' + (s.key || currentIndex);
  }

  function loadAiCache() {
    try { aiCache = JSON.parse(localStorage.getItem('vb_stage_ai') || '{}') || {}; } catch (e) { aiCache = {}; }
    try { aiCheckDone = JSON.parse(localStorage.getItem('vb_stage_ai_done') || '{}') || {}; } catch (e) { aiCheckDone = {}; }
  }

  function saveAiCache() {
    try { localStorage.setItem('vb_stage_ai', JSON.stringify(aiCache)); } catch (e) { /* ignore */ }
    try { localStorage.setItem('vb_stage_ai_done', JSON.stringify(aiCheckDone)); } catch (e) { /* ignore */ }
  }

  function fallbackContent(s) {
    return {
      summary: s.overview || s.subtitle || '',
      tasks: (s.checklist || []).slice(),
      knowledge: (s.flashcards || []).slice(),
      prompt: s.prompt || ''
    };
  }

  function currentAi(s) {
    return aiCache[aiKeyOf(s)] || null;
  }

  function hasContent(data) {
    if (!data) return false;
    return (Array.isArray(data.tasks) && data.tasks.length > 0) ||
      (Array.isArray(data.knowledge) && data.knowledge.length > 0) ||
      !!data.prompt;
  }

  function renderAi(s) {
    var data = currentAi(s);
    var ready = hasContent(data);

    el('aiPlaceholder').hidden = ready;
    el('aiBody').hidden = !ready;
    el('aiLoading').hidden = true;

    var btn = el('aiParseBtn');
    btn.disabled = false;
    btn.textContent = ready ? '重新解析' : 'AI 解析本阶段';

    if (ready) {
      var key = aiKeyOf(s);
      var summary = data.summary || '';
      var showSummary = !!summary && summary.trim() !== (s.overview || '').trim();
      el('aiSummary').textContent = summary;
      el('aiSummary').hidden = !showSummary;
      renderChecklist({ checklist: data.tasks || [] }, aiCheckDone[key] || {}, key);
      renderFlashcards({ flashcards: data.knowledge || [] });
      renderPrompt({ prompt: data.prompt || '' });
      el('fillOutputBtn').hidden = !currentIdea;
    } else {
      el('fillOutputBtn').hidden = true;
    }

    updateNextState(ready);
  }

  function updateNextState(ready) {
    var btn = el('nextBtn');
    var last = currentIndex >= STEPS.length - 1;
    btn.disabled = !ready;
    btn.textContent = last ? '完成项目' : '下一步';
    el('nextHint').textContent = ready
      ? (last ? '8 个阶段已走完，可以整理成 Case 发布' : '阶段产物可选，不影响进入下一步')
      : '先完成本阶段 AI 解析';
    el('nextHint').classList.toggle('is-warn', !ready);
  }

  function delay(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  async function runAiParse() {
    if (aiBusy) return;

    var s = stageData();
    var key = aiKeyOf(s);
    aiBusy = true;

    var btn = el('aiParseBtn');
    btn.disabled = true;
    btn.textContent = '解析中…';
    el('aiPlaceholder').hidden = true;
    el('aiBody').hidden = true;
    el('aiLoading').hidden = false;

    var stepIndex = 0;
    el('aiLoadingText').textContent = AI_RUN_STEPS[0];
    var timer = setInterval(function () {
      stepIndex = Math.min(stepIndex + 1, AI_RUN_STEPS.length - 1);
      el('aiLoadingText').textContent = AI_RUN_STEPS[stepIndex];
    }, 700);

    var startedAt = Date.now();
    var result = null;

    try {
      var res = await fetch(AI_ENDPOINT, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + ((typeof getAccessToken === 'function' && getAccessToken()) || SUPABASE_ANON_KEY)
        },
        body: JSON.stringify({
          project: currentIdea ? currentIdea.title : DEMO.title,
          stage: {
            no: s.no,
            name: s.name,
            nameCn: s.nameCn,
            overview: s.overview || s.subtitle || ''
          },
          output: el('outputArea').value.trim()
        }),
        signal: AbortSignal.timeout(15000)
      });

      if (res.ok) {
        var payload = await res.json();
        var content = payload && (payload.content || payload);
        if (hasContent(content)) result = content;
      }
    } catch (err) {
      console.warn('[Projects] 阶段解析失败，使用示例内容兜底', err);
    }

    if (!hasContent(result)) result = fallbackContent(s);

    var remain = Math.max(0, 2200 - (Date.now() - startedAt));
    if (remain) await delay(remain);
    clearInterval(timer);

    aiBusy = false;
    el('aiLoading').hidden = true;

    if (hasContent(result)) {
      aiCache[key] = result;
      saveAiCache();
      renderAi(s);
    } else {
      btn.disabled = false;
      btn.textContent = 'AI 解析本阶段';
      el('aiPlaceholder').hidden = false;
      updateNextState(false);
    }
  }

  function buildDraft(data) {
    var lines = [];
    if (data.summary) lines.push('【阶段小结】', data.summary, '');
    if (data.tasks && data.tasks.length) {
      lines.push('【任务清单】');
      data.tasks.forEach(function (task) { lines.push('- ' + task); });
      lines.push('');
    }
    if (data.knowledge && data.knowledge.length) {
      lines.push('【核心知识】');
      data.knowledge.forEach(function (item) { lines.push('- ' + item.q + '：' + item.a); });
      lines.push('');
    }
    if (data.prompt) lines.push('【提示词】', data.prompt);
    return lines.join('\n').trim();
  }

  function fillOutputFromAi() {
    var s = stageData();
    var data = currentAi(s);
    if (!data) return;

    var area = el('outputArea');
    if (area.readOnly) return;

    var draft = buildDraft(data);
    var existing = area.value.trim();
    area.value = existing ? existing + '\n\n' + draft : draft;
    el('saveState').textContent = '已填入，记得保存';
    area.focus();
  }

  async function handleNext() {
    var s = stageData();
    if (!hasContent(currentAi(s))) return;

    if (currentIndex >= STEPS.length - 1) {
      showBanner('8 个阶段已全部走完，接下来可以把项目整理成 Case 发布。', '');
      return;
    }

    var text = el('outputArea').value.trim();
    if (currentIdea && loggedIn && text && text !== (outputs[s.key] || '')) {
      await handleSave();
    }

    gotoStep(currentIndex + 1);

    var card = document.querySelector('.stage-card');
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function renderOutput(s) {
    var demo = !currentIdea;
    el('outputSpec').textContent = s.outputSpec || '产出物定义待补充';
    el('outputArea').value = demo ? (s.output || '') : (outputs[s.key] || '');
    el('outputArea').readOnly = demo;
    el('saveBtn').hidden = demo;

    if (demo) {
      setState('示例产出 · 不可编辑');
      return;
    }

    el('saveBtn').disabled = false;

    if (!loggedIn) {
      setState('登录后可保存');
    } else if (tableMissing) {
      setState('云端保存暂未开启');
    } else {
      setState(outputs[s.key] ? '已保存' : '尚未保存');
    }
  }

  function renderAll() {
    renderHeader();
    renderBubble();
    renderStageBar();
    renderStageContent();
  }

  function gotoStep(i) {
    if (i < 0 || i >= STEPS.length) return;
    currentIndex = i;
    renderBubble();
    renderStageBar();
    renderStageContent();
  }

  function setState(text) {
    el('saveState').textContent = text;
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  // ===== 提示条 =====
  function showBanner(html, kind) {
    var b = el('banner');
    b.className = 'banner' + (kind ? ' ' + kind : '');
    b.innerHTML = html;
    b.hidden = false;
    var loginBtn = b.querySelector('#bannerLogin');
    if (loginBtn) {
      loginBtn.addEventListener('click', function () {
        if (typeof showAuthModal === 'function') showAuthModal('login');
      });
    }
  }

  function applyBanner() {
    if (!currentIdea) {
      var tail = loggedIn
        ? '点「新建项目」开始你自己的版本。'
        : '<button class="banner-link" id="bannerLogin">登录后开始孵化</button>';
      showBanner('你正在查看示例项目：' + escapeHtml(DEMO.title) + '。内容为教学示例，数据为模拟。' + tail);
      return;
    }
    if (!loggedIn) {
      showBanner('你正在查看示例项目，方法内容可自由浏览。<button class="banner-link" id="bannerLogin">登录后开始孵化</button>');
      return;
    }
    if (notice) { showBanner(escapeHtml(notice)); return; }
    if (tableMissing) {
      showBanner('产出保存暂未开启：数据库里还没有 idea_outputs 表。方法内容可以正常浏览，建表后即可保存。', 'warn');
      return;
    }
    el('banner').hidden = true;
  }

  // ===== 项目切换 =====
  function toggleMenu(force) {
    menuOpen = typeof force === 'boolean' ? force : !menuOpen;
    el('projMenu').classList.toggle('show', menuOpen);
    el('projSwitch').setAttribute('aria-expanded', menuOpen ? 'true' : 'false');
  }

  async function selectIdea(idea) {
    if (!idea) return;
    currentIdea = idea;
    notice = '';
    toggleMenu(false);
    try { history.replaceState({}, '', './projects?idea=' + encodeURIComponent(idea.id)); } catch (e) { /* ignore */ }

    await loadOutputs(idea.id);
    currentIndex = firstUnfinished();
    applyBanner();
    renderAll();
  }

  function selectDemo() {
    currentIdea = null;
    outputs = {};
    notice = '';
    currentIndex = DEMO.index;
    toggleMenu(false);
    try { history.replaceState({}, '', './projects'); } catch (e) { /* ignore */ }
    applyBanner();
    renderAll();
  }

  // ===== 事件 =====
  function bindEvents() {
    el('projSwitch').addEventListener('click', function (e) {
      e.stopPropagation();
      toggleMenu();
    });

    document.addEventListener('click', function (e) {
      if (!menuOpen) return;
      var menu = el('projMenu');
      var sw = el('projSwitch');
      if (!menu || !sw || !document.body.contains(menu)) return;
      if (!menu.contains(e.target) && !sw.contains(e.target)) toggleMenu(false);
    });

    el('aiParseBtn').addEventListener('click', runAiParse);
    el('nextBtn').addEventListener('click', handleNext);
    el('fillOutputBtn').addEventListener('click', fillOutputFromAi);

    el('copyBtn').addEventListener('click', function () {
      var text = el('promptText').textContent;
      if (!text || el('copyBtn').disabled) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          el('copyBtn').textContent = '已复制';
          setTimeout(function () { el('copyBtn').textContent = '复制'; }, 1600);
        });
      }
    });

    el('saveBtn').addEventListener('click', handleSave);

    el('newProjectBtn').addEventListener('click', async function () {
      if (!loggedIn) {
        if (typeof showAuthModal === 'function') showAuthModal('signup');
        return;
      }
      var btn = el('newProjectBtn');
      btn.disabled = true;
      btn.textContent = '创建中…';
      var res = await saveIdea('未命名项目', []);
      if (res && res.success && res.data) {
        var promo = await promoteIdea(res.data.id);
        if (promo && promo.success) {
          window.location.href = './projects?idea=' + encodeURIComponent(res.data.id);
          return;
        }
        btn.disabled = false;
        btn.textContent = '＋ 新建项目';
        showBanner('项目已创建，但进入孵化失败，请重试。', 'warn');
        return;
      }
      btn.disabled = false;
      btn.textContent = '＋ 新建项目';
      showBanner(escapeHtml((res && res.error) || '创建失败'), 'warn');
    });

    el('deleteProjectBtn').addEventListener('click', openDeleteModal);
    el('delCancelBtn').addEventListener('click', closeDeleteModal);
    el('deleteModal').addEventListener('click', function (e) {
      if (e.target === el('deleteModal')) closeDeleteModal();
    });
    el('delReturnBtn').addEventListener('click', handleReturnToIdeas);
    el('delConfirmBtn').addEventListener('click', handleDeleteProject);
  }

  // ===== 删除项目 =====
  function openDeleteModal() {
    if (!currentIdea) return;
    el('delProjectName').textContent = '「' + currentIdea.title + '」';
    el('deleteModal').classList.add('show');
  }

  function closeDeleteModal() {
    el('deleteModal').classList.remove('show');
  }

  async function handleReturnToIdeas() {
    if (!currentIdea) return;
    var idea = currentIdea;
    closeDeleteModal();
    var res = await demoteIdea(idea.id);
    if (res && res.success) {
      window.location.href = './ideas?returned=1';
      return;
    }
    showBanner(escapeHtml((res && res.error) || '退回失败'), 'warn');
  }

  async function handleDeleteProject() {
    if (!currentIdea) return;
    var idea = currentIdea;
    closeDeleteModal();
    var res = await deleteIdea(idea.id);
    if (res && res.success) {
      window.location.href = './projects?deleted=1';
      return;
    }
    showBanner(escapeHtml((res && res.error) || '删除失败'), 'warn');
  }

  async function handleSave() {
    var step = STEPS[currentIndex];
    if (!step) return;

    if (!loggedIn) {
      setState('请先登录后再保存');
      if (typeof showAuthModal === 'function') showAuthModal('login');
      return;
    }
    if (!currentIdea) {
      setState('先从 Ideas 选择一个项目');
      return;
    }
    if (tableMissing) {
      setState('云端保存暂未开启');
      return;
    }

    var text = el('outputArea').value.trim();
    if (!text) {
      setState('先写点内容再保存');
      el('outputArea').focus();
      return;
    }

    var btn = el('saveBtn');
    btn.disabled = true;
    setState('保存中…');

    var res = await saveIdeaOutput(currentIdea.id, step.key, text, 'step_output');

    btn.disabled = false;

    if (res && res.success) {
      outputs[step.key] = text;
      setState('已保存');
      renderHeader();
      renderStageBar();

      var bubble = el('hatchBubble');
      if (bubble) {
        bubble.classList.add('is-saved');
        setTimeout(function () { bubble.classList.remove('is-saved'); }, 1000);
      }
      return;
    }

    var msg = (res && res.error) || '保存失败';
    if (MISSING_PATTERN.test(msg)) {
      tableMissing = true;
      setState('云端保存暂未开启');
      applyBanner();
    } else {
      setState('保存失败：' + msg);
    }
  }

  // ===== 初始化 =====
  async function init() {
    bindEvents();
    loadAiCache();
    loggedIn = isLoggedIn();
    authStateAtLoad = loggedIn;

    try {
      await loadSteps();
    } catch (e) {
      console.error('[Projects] steps.json 加载失败:', e);
      el('overview').textContent = '方法内容库加载失败，请刷新重试。';
      return;
    }

    var params = new URLSearchParams(window.location.search);
    var requestedId = params.get('idea');

    if (params.get('deleted') === '1') notice = '项目已删除。';

    // 首页「创建项目」入口：?new=1 直接新建并跳转
    if (loggedIn && params.get('new') === '1') {
      var created = await saveIdea('未命名项目', []);
      if (created && created.success && created.data) {
        await promoteIdea(created.data.id);
        window.location.replace('./projects?idea=' + encodeURIComponent(created.data.id));
        return;
      }
    }

    if (loggedIn) {
      var user = authUser();
      var allIdeas = (await getUserIdeas(user.id)) || [];
      var requestedIdea = requestedId
        ? (allIdeas.filter(function (x) { return x.id === requestedId; })[0] || null)
        : null;

      // 从 Ideas 进入孵化但标记未写入时，以 URL 里的 idea 参数为准补一次
      if (requestedIdea && !isPromotedIdea(requestedIdea)) {
        var promo = await promoteIdea(requestedId);
        if (promo && promo.success) {
          requestedIdea = Object.assign({}, requestedIdea, {
            tags: (requestedIdea.tags || []).concat(IDEA_PROJECT_TAG)
          });
        }
      }

      ideas = allIdeas.filter(function (x) { return isPromotedIdea(x); });

      if (requestedIdea) {
        if (!ideas.some(function (x) { return x.id === requestedId; })) ideas.unshift(requestedIdea);
        currentIdea = requestedIdea;
      } else if (requestedId) {
        notice = '没有找到这个项目，当前展示的是示例内容。';
      } else if (ideas.length) {
        currentIdea = ideas[0];
      } else if (!notice) {
        notice = '你还没有正在孵化的项目。下面是一份示例流程，点「新建项目」或在 Ideas 里挑一条灵感即可开始。';
      }

      if (currentIdea) await loadOutputs(currentIdea.id);
    }

    var stepKey = params.get('step');
    currentIndex = stepKey ? findStep(stepKey) : (currentIdea ? firstUnfinished() : DEMO.index);

    applyBanner();
    renderAll();

    window.addEventListener('idea-bubbles-ready', mountProjectBubble);
    mountProjectBubble();

    if (!loggedIn && params.get('new') === '1' && typeof showAuthModal === 'function') {
      showAuthModal('signup');
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
