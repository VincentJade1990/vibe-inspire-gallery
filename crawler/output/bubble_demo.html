    // ==================== 音频系统 ====================
    let audioCtx = null;
    function initAudio() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    function playPopSound() {
      if (!audioCtx) return;
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, t);
      osc.frequency.exponentialRampToValueAtTime(150, t + 0.08);
      gain.gain.setValueAtTime(0.4, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.12);
      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(2000, t);
      osc2.frequency.exponentialRampToValueAtTime(400, t + 0.05);
      gain2.gain.setValueAtTime(0.15, t);
      gain2.gain.exponentialRampToValueAtTime(0.01, t + 0.06);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start(t);
      osc2.stop(t + 0.06);
      const bufferSize = audioCtx.sampleRate * 0.1;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize) * 0.3;
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const noiseGain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 3000;
      filter.Q.value = 2;
      noiseGain.gain.setValueAtTime(0.2, t);
      noiseGain.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
      noise.connect(filter);
      filter.connect(noiseGain);
      noiseGain.connect(audioCtx.destination);
      noise.start(t);
    }

    // ==================== Canvas 设置 ====================
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let W, H;
    function resize() {
      W = canvas.width = window.innerWidth * Math.min(window.devicePixelRatio, 2);
      H = canvas.height = window.innerHeight * Math.min(window.devicePixelRatio, 2);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.scale(Math.min(window.devicePixelRatio, 2), Math.min(window.devicePixelRatio, 2));
    }
    resize();
    window.addEventListener('resize', resize);

    function lerp(a, b, t) { return a + (b - a) * t; }
    function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
    function wrapText(ctx, text, maxWidth) {
      const chars = text.split('');
      const lines = [];
      let current = '';
      for (const ch of chars) {
        const test = current + ch;
        if (ctx.measureText(test).width > maxWidth && current) {
          lines.push(current);
          current = ch;
        } else {
          current = test;
        }
      }
      if (current) lines.push(current);
      return lines;
    }

    // ==================== 背景星空 ====================
    const stars = [];
    for (let i = 0; i < 200; i++) {
      stars.push({
        x: Math.random(), y: Math.random(),
        size: Math.random() * 1.5 + 0.3,
        alpha: Math.random() * 0.6 + 0.1,
        twinkleSpeed: Math.random() * 2 + 0.5,
        hue: Math.random() * 60 + 180
      });
    }

    // ==================== 粒子系统 ====================
    let particles = [];
    class Particle {
      constructor(x, y, radius, hue) {
        this.x = x; this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 6;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.radius = 1.5 + Math.random() * 4;
        this.life = 1;
        this.decay = 0.015 + Math.random() * 0.02;
        this.hue = hue + (Math.random() - 0.5) * 60;
        this.gravity = 0.08;
        this.shrink = 0.96;
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        this.vy += this.gravity;
        this.vx *= 0.98; this.vy *= 0.98;
        this.radius *= this.shrink;
        this.life -= this.decay;
      }
      draw(ctx) {
        if (this.life <= 0) return;
        ctx.save();
        ctx.globalAlpha = this.life;
        const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius * 2);
        g.addColorStop(0, `hsla(${this.hue}, 90%, 70%, 1)`);
        g.addColorStop(0.5, `hsla(${this.hue}, 80%, 50%, 0.5)`);
        g.addColorStop(1, `hsla(${this.hue}, 60%, 30%, 0)`);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius * 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }
    function spawnParticles(x, y, r) {
      const hue = Math.random() * 360;
      const count = 20 + Math.floor(r / 3);
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, r, hue));
      }
    }

    // ==================== 鼠标交互状态 ====================
    const mouse = { x: -1000, y: -1000, vx: 0, vy: 0, prevX: -1000, prevY: -1000 };
    const input = {
      isDown: false,
      isLongPress: false,
      downTime: 0,
      downPos: { x: 0, y: 0 },
      draggedBubble: null,
      dragOffset: { x: 0, y: 0 }
    };
    const LONG_PRESS_MS = 250;

    // ==================== 气泡类 ====================
    class Bubble {
      constructor(data, index) {
        this.data = data;
        this.index = index;
        const likeTier = data.likes > 20 ? 2 : data.likes > 5 ? 1 : 0;
        this.baseRadius = [60, 80, 100][likeTier] + Math.random() * 10;
        this.radius = this.baseRadius;
        this.x = Math.random() * (window.innerWidth - 200) + 100;
        this.y = Math.random() * (window.innerHeight - 200) + 100;
        const speed = 0.12 + Math.random() * 0.2;
        const angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.wobblePhase = Math.random() * Math.PI * 2;
        this.wobbleSpeed = 0.4 + Math.random() * 0.8;
        this.wobbleAmp = 2 + Math.random() * 4;
        this.alive = true;
        this.popping = false;
        this.popProgress = 0;
        this.irisPhase = Math.random() * Math.PI * 2;
        this.z = Math.random();
        // 水流扰动相关
        this.ripplePhase = 0;
        this.rippleAmp = 0;
        // 拖拽相关
        this.isDragged = false;
        this.dragX = 0;
        this.dragY = 0;
      }

      update(dt, time) {
        if (!this.alive) return;

        if (this.popping) {
          this.popProgress += dt * 4;
          if (this.popProgress >= 1) {
            this.alive = false;
            spawnParticles(this.x, this.y, this.radius);
            playPopSound();
            poppedCount++;
            document.getElementById('pop-count').textContent = poppedCount;
            setTimeout(() => {
              bubbles[this.index] = new Bubble(this.data, this.index);
            }, 3000 + Math.random() * 4000);
          }
          return;
        }

        if (this.isDragged) {
          // 被拖拽：平滑跟随鼠标
          const targetX = input.draggedBubble === this ? mouse.x + this.dragOffset.x : this.x;
          const targetY = input.draggedBubble === this ? mouse.y + this.dragOffset.y : this.y;
          this.x = lerp(this.x, targetX, dt * 15);
          this.y = lerp(this.y, targetY, dt * 15);
          this.vx = 0;
          this.vy = 0;
        } else {
          // 自然漂浮
          this.wobblePhase += this.wobbleSpeed * dt;
          this.x += this.vx + Math.sin(this.wobblePhase) * this.wobbleAmp * 0.015;
          this.y += this.vy + Math.cos(this.wobblePhase * 0.7) * this.wobbleAmp * 0.015;

          // 边界反弹
          const margin = this.radius;
          if (this.x < margin) { this.x = margin; this.vx = Math.abs(this.vx) * 0.8; }
          if (this.x > window.innerWidth - margin) { this.x = window.innerWidth - margin; this.vx = -Math.abs(this.vx) * 0.8; }
          if (this.y < margin + 50) { this.y = margin + 50; this.vy = Math.abs(this.vy) * 0.8; }
          if (this.y > window.innerHeight - margin - 10) { this.y = window.innerHeight - margin - 10; this.vy = -Math.abs(this.vy) * 0.8; }
        }

        // 水流扰动：鼠标滑过产生的波动
        const dMouse = dist(this, mouse);
        const influenceR = this.radius * 3.5;
        if (dMouse < influenceR && dMouse > 0 && !this.isDragged) {
          // 鼠标移动越快，扰动越大
          const mouseSpeed = Math.hypot(mouse.vx, mouse.vy);
          const strength = (1 - dMouse / influenceR) * mouseSpeed * 0.008;
          // 垂直于鼠标移动方向的推力（水流侧向推动）
          const angle = Math.atan2(this.y - mouse.y, this.x - mouse.x);
          const pushAngle = angle + Math.PI * 0.5 * (Math.sin(time * 3 + this.index) > 0 ? 1 : -1);
          this.vx += Math.cos(pushAngle) * strength;
          this.vy += Math.sin(pushAngle) * strength;
          // 波纹视觉效果
          this.rippleAmp = lerp(this.rippleAmp, strength * 300, dt * 5);
        } else {
          this.rippleAmp = lerp(this.rippleAmp, 0, dt * 3);
        }
        this.ripplePhase += dt * 8;

        // 速度衰减
        if (!this.isDragged) {
          this.vx *= 0.995;
          this.vy *= 0.995;
        }

        // 碰撞处理
        for (let other of bubbles) {
          if (other === this || !other.alive || other.popping) continue;
          const d = dist(this, other);
          const minD = this.radius + other.radius + 2;
          if (d < minD && d > 0) {
            const nx = (other.x - this.x) / d;
            const ny = (other.y - this.y) / d;
            const overlap = minD - d;
            // 如果被拖拽，推力更强（挤开效果）
            const pushFactor = this.isDragged || other.isDragged ? 0.8 : 0.25;
            this.x -= nx * overlap * pushFactor;
            this.y -= ny * overlap * pushFactor;
            other.x += nx * overlap * pushFactor;
            other.y += ny * overlap * pushFactor;
            // 弹性反馈
            if (!this.isDragged && !other.isDragged) {
              const relVx = this.vx - other.vx;
              const relVy = this.vy - other.vy;
              const relDot = relVx * nx + relVy * ny;
              if (relDot < 0) {
                const impulse = relDot * 0.3;
                this.vx -= impulse * nx;
                this.vy -= impulse * ny;
                other.vx += impulse * nx;
                other.vy += impulse * ny;
              }
            }
          }
        }
      }

      draw(ctx, time) {
        if (!this.alive) return;
        ctx.save();
        ctx.translate(this.x, this.y);
        const r = this.radius;
        const alpha = this.popping ? 1 - this.popProgress : 1;

        // 水流扰动导致的形状变形（模拟真实气泡在水中的波动）
        const rippleX = Math.cos(this.ripplePhase) * this.rippleAmp;
        const rippleY = Math.sin(this.ripplePhase * 0.7) * this.rippleAmp * 0.6;
        ctx.translate(rippleX, rippleY);

        // ===== 外层镭射光晕 =====
        const glowR = r * (2.2 + this.rippleAmp * 0.01);
        const glowGrad = ctx.createRadialGradient(0, 0, r * 0.6, 0, 0, glowR);
        const hue = (this.irisPhase + time * 25) % 360;
        glowGrad.addColorStop(0, `hsla(${hue}, 85%, 55%, ${0.12 * alpha})`);
        glowGrad.addColorStop(0.4, `hsla(${(hue + 50) % 360}, 80%, 50%, ${0.06 * alpha})`);
        glowGrad.addColorStop(1, `hsla(${(hue + 100) % 360}, 70%, 45%, 0)`);
        ctx.fillStyle = glowGrad;
        ctx.beginPath();
        ctx.arc(0, 0, glowR, 0, Math.PI * 2);
        ctx.fill();

        // ===== 气泡球体主体 =====
        const bodyGrad = ctx.createRadialGradient(-r * 0.3, -r * 0.35, 0, 0, 0, r);
        bodyGrad.addColorStop(0, `rgba(255,255,255,${0.1 * alpha})`);
        bodyGrad.addColorStop(0.35, `rgba(0,220,255,${0.05 * alpha})`);
        bodyGrad.addColorStop(0.75, `rgba(0,80,180,${0.04 * alpha})`);
        bodyGrad.addColorStop(0.92, `rgba(0,200,255,${0.12 * alpha})`);
        bodyGrad.addColorStop(1, `rgba(0,180,255,${0.22 * alpha})`);
        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();

        // ===== 彩虹镭射边缘（光影流动） =====
        ctx.save();
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.clip();
        const rimSteps = 72;
        for (let i = 0; i < rimSteps; i++) {
          const angle = (i / rimSteps) * Math.PI * 2;
          const rimHue = (hue + (i / rimSteps) * 200 + time * 40) % 360;
          const nextAngle = ((i + 1) / rimSteps) * Math.PI * 2;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, r, angle, nextAngle);
          ctx.closePath();
          ctx.fillStyle = `hsla(${rimHue}, 92%, 62%, ${0.2 * alpha})`;
          ctx.fill();
        }
        ctx.restore();

        // ===== 顶部高光反射（模拟光照） =====
        const hlGrad = ctx.createRadialGradient(-r * 0.32, -r * 0.38, 0, -r * 0.32, -r * 0.38, r * 0.45);
        hlGrad.addColorStop(0, `rgba(255,255,255,${0.45 * alpha})`);
        hlGrad.addColorStop(0.25, `rgba(255,255,255,${0.12 * alpha})`);
        hlGrad.addColorStop(1, `rgba(255,255,255,0)`);
        ctx.fillStyle = hlGrad;
        ctx.beginPath();
        ctx.ellipse(-r * 0.28, -r * 0.32, r * 0.22, r * 0.16, -0.35, 0, Math.PI * 2);
        ctx.fill();

        // 小高光点
        ctx.fillStyle = `rgba(255,255,255,${0.35 * alpha})`;
        ctx.beginPath();
        ctx.arc(-r * 0.25, -r * 0.3, r * 0.06, 0, Math.PI * 2);
        ctx.fill();

        // ===== 底部反光（青蓝色调） =====
        const btmGrad = ctx.createRadialGradient(0, r * 0.48, 0, 0, r * 0.48, r * 0.35);
        btmGrad.addColorStop(0, `rgba(0,240,255,${0.18 * alpha})`);
        btmGrad.addColorStop(1, `rgba(0,240,255,0)`);
        ctx.fillStyle = btmGrad;
        ctx.beginPath();
        ctx.ellipse(0, r * 0.42, r * 0.3, r * 0.1, 0, 0, Math.PI * 2);
        ctx.fill();

        // ===== 文字内容（仅标题） =====
        if (!this.popping) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(0, 0, r * 0.88, 0, Math.PI * 2);
          ctx.clip();
          // 文字背景（增加可读性）
          ctx.fillStyle = `rgba(0,0,0,${0.3 * alpha})`;
          ctx.beginPath();
          ctx.arc(0, 0, r * 0.85, 0, Math.PI * 2);
          ctx.fill();
          // 标题文字
          ctx.fillStyle = `rgba(255,255,255,${0.92 * alpha})`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const fontSize = Math.max(12, r * 0.15);
          ctx.font = `700 ${fontSize}px 'SF Pro Display', sans-serif`;
          const titleLines = wrapText(ctx, this.data.title, r * 1.35);
          const lineHeight = fontSize * 1.35;
          const totalH = titleLines.length * lineHeight;
          let startY = -totalH / 2 + lineHeight / 2;
          titleLines.forEach((line, i) => {
            ctx.fillText(line, 0, startY + i * lineHeight);
          });
          ctx.restore();
        }

        ctx.restore();
      }

      contains(mx, my) {
        return dist({x: mx, y: my}, this) < this.radius;
      }
    }

    // ==================== 初始化气泡 ====================
    let bubbles = [];
    let poppedCount = 0;
    function initBubbles() {
      bubbles = cases.map((data, i) => new Bubble(data, i));
    }

    // ==================== 输入事件处理 ====================
    function getCanvasPos(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (clientX - rect.left) * (W / rect.width / Math.min(window.devicePixelRatio, 2)),
        y: (clientY - rect.top) * (H / rect.height / Math.min(window.devicePixelRatio, 2))
      };
    }

    function handlePointerDown(x, y) {
      if (!audioCtx) initAudio();
      input.isDown = true;
      input.downTime = performance.now();
      input.downPos = { x, y };
      input.isLongPress = false;
      // 查找点击的气泡（按深度优先）
      const sorted = [...bubbles].filter(b => b.alive && !b.popping).sort((a, b) => b.z - a.z);
      for (const b of sorted) {
        if (b.contains(x, y)) {
          // 准备可能的长按拖拽
          input.dragCandidate = b;
          b.dragOffset = { x: b.x - x, y: b.y - y };
          break;
        }
      }
    }

    function handlePointerMove(x, y) {
      // 计算鼠标速度
      mouse.vx = x - mouse.prevX;
      mouse.vy = y - mouse.prevY;
      mouse.prevX = mouse.x;
      mouse.prevY = mouse.y;
      mouse.x = x;
      mouse.y = y;

      // 长按检测
      if (input.isDown && input.dragCandidate && !input.isLongPress) {
        const pressDuration = performance.now() - input.downTime;
        const moveDist = Math.hypot(x - input.downPos.x, y - input.downPos.y);
        if (pressDuration > LONG_PRESS_MS || moveDist > 10) {
          // 进入拖拽模式
          input.isLongPress = true;
          input.draggedBubble = input.dragCandidate;
          input.draggedBubble.isDragged = true;
          canvas.style.cursor = 'grabbing';
        }
      }

      // 更新拖拽位置
      if (input.isLongPress && input.draggedBubble) {
        input.draggedBubble.dragOffset.x = input.draggedBubble.x - x;
        input.draggedBubble.dragOffset.y = input.draggedBubble.y - y;
      }
    }

    function handlePointerUp(x, y) {
      const pressDuration = performance.now() - input.downTime;
      const moveDist = Math.hypot(x - input.downPos.x, y - input.downPos.y);

      if (input.isLongPress && input.draggedBubble) {
        // 释放拖拽
        input.draggedBubble.isDragged = false;
        input.draggedBubble = null;
        input.isLongPress = false;
        canvas.style.cursor = 'crosshair';
      } else if (pressDuration < LONG_PRESS_MS && moveDist < 8) {
        // 短按 = 点击破碎
        const sorted = [...bubbles].filter(b => b.alive && !b.popping).sort((a, b) => b.z - a.z);
        for (const b of sorted) {
          if (b.contains(x, y)) {
            b.popping = true;
            break;
          }
        }
      }

      input.isDown = false;
      input.dragCandidate = null;
    }

    // Mouse events
    canvas.addEventListener('mousedown', e => {
      const pos = getCanvasPos(e.clientX, e.clientY);
      handlePointerDown(pos.x, pos.y);
    });
    canvas.addEventListener('mousemove', e => {
      const pos = getCanvasPos(e.clientX, e.clientY);
      handlePointerMove(pos.x, pos.y);
    });
    canvas.addEventListener('mouseup', e => {
      const pos = getCanvasPos(e.clientX, e.clientY);
      handlePointerUp(pos.x, pos.y);
    });

    // Touch events
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const t = e.touches[0];
      const pos = getCanvasPos(t.clientX, t.clientY);
      handlePointerDown(pos.x, pos.y);
    }, { passive: false });
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      const t = e.touches[0];
      const pos = getCanvasPos(t.clientX, t.clientY);
      handlePointerMove(pos.x, pos.y);
    }, { passive: false });
    canvas.addEventListener('touchend', e => {
      e.preventDefault();
      handlePointerUp(mouse.x, mouse.y);
    }, { passive: false });

    // ==================== 渲染循环 ====================
    let lastTime = performance.now();
    let animTime = 0;

    function drawBackground(time) {
      ctx.fillStyle = '#020408';
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
      // 星云
      const nebulaGrad = ctx.createRadialGradient(
        window.innerWidth * 0.3, window.innerHeight * 0.4, 0,
        window.innerWidth * 0.3, window.innerHeight * 0.4, window.innerWidth * 0.6
      );
      nebulaGrad.addColorStop(0, 'rgba(0,25,50,0.12)');
      nebulaGrad.addColorStop(0.5, 'rgba(8,0,30,0.06)');
      nebulaGrad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = nebulaGrad;
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
      // 星空
      stars.forEach(star => {
        const twinkle = Math.sin(time * star.twinkleSpeed + star.x * 100) * 0.4 + 0.6;
        ctx.fillStyle = `hsla(${star.hue}, 60%, 80%, ${star.alpha * twinkle})`;
        ctx.beginPath();
        ctx.arc(star.x * window.innerWidth, star.y * window.innerHeight, star.size, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    // 鼠标附近的涟漪视觉效果
    function drawMouseRipple(time) {
      const mouseSpeed = Math.hypot(mouse.vx, mouse.vy);
      if (mouseSpeed < 2) return;
      const rippleCount = 3;
      for (let i = 0; i < rippleCount; i++) {
        const offset = i * 0.3;
        const rippleTime = (time * 2 + offset) % 2;
        const r = rippleTime * 60 + 10;
        const alpha = (1 - rippleTime / 2) * 0.15 * Math.min(mouseSpeed / 20, 1);
        ctx.save();
        ctx.strokeStyle = `rgba(0,240,255,${alpha})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }

    function animate(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      animTime += dt;

      drawBackground(animTime);
      drawMouseRipple(animTime);

      // 更新所有气泡
      bubbles.forEach(b => b.update(dt, animTime));

      // 按深度排序渲染
      const sorted = [...bubbles].filter(b => b.alive).sort((a, b) => a.z - b.z);
      sorted.forEach(b => b.draw(ctx, animTime));

      // 粒子
      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => { p.update(); p.draw(ctx); });

      requestAnimationFrame(animate);
    }

    // ==================== 启动 ====================
    document.getElementById('start-btn').addEventListener('click', () => {
      initAudio();
      document.getElementById('start-overlay').classList.add('hidden');
      initBubbles();
      requestAnimationFrame(animate);
    });
  </script>
</body>
</html>
